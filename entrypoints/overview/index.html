            top: 0;
            z-index: 8;
            margin: 10px 0;
            padding: 6px 0;
            background: var(--bg);
        }

        .fo-scope[open] {
            border-bottom: 1px solid var(--line);
        }

        .fo-scope>summary {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            list-style: none;
        }

        .fo-scope>summary::-webkit-details-marker {
            display: none;
        }

        .fo-scope>summary::before {
            content: '▸';
            display: inline-block;
            width: 12px;
            color: var(--dim);
            font-size: 10px;
        }

        .fo-scope[open]>summary::before {
            content: '▾';
        }

        .fo-scope>summary:hover::before {
            color: var(--sparkle);
        }

        .fo-scope-label {
            font-size: 11px;
            color: var(--dim);
            letter-spacing: var(--track-label);
        }

        .fo-scope-hint {
            font-size: 11px;
            color: var(--sparkle);
        }

        .fo-scope-body {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
            padding: 8px 0 4px 18px;
            max-height: 40vh;
            overflow-y: auto;
        }

        /* 基地 chip 的海域名：與基地名同列但視覺分層，才看得出「哪個基地・哪個海域」。 */
        .fo-scope-body .fo-area,
        .fo-export-choices .fo-area {
            margin-left: 2px;
        }

        .fo-body {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* 基地航空隊卡：獨立多欄 grid。180px 門檻是拿瀏覽器視窗 820px 實測回推的
           （側欄釘選佔掉 200px＋#content 左右 padding 40px，可用寬度只剩約 580px，
           不是天真以為的 820 全部歸內容區——820px 視窗、側欄釘選、三欄，扣打就是
           這樣，別看到 820 就直接拿去除 3）。 */
        .fo-lbas-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
            align-items: start;
        }

        /* 艦隊卡：一隊一個全寬卡，內部再用 .fo-ship-row 橫向排船——見上方大註解。 */
        .fo-fleets {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .fo-fleet {
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 8px 10px;
        }

        .fo-fleet h3 {
            margin: 0 0 6px;
            font-size: 13px;
            color: var(--sparkle);
        }

        .fo-area {
            font-size: 11px;
            font-weight: 400;
            color: var(--dim);
        }

        .fo-lbas-head {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 11px;
            color: var(--dim);
            margin-bottom: 4px;
        }

        /* 一整隊橫向排開，一艘船一欄，**靠左對齊、不拉伸**（見 fleet-overview.ts 檔頭
           修正記錄 7）：欄寬用 `flex: 0 1 var(--fo-col-w)`——不足滿編時每欄就停在
           --fo-col-w（一個「裝備全名讀得完」的寬度），滿編（6/7 艘）擠不下才依同一個
           basis 平均收縮回原設計的窄欄＋名稱省略。**不可改回 `flex: 1 1 0`**：那會讓
           一艘船的隊伍把艦名／Lv／運／士氣拉開到整行兩端，資訊反而更難讀（使用者回報）。
           不可加 flex-wrap（加了船會換行變回直的，就失去「一隊一行」的意義）。 */
        .fo-ship-row {
            display: flex;
            justify-content: flex-start;
            gap: 4px;
            align-items: stretch;
        }

        /* 艦隊標題列下方的合計徽章（Lv／索敵／制空／TP／速力／火力），比照使用者指定的
           參照版面：一列方框徽章。面板的 .fsummary 是同一批數字但另一套視覺（那邊擠在
           420px 面板寬裡），兩邊刻意不共用 class——這裡有整個瀏覽器寬度可用。 */
        .fo-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin: 0 0 6px;
        }

        .fo-badge {
            display: inline-flex;
            align-items: baseline;
            gap: 4px;
            padding: 2px 8px;
            border: 1px solid var(--line);
            border-radius: 4px;
            font-size: 11px;
            color: var(--dim);
            letter-spacing: var(--track-label);
        }

        .fo-badge b {
            color: var(--text);
            font-variant-numeric: tabular-nums;
        }

        /* 制空的熟練度成分可能已過時＝估算，沿用面板既有的虛線底線語彙（.badge-tag.est）。 */
        .fo-badge b.est {
            border-bottom: 1px dashed currentColor;
        }

        /* --fo-col-w＝「裝備全名讀得完」的基準欄寬（20em ≒ 260px，扣掉圖示與間距後
           約 235px 給名稱＝中文約 21 字）。它同時是**上限**（flex-grow 0）與滿編時的
           **收縮基準**（同一個 basis ⇒ 六欄等寬），故只要調這一個值就同時改兩態。 */
        .fo-ship-col {
            flex: 0 1 var(--fo-col-w, 20em);
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding: 2px 5px;
            border-left: 1px solid var(--line);
        }

        .fo-ship-col:first-child {
            border-left: 0;
        }

        /* 艦名獨佔一列（參照圖裡它壓在立繪上方）：本擴充不畫立繪，改用一條底線與底色
           把它與下方數值分開，讓「一艘船一張卡」的邊界仍然讀得出來。 */
        .fo-ship-name {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            text-align: center;
            font-size: 12px;
            padding: 1px 2px;
            border-bottom: 1px solid var(--line);
            background: color-mix(in srgb, var(--line) 22%, transparent);
        }

        .fo-ship-head,
        .fo-ship-stats {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0 4px;
            min-width: 0;
        }

        /* 運／士氣的欄名（HP 有斜線自帶辨識度，不加標籤）。這一列在窄欄會換行——
           寧可換行也不留三個沒有標籤的裸數字（缺標籤時 24 / 34/34 / 49 分不出誰是誰）。 */
        .fo-ship-stats i {
            font-style: normal;
            font-size: 9px;
            letter-spacing: var(--track-label);
            color: var(--dim);
        }

        /* 縱向裝備清單：一格一行，icon＋全名（ellipsis）＋改修★／熟練度符號靠右
           （搭載數與熟練度數字刻意不畫，見 fleet-overview.ts 檔頭修正記錄 6）——
           對齊 samples/Fleet_formation.png 的清晰度。艦艇欄與基地航空隊卡共用同一套
           樣式；欄寬夠看全名，欄擠時 .fo-gear-name 的 ellipsis 自然截斷。 */
        .fo-gear-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding: 2px 0 0;
        }

        .fo-gear-row {
            display: flex;
            align-items: center;
            gap: 5px;
            min-width: 0;
            font-size: 11px;
        }

        .fo-gear-row.empty {
            opacity: .55;
        }

        .fo-gear-row .g-icon,
        .fo-gear-row .g-icon-slot {
            width: 14px;
            height: 14px;
            flex: none;
        }

        .fo-gear-row .g-icon-slot {
            display: inline-block;
            outline: 1px dashed var(--line);
            outline-offset: -1px;
            border-radius: 2px;
        }

        .fo-gear-row.ex .g-icon {
            outline: 1px dashed var(--brass);
            outline-offset: 1px;
            border-radius: 2px;
        }

        .fo-gear-name {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .fo-gear-mark {
            flex: none;
            font-style: normal;
            font-weight: 700;
            font-size: 10px;
            color: var(--sparkle);
        }

        .fo-stype {
            font-size: 10px;
            letter-spacing: var(--track-label);
            color: var(--dim);
            min-width: 26px;
        }

        /* 熟練度：使用者指定不顯示數字，只留一個符號（數字退到 title）。三段顏色＝
           「有／中／滿」，不畫遊戲的 0-7 階帶章（那需要另一組美術資源）。 */
        .fo-gear-alv {
            flex: none;
            font-size: 10px;
            font-weight: 700;
            color: var(--dim);
        }

        .fo-gear-alv.mid {
            color: var(--brass, #c9a227);
        }

        .fo-gear-alv.hi {
            color: var(--sparkle);
        }

        .fo-luck,
        .fo-lv,
        .fo-hp {
            font-size: 11px;
            color: var(--dim);
            font-variant-numeric: tabular-nums;
        }

        .fo-hp.shouha {
            color: var(--dmg-minor, #d4b83a);
        }

        .fo-hp.chuha {
            color: var(--dmg-mid, #e08b3d);
        }

        .fo-hp.taiha {
            color: var(--dmg-major, #e05555);
        }

        .fo-cond {
            font-size: 11px;
        }

        .fo-cond.fo-sparkle {
            color: var(--sparkle);
        }

        .fo-cond.fo-tired {
            color: var(--dmg-mid, #e08b3d);
        }

        .fo-cond.fo-heavy {
            color: var(--dmg-major, #e05555);
        }

        /* 傳去外部工具前的選擇框（使用者要求，見 fleet-overview.ts 檔頭修正記錄 5）。
           原生 <dialog>：showModal() 自帶 focus trap／Escape 關閉／::backdrop，
           不必為此另外管理 focus 或鍵盤事件。 */
        .fo-export-dialog {
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 14px 16px;
            background: var(--panel);
            color: var(--text);
            max-width: min(480px, calc(100vw - 32px));
        }

        .fo-export-dialog::backdrop {
            background: color-mix(in srgb, black 55%, transparent);
        }

        .fo-export-title {
            margin: 0 0 8px;
            font-size: 13px;
            color: var(--sparkle);
        }

        .fo-export-choices {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            max-height: 40vh;
            overflow-y: auto;
        }

        .fo-export-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 12px;
        }

        .g-icon {
            width: 16px;
            height: 16px;
            vertical-align: middle;
        }

        .m-icon {
            width: 14px;
            height: 14px;
            vertical-align: middle;
        }

        /* ── 艦娘全覽（詳細清單）──
           工具列常駐、條件抽屜可收合、生效條件以 chip 常駐顯示。表格很寬（十幾個素質欄），
           故橫向捲動在 .rs-table-wrap 內發生，頁面本身永不橫捲；艦名欄黏在左側，
           捲到右邊看對空/索敵時仍知道在看誰。 */
        .rs-bar {
            position: sticky;
            top: 0;
            z-index: 5;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            margin: -4px 0 8px;
            padding: 8px 0;
            background: var(--bg);
            border-bottom: 1px solid var(--line);
        }

        .rs-search,
        .rs-bar select,
        .rs-range input {
            min-height: 30px;
            padding: 4px 8px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: var(--panel);
            color: var(--text);
            font: inherit;
            transition: border-color 100ms ease-out, transform 100ms ease-out;
        }

        .rs-search:active,
        .rs-bar select:active,
        .rs-range input:active {
            border-color: var(--sparkle);
            transform: scale(.97);
        }

        .rs-search { min-width: 160px; }

        .rs-inline {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--dim);
            font-size: 12px;
        }

        /* 生效條件數：收起抽屜時唯一的「還有東西在篩」提示，故用高亮色而非弱化色 */
        .rs-badge {
            margin-left: 6px;
            padding: 0 5px;
            border-radius: 8px;
            background: var(--sparkle);
            color: var(--bg);
            font-size: 10px;
            font-weight: 700;
        }

        /* .rs-colmenu／.eq-colmenu **刻意不設 position: relative**——下拉要錨定整條工具列，
           不是這顆按鈕（見 .rs-colbox）。 */
        .rs-colmenu summary,
        .eq-colmenu summary { list-style: none; cursor: pointer; }

        .rs-colmenu summary::-webkit-details-marker,
        .eq-colmenu summary::-webkit-details-marker { display: none; }

        /* 欄位下拉：**釘在工具列下方、左右與工具列同寬**。
           原本是 `right: 0` 貼齊按鈕右緣，但工具列一換行、按鈕就跑到最左邊，下拉隨之往左
           溢出內容區、被側欄整片蓋掉勾選框（實機回報）。改以工具列為錨點後，按鈕落在哪一
           列都不影響，左右兩側都不可能溢出；欄位多時往下長而不是往旁邊擠，也比原本
           固定三欄好讀。**別改回貼齊按鈕的 right: 0。** */
        .rs-colbox,
        .eq-colbox {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            z-index: 6;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 4px;
            margin-top: 4px;
            padding: 8px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel);
            box-shadow: 0 6px 18px rgb(0 0 0 / .28);
        }

        /* 全選／清除／預設橫跨整個下拉寬度，不佔用欄位勾選格 */
        .eq-colops {
            display: flex;
            gap: 3px;
            grid-column: 1 / -1;
            margin-top: 2px;
            padding-top: 6px;
            border-top: 1px solid var(--line);
        }

        /* `hidden` 屬性的 UA 規則是 display:none，特異性與這裡的類別選擇器相同、
           但排在前面會被蓋掉——凡是自己設了 display 的元素都要補一條，否則
           `el.hidden = true` 在畫面上完全沒效果。 */
        .rs-drawer[hidden],
        .rs-chips[hidden],
        .rs-pager[hidden] {
            display: none;
        }

        .rs-drawer {
            display: grid;
            gap: 6px;
            margin-bottom: 8px;
            padding: 10px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel);
        }

        .rs-row {
            display: grid;
            grid-template-columns: 108px minmax(0, 1fr);
            gap: 8px;
            align-items: center;
        }

        .rs-row-label {
            color: var(--dim);
            font-size: 11px;
            letter-spacing: var(--track-label);
        }

        .rs-info {
            margin-left: 3px;
            padding: 0 3px;
            border: 1px solid var(--line);
            border-radius: 50%;
            font-size: 9px;
            font-style: normal;
        }

        /* 分段控制：一組互斥選項連成一條，選中者亮起。比 select 好在「有幾個選項、
           現在選的是哪個」不必展開就看得到——參照圖的可掃描性正是來自這點。
           出擊紀錄的通常／活動分類（.sl-cat）沿用這組樣式，改動時記得兩邊都看。 */
        .rs-seg {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
        }

        .rs-seg button,
        .rs-mini {
            min-height: 24px;
            padding: 2px calc(8px - var(--track-label)) 2px 8px;
            border: 1px solid var(--line);
            border-radius: 4px;
            background: var(--bg);
            color: var(--text);
            font: inherit;
            font-size: 11px;
            letter-spacing: var(--track-label);
            cursor: pointer;
            transition: border-color 100ms ease-out, color 100ms ease-out, transform 100ms ease-out;
        }

        .rs-seg button:active,
        .rs-mini:active {
            border-color: var(--sparkle);
            transform: scale(.97);
        }

        .rs-seg button.on {
            border-color: var(--sparkle);
            background: color-mix(in srgb, var(--brass) 22%, transparent);
            color: var(--sparkle);
        }

        .rs-stypes {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            align-items: center;
        }

        .rs-stype-ops {
            display: flex;
            gap: 3px;
            margin-left: 4px;
        }

        .rs-range {
            display: flex;
            gap: 6px;
            align-items: center;
            color: var(--dim);
            font-size: 11px;
        }

        .rs-range input { width: 72px; }

        .rs-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 8px;
        }

        .rs-chip {
            display: inline-flex;
            gap: 5px;
            align-items: center;
            padding: 2px calc(7px - var(--track-label)) 2px 7px;
            border: 1px solid var(--sparkle);
            border-radius: 4px;
            background: color-mix(in srgb, var(--brass) 16%, transparent);
            color: var(--sparkle);
            font: inherit;
            font-size: 11px;
            letter-spacing: var(--track-label);
            cursor: pointer;
            transition: border-color 100ms ease-out, transform 100ms ease-out;
        }

        .rs-chip:active { transform: scale(.97); }
        .rs-chip span { opacity: .75; }

        .rs-summary {
            margin-bottom: 6px;
            color: var(--dim);
            font-size: 11px;
            letter-spacing: var(--track-label);
        }

        .rs-table-wrap {
            /* 橫向：欄位多達十幾個，捲動一律關在這個容器裡，頁面本身永不橫捲。
               縱向：給一個上限讓容器自己成為捲動區，`thead` 的 sticky 才有作用——
               每頁選「全部」時（四百多列）沒有黏住的表頭根本讀不出在看哪一欄。 */
            overflow: auto;
            max-height: min(70vh, 760px);
            border: 1px solid var(--line);
            border-radius: 8px;
        }

        .rs-table {
            /* max-content 讓每欄依內容寬度排（十幾個數值欄各自很窄），min-width 保證
               列少時仍撐滿容器。用 width:100% 會把欄位壓扁到數字換行。 */
            width: max-content;
            min-width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 12px;
        }

        .rs-th {
            position: sticky;
            top: 0;
            z-index: 2;
            padding: 6px 8px;
            border-bottom: 1px solid var(--line);
            background: var(--panel);
            color: var(--dim);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: var(--track-label);
            text-align: left;
            white-space: nowrap;
        }

        .rs-th.num { text-align: right; }
        .rs-th.sortable { cursor: pointer; }
        .rs-th.sortable:hover { color: var(--text); }
        .rs-th.active { color: var(--sparkle); }
        .rs-arrow { margin-left: 2px; font-size: 8px; }

        .rs-table td {
            padding: 4px 8px;
            border-bottom: 1px solid color-mix(in srgb, var(--line) 55%, transparent);
            white-space: nowrap;
        }

        .rs-table td.num {
            font-variant-numeric: tabular-nums;
            text-align: right;
        }

        .rs-table tbody tr:hover td { background: color-mix(in srgb, var(--brass) 8%, transparent); }
        .rs-table tbody tr:last-child td { border-bottom: none; }

        /* 艦名欄黏在左緣。底色必須不透明，否則捲動時下層列會透出來。 */
        .rs-table .rs-c-name {
            position: sticky;
            left: 0;
            z-index: 1;
            background: var(--panel);
            border-right: 1px solid var(--line);
        }

        .rs-table th.rs-c-name { z-index: 3; }
        .rs-table tbody tr:hover .rs-c-name { background: color-mix(in srgb, var(--brass) 8%, var(--panel)); }

        .rs-name {
            display: inline-block;
            max-width: 150px;
            overflow: hidden;
            font-weight: 600;
            text-overflow: ellipsis;
            vertical-align: bottom;
        }

        .rs-lock,
        .rs-ring { margin-left: 3px; font-size: 10px; }

        .rs-stype {
            padding: 1px calc(4px - var(--track-tag)) 1px 4px;
            border: 1px solid var(--line);
            border-radius: 4px;
            color: var(--dim);
            font-size: 9px;
            letter-spacing: var(--track-tag);
        }

        .rs-date { font-variant-numeric: tabular-nums; }

        .rs-nation {
            padding: 1px calc(4px - var(--track-tag)) 1px 4px;
            border: 1px solid var(--line);
            border-radius: 4px;
            color: var(--dim);
            font-size: 9px;
            letter-spacing: var(--track-tag);
        }
        .rs-tag { color: var(--sally-stamp); }

        /* 士氣：キラキラ與疲勞是遊戲內客觀狀態，用語意色（同 --dmg-* 的不隨主題原則） */
        .rs-cond.sparkle { color: var(--sparkle); }
        .rs-cond.tired1 { color: var(--dmg-mid); }
        .rs-cond.tired2 { color: var(--dmg-major); }

        .ships-hp.shouha { color: var(--dmg-minor); }
        .ships-hp.chuha { color: var(--dmg-mid); }
        .ships-hp.taiha { color: var(--dmg-major); }

        /* 裝備格：一律畫滿真實槽數，空槽是虛線空框（「這格空著」與「沒有這一格」不同） */
        .rs-slots {
            display: inline-flex;
            gap: 3px;
            align-items: center;
        }

        .rs-slot {
            position: relative;
            display: inline-flex;
            width: 22px;
            height: 20px;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--line);
            border-radius: 4px;
            background: var(--bg);
        }

        .rs-slot.empty { border-style: dashed; opacity: .55; }
        .rs-slot.ex { border-color: var(--brass); }

        .rs-star,
        .rs-alv {
            position: absolute;
            bottom: -2px;
            font-size: 8px;
            font-weight: 700;
            line-height: 1;
            text-shadow: 0 0 2px var(--bg), 0 0 2px var(--bg);
        }

        .rs-star { right: -1px; color: var(--sparkle); }
        .rs-alv { left: -1px; color: var(--dmg-minor); text-decoration: none; }

        /* 第三個角標：艦載機槽／基地中隊的搭載機數（艦隊全覽用，一般裝備格無此欄）。
           置頂避開 .rs-star（右下）／.rs-alv（左下）。 */
        .rs-count {
            position: absolute;
            top: -2px;
            right: -1px;
            font-style: normal;
            font-size: 8px;
            font-weight: 700;
            line-height: 1;
            color: var(--dim);
            text-shadow: 0 0 2px var(--bg), 0 0 2px var(--bg);
        }

        .rs-pager {
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: center;
            margin-top: 8px;
        }

        .rs-pageno {
            color: var(--dim);
            font-size: 11px;
            font-variant-numeric: tabular-nums;
        }

        /* 入手日：auto 觀測值唯讀（帶下虛線示意「已確定」）；baseline 可手填 */
        .ships-date-auto {
            border-bottom: 1px dotted var(--line);
            cursor: help;
        }

        .ships-date-input {
            width: 128px;
            padding: 1px 4px;
            border: 1px solid var(--line);
            border-radius: 4px;
            background: var(--bg);
            color: var(--text);
            font: inherit;
            font-size: 11px;
        }

        .ships-date-input:focus {
            border-color: var(--sparkle);
            outline: none;
        }

        /* ── 裝備全覽 ──
           主導覽是那排裝備圖示（.eq-rail），不是類別下拉：挑裝備時玩家腦中的第一層
           分類就是「圖示長什麼樣」，而本專案已經有 74 顆原創圖示。詳見 sections/equipment.ts。 */
        .eq-rail {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 8px;
            padding: 8px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel);
            /* 持有的圖示可達 59 種，窄視窗會疊成七八列，把工具列與清單整個推出畫面。
               給高度上限讓它自己成為捲動區，其餘版面的位置就不受圖示數量影響。 */
            max-height: 28vh;
            overflow-y: auto;
        }

        .eq-icon {
            position: relative;
            display: inline-flex;
            width: 38px;
            height: 34px;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: var(--bg);
            cursor: pointer;
            transition: border-color 100ms ease-out, background-color 100ms ease-out, transform 100ms ease-out;
        }

        .eq-icon .g-icon {
            width: 24px;
            height: 24px;
        }

        /* 持有件數：疊在圖示右下角。圖示本身已帶深墨描邊，故數字用陰影托底即可讀。 */
        .eq-icon b {
            position: absolute;
            right: 2px;
            bottom: 0;
            color: var(--dim);
            font-size: 9px;
            font-weight: 700;
            line-height: 1;
            text-shadow: 0 0 2px var(--bg), 0 0 2px var(--bg), 0 0 2px var(--bg);
        }

        .eq-icon:hover { border-color: var(--sparkle); }
        .eq-icon:active { transform: scale(.97); }

        .eq-icon.on {
            border-color: var(--sparkle);
            background: color-mix(in srgb, var(--brass) 22%, transparent);
        }

        .eq-icon.on b { color: var(--sparkle); }

        .eq-bar {
            position: sticky;
            top: 0;
            z-index: 5;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            margin: -4px 0 8px;
            padding: 8px 0;
            background: var(--bg);
            border-bottom: 1px solid var(--line);
        }

        .eq-search,
        .eq-bar select {
            min-height: 30px;
            padding: 4px 8px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: var(--panel);
            color: var(--text);
            font: inherit;
            transition: border-color 100ms ease-out, transform 100ms ease-out;
        }

        /* 可伸縮：寬視窗時吃掉剩餘空間，窄視窗時縮到 140px 而不是把工具列撐爆 */
        .eq-search {
            flex: 1 1 180px;
            min-width: 140px;
            max-width: 320px;
        }

        .eq-search:active,
        .eq-bar select:active {
            border-color: var(--sparkle);
            transform: scale(.97);
        }

        .eq-group {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .eq-group-label {
            color: var(--dim);
            font-size: 11px;
            letter-spacing: var(--track-label);
        }

        .eq-seg {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
        }

        .eq-seg button {
            min-height: 26px;
            padding: 2px calc(8px - var(--track-label)) 2px 8px;
            border: 1px solid var(--line);
            border-radius: 4px;
            background: var(--bg);
            color: var(--text);
            font: inherit;
            font-size: 11px;
            letter-spacing: var(--track-label);
            cursor: pointer;
            transition: border-color 100ms ease-out, color 100ms ease-out, transform 100ms ease-out;
        }

        .eq-seg button:active { transform: scale(.97); }

        .eq-seg button.on {
            border-color: var(--sparkle);
            background: color-mix(in srgb, var(--brass) 22%, transparent);
            color: var(--sparkle);
        }

        .eq-chips[hidden] { display: none; }

        .eq-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 8px;
        }

        .eq-chip {
            display: inline-flex;
            gap: 5px;
            align-items: center;
            padding: 2px calc(7px - var(--track-label)) 2px 7px;
            border: 1px solid var(--sparkle);
            border-radius: 4px;
            background: color-mix(in srgb, var(--brass) 16%, transparent);
            color: var(--sparkle);
            font: inherit;
            font-size: 11px;
            letter-spacing: var(--track-label);
            cursor: pointer;
            transition: transform 100ms ease-out;
        }

        .eq-chip:active { transform: scale(.97); }
        .eq-chip span { opacity: .75; }

        .eq-summary {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 10px;
            margin-bottom: 6px;
            color: var(--dim);
            font-size: 11px;
            letter-spacing: var(--track-label);
        }

        .eq-cap { color: var(--brass); }

        /* 裝備名（表格與圖磚共用）：整塊就是展開鈕，點名字即可展開逐顆實例。 */
        .eq-name {
            display: inline-flex;
            gap: 6px;
            align-items: center;
            max-width: 100%;
            /* flex 項目的預設 min-width 是 auto＝不得縮到比內容窄，長裝備名會把卡片
               整個撐破（窄視窗尤其明顯）。要讓裡面的 .eq-label 有機會截斷或換行，
               這一層與 .eq-title 都必須開 min-width: 0。 */
            min-width: 0;
            padding: 0;
            border: 0;
            background: none;
            color: inherit;
            font: inherit;
            text-align: left;
            cursor: pointer;
        }

        /* 展開箭頭的方向由 JS 換字元（▸/▾）決定，不用 transform 旋轉——見 equipment.ts */
        .eq-caret {
            color: var(--dim);
            font-size: 9px;
        }

        .eq-ico {
            display: inline-flex;
            width: 22px;
            height: 20px;
            flex: none;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--line);
            border-radius: 4px;
            background: var(--bg);
        }

        .eq-title {
            display: flex;
            min-width: 0;
            flex-direction: column;
        }

        /* 表格：一列一行，長名截斷成「…」（列高必須一致才好橫向掃描） */
        .eq-label {
            overflow: hidden;
            font-weight: 600;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* 圖磚：卡片有縱向空間，長名**換行**而不是截斷——截斷後
           「九七式艦攻改(熟練) 試製三号戊型…」這種名字全都長一樣，根本分不出是哪一顆。
           裝備名沒有空格可斷（日文全形連寫），故需要 anywhere 才斷得開。 */
        .eq-card .eq-label {
            overflow: visible;
            white-space: normal;
            overflow-wrap: anywhere;
        }

        .eq-card .eq-cat {
            white-space: normal;
            overflow-wrap: anywhere;
        }

        .eq-cat {
            color: var(--dim);
            font-size: 10px;
            letter-spacing: var(--track-tag);
        }

        .eq-cat i {
            margin-left: 4px;
            padding: 0 calc(3px - var(--track-tag)) 0 3px;
            border: 1px solid var(--line);
            border-radius: 4px;
            font-size: 9px;
            font-style: normal;
        }

        /* 改修分佈：★MAX 用高亮色（那是玩家真正在找的東西），其餘弱化 */
        .eq-stars {
            display: inline-flex;
            flex-wrap: wrap;
            gap: 3px;
            align-items: center;
        }

        .eq-star {
            padding: 0 calc(4px - var(--track-tag)) 0 4px;
            border: 1px solid var(--line);
            border-radius: 4px;
            color: var(--sparkle);
            font-size: 10px;
            letter-spacing: var(--track-tag);
            white-space: nowrap;
        }

        .eq-star.max {
            border-color: var(--sparkle);
            background: color-mix(in srgb, var(--brass) 20%, transparent);
        }

        .eq-star.zero { color: var(--dim); }
        .eq-star i { font-style: normal; opacity: .7; }
        .eq-more { color: var(--dim); font-size: 10px; }
        .eq-zero { color: var(--stub); }

        /* 逐顆實例（展開後）。彙總答不了「是哪一顆閒著」，這裡才是。 */
        .eq-inst {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 6px;
            margin: 4px 0 0;
            padding: 6px 8px;
            border-radius: 6px;
            background: color-mix(in srgb, var(--line) 22%, transparent);
            font-size: 11px;
            list-style: none;
        }

        .eq-inst li {
            display: inline-flex;
            gap: 4px;
            align-items: center;
            padding: 1px 6px;
            border: 1px solid var(--line);
            border-radius: 4px;
            background: var(--panel);
        }

        .eq-i-star { color: var(--sparkle); }
        .eq-i-alv { color: var(--dmg-minor); }
        .eq-i-where.lbas { color: var(--brass); }
        .eq-i-where i { color: var(--dim); font-size: 9px; font-style: normal; }

        .eq-i-where b {
            padding: 0 3px;
            border: 1px solid var(--brass);
            border-radius: 4px;
            color: var(--brass);
            font-size: 9px;
            font-weight: 400;
        }

        .eq-i-idle { color: var(--dim); }

        /* 同規格實例的疊加計數（★0 閒置 ×18）。與改修分佈欄的 ×n 同一個讀法，
           故同樣用高亮色，數字才是這一行的重點。 */
        .eq-i-n {
            color: var(--sparkle);
            font-variant-numeric: tabular-nums;
        }

        /* ── 圖磚模式 ── */
        .eq-grid {
            display: grid;
            /* 下限包 min()：視窗比 240px 還窄時退成單欄，而不是撐出橫向捲動
               （頁面本身永不橫捲——橫捲只允許發生在表格自己的容器裡）。 */
            grid-template-columns: repeat(auto-fill, minmax(min(240px, 100%), 1fr));
            gap: 8px;
            align-items: start;
        }

        .eq-card {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 10px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel);
        }

        .eq-card.open { border-color: var(--brass); }

        .eq-card-head {
            display: flex;
            gap: 6px;
            align-items: flex-start;
            justify-content: space-between;
        }

        /* 名稱吃掉剩餘寬度並允許收縮，數量則固定不縮（見 .eq-name 的 min-width 說明） */
        .eq-card-head .eq-name {
            flex: 1 1 auto;
            align-items: flex-start;
        }

        /* 換行後圖示與箭頭要對齊第一行，不要跟著置中飄到中間 */
        .eq-card-head .eq-caret,
        .eq-card-head .eq-ico {
            margin-top: 1px;
        }

        .eq-count {
            flex: none;
            color: var(--sparkle);
            font-size: 15px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            letter-spacing: var(--track-title);
        }

        .eq-card-row {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 6px;
            align-items: center;
        }

        /* 裝備中／閒置比例條：本卡唯一的圖形化編碼（見 equipment.ts 版面取捨）。
           類別名刻意不叫 .eq-bar——那是上面的工具列，同名會讓兩者互相套用樣式。 */
        .eq-usage { gap: 6px; }

        .eq-meter {
            display: block;
            overflow: hidden;
            width: 72px;
            height: 5px;
            flex: none;
            border-radius: 3px;
            background: color-mix(in srgb, var(--line) 70%, transparent);
        }

        .eq-meter-fill {
            display: block;
            height: 100%;
            border-radius: 3px;
            background: var(--brass);
        }

        .eq-usage-text {
            color: var(--dim);
            font-size: 10px;
            letter-spacing: var(--track-tag);
        }

        .eq-usage-text i { font-style: normal; opacity: .8; }

        .eq-stats { gap: 3px 4px; }

        .eq-stat {
            padding: 1px calc(5px - var(--track-tag)) 1px 5px;
            border: 1px solid var(--line);
            border-radius: 4px;
            font-size: 10px;
            font-variant-numeric: tabular-nums;
            letter-spacing: var(--track-tag);
        }

        .eq-stat i {
            margin-right: 3px;
            color: var(--dim);
            font-style: normal;
        }

        /* ── 詳細清單模式 ── */
        .eq-table-wrap {
            /* 橫向：十四個欄位的捲動一律關在這個容器裡，頁面本身永不橫捲。
               縱向：給一個上限讓容器自己成為捲動區，thead 的 sticky 才有作用。 */
            overflow: auto;
            max-height: min(70vh, 760px);
            border: 1px solid var(--line);
            border-radius: 8px;
        }

        .eq-table {
            /* max-content 讓十四個欄位各依內容寬度排；min-width 保證列少時仍撐滿容器 */
            width: max-content;
            min-width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 12px;
        }

        .eq-th {
            position: sticky;
            top: 0;
            z-index: 2;
            padding: 6px 8px;
            border-bottom: 1px solid var(--line);
            background: var(--panel);
            color: var(--dim);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: var(--track-label);
            text-align: left;
            white-space: nowrap;
        }

        .eq-th.num { text-align: right; }
        .eq-th.sortable { cursor: pointer; }
        .eq-th.sortable:hover { color: var(--text); }
        .eq-th.active { color: var(--sparkle); }
        .eq-arrow { margin-left: 2px; font-size: 8px; }

        .eq-table td {
            padding: 4px 8px;
            border-bottom: 1px solid color-mix(in srgb, var(--line) 55%, transparent);
            white-space: nowrap;
        }

        .eq-table td.num {
            font-variant-numeric: tabular-nums;
            text-align: right;
        }

        .eq-table tbody tr:hover td { background: color-mix(in srgb, var(--brass) 8%, transparent); }

        /* 裝備名欄黏在左緣。底色必須不透明，否則捲動時下層列會透出來。 */
        .eq-table .eq-c-name {
            position: sticky;
            left: 0;
            z-index: 1;
            max-width: 260px;
            background: var(--panel);
            border-right: 1px solid var(--line);
        }

        .eq-table th.eq-c-name { z-index: 3; }
        .eq-table tbody tr:hover .eq-c-name { background: color-mix(in srgb, var(--brass) 8%, var(--panel)); }

        .eq-subrow td {
            padding: 0 8px 6px;
            white-space: normal;
        }

        /* ── 資源紀錄（sections/resource-log.ts）──
           趨勢圖是**小倍數**：一項資材一格、各自 y 軸、共用同一條 x 軸。燃料十萬級、
           螺絲千級，疊成同一條軸會讓消耗品全部貼底變直線（雙 y 軸更糟，兩套刻度沒有
           共同基準）。跨資材的比較交給十字準線——滑過任一格，八格一起對到同一個時刻。 */
        .rl-label,
        .el-label {
            align-self: center;
            color: var(--dim);
            font-size: 12px;
        }

        .rl-summary {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 20px;
            align-items: baseline;
            margin-bottom: 10px;
            padding: 8px 10px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel);
        }

        .rl-sum-block {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: baseline;
        }

        .rl-sum-label {
            color: var(--dim);
            font-size: 11px;
            letter-spacing: var(--track-label);
        }

        .rl-sum-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 8px;
        }

        .rl-sum-meta {
            flex-basis: 100%;
            font-size: 11px;
            letter-spacing: var(--track-label);
        }

        .rl-chip {
            display: inline-flex;
            gap: 3px;
            align-items: center;
            font-size: 12px;
            font-variant-numeric: tabular-nums;
        }

        /* 資源消長是**新的語意角色**（增加／消耗），不挪用 --dmg-*（大破/中破/小破）
           或 --sally-*（標籤狀態）——那兩組承載的是完全無關的狀態，共用會互相稀釋
           （design-guidelines §4.5）。色值已用 dataviz 驗證器對深淺兩種底色跑過
           亮度帶／彩度／CVD 分離／對比四項檢查。 */
        .rl-gain { color: var(--res-gain); }
        .rl-drain { color: var(--res-drain); }
        .rl-flat { color: var(--dim); }

        /* ── 折線圖：一張大圖、八條線、圖例即開關 ──
           曾經做成八張小圖各自 y 軸，被使用者明確否決；量級差距改由「開關」解決
           （y 軸只依顯示中的序列取值域，見 utils/line-chart.ts）。**雙 y 軸仍然不做。** */
        .rl-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            align-items: center;
            margin-bottom: 6px;
        }

        .rl-leg {
            display: inline-flex;
            gap: 5px;
            align-items: center;
            min-height: 26px;
            padding: 2px calc(8px - var(--track-label)) 2px 8px;
            border: 1px solid var(--line);
            border-radius: 4px;
            background: var(--bg);
            color: var(--dim);
            font: inherit;
            font-size: 11px;
            letter-spacing: var(--track-label);
            cursor: pointer;
            transition: border-color 100ms ease-out, color 100ms ease-out, opacity 100ms ease-out, transform 100ms ease-out;
        }

        .rl-leg:active { transform: scale(.97); }

        /* 關掉的序列**留在列上**（不是消失）——不然使用者不知道還有那一項可以打開。
           關掉＝淡化＋空心色塊；打開＝實心色塊＋主要文字色。 */
        .rl-leg:not(.on) { opacity: .5; }

        .rl-leg.on {
            border-color: var(--dim);
            color: var(--text);
        }

        .rl-leg .m-icon { width: 13px; height: 13px; }

        .rl-leg-now { font-variant-numeric: tabular-nums; }

        /* 色塊吃 .rl-s{i} 設的 color（故用 currentColor）；未開啟時只留外框 */
        .rl-swatch {
            flex: none;
            width: 10px;
            height: 10px;
            border: 2px solid currentColor;
            border-radius: 2px;
        }

        .rl-leg.on .rl-swatch { background: currentColor; }

        .rl-chart {
            padding: 8px 10px 4px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel);
        }

        /* **等比縮放，不用 preserveAspectRatio="none"**：非等比會把 y 軸刻度的文字
           橫向拉伸（容器 1600px 時字被拉成 1.6 倍寬的怪字）。改成等比＋aspect-ratio，
           寬度撐滿容器、高度跟著走；線寬另用 vector-effect 固定成實際像素。 */
        .rl-svg {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 1000 / 300;
        }

        /* `hidden` 是 HTML 屬性，**對 SVG 元素無效**（十字準線與游標點會一直畫在
           (0,0)，看起來像左上角一顆莫名其妙的點）。用 CSS 明確關掉。 */
        .rl-cross[hidden],
        .rl-cursor[hidden] { display: none; }

        .rl-grid {
            stroke: var(--line);
            stroke-width: 1;
            vector-effect: non-scaling-stroke;
        }

        .rl-ytick {
            fill: var(--dim);
            font-size: 11px;
            font-variant-numeric: tabular-nums;
            text-anchor: end;
        }

        .rl-line {
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linejoin: round;
            stroke-linecap: round;
            vector-effect: non-scaling-stroke;
        }

        .rl-dot { fill: currentColor; }

        .rl-cross {
            stroke: var(--dim);
            stroke-width: 1;
            stroke-dasharray: 3 3;
            vector-effect: non-scaling-stroke;
        }

        /* 游標點壓在線上仍要看得出是哪一條：實心＝序列色，外圈＝面板底色做分隔環 */
        .rl-cursor {
            fill: currentColor;
            stroke: var(--panel);
            stroke-width: 2;
            vector-effect: non-scaling-stroke;
        }

        /* 八個序列色位（dataviz 參考色盤的**固定順序**）。資材 i 恆定拿第 i 個色位，
           開關序列時絕不重新分配顏色——否則關掉一條線會讓其他線全部換色。
           深淺兩套各自用 validate_palette.js 驗過亮度帶／彩度／CVD 分離／對比。 */
        .rl-s0 { color: #3987e5; }
        .rl-s1 { color: #d95926; }
        .rl-s2 { color: #199e70; }
        .rl-s3 { color: #c98500; }
        .rl-s4 { color: #d55181; }
        .rl-s5 { color: #008300; }
        .rl-s6 { color: #9085e9; }
        .rl-s7 { color: #e66767; }

        :root[data-theme="light"] .rl-s0 { color: #2a78d6; }
        :root[data-theme="light"] .rl-s1 { color: #eb6834; }
        :root[data-theme="light"] .rl-s2 { color: #1baf7a; }
        :root[data-theme="light"] .rl-s3 { color: #eda100; }
        :root[data-theme="light"] .rl-s4 { color: #e87ba4; }
        :root[data-theme="light"] .rl-s5 { color: #008300; }
        :root[data-theme="light"] .rl-s6 { color: #4a3aa7; }
        :root[data-theme="light"] .rl-s7 { color: #e34948; }

        /* 時間軸（所有序列共用同一個 x 值域，故只有一條） */
        .rl-xaxis {
            display: flex;
            justify-content: space-between;
            margin-top: 2px;
            padding: 0 4px;
            font-size: 10px;
            font-variant-numeric: tabular-nums;
            letter-spacing: var(--track-label);
        }

        .rl-chart-note { margin-top: 6px; }

        /* 十字準線的提示框：跟著游標移動，故絕對定位在 .rl-body 這個定位容器裡 */
        .rl-body { position: relative; }

        .rl-tip {
            position: absolute;
            z-index: 8;
            display: grid;
            gap: 4px;
            max-width: 260px;
            padding: 6px 8px;
            border: 1px solid var(--brass);
            border-radius: 6px;
            background: var(--panel);
            box-shadow: 0 4px 14px rgb(0 0 0 / .35);
            pointer-events: none;
        }

        .rl-tip[hidden] { display: none; }

        .rl-tip-time {
            color: var(--sparkle);
            font-size: 11px;
            letter-spacing: var(--track-label);
        }

        .rl-tip-chips {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 2px 8px;
        }

        .rl-tip-row {
            display: inline-flex;
            gap: 5px;
            align-items: center;
        }

        .rl-tip-row .rl-swatch { background: currentColor; }

        /* ── 活動區段消耗 ── */
        .rl-events { margin-top: 16px; }

        .rl-events h3 {
            margin: 0 0 4px;
            color: var(--brass);
            font-size: 11px;
            letter-spacing: var(--track-label);
        }

        .rl-event {
            margin-bottom: 10px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel);
        }

        .rl-event-head {
            display: flex;
            gap: 8px;
            align-items: center;
            padding: 6px 10px;
            border-bottom: 1px solid var(--line);
            font-size: 12px;
        }

        .rl-event-name { color: var(--sparkle); }

        /* 一段一行、成員資訊直接攤開（同活動作戰板的標籤列：藏起來讓人找等於沒做） */
        .rl-seg-row {
            display: grid;
            grid-template-columns: minmax(110px, auto) minmax(120px, auto) minmax(0, 1fr);
            gap: 4px 10px;
            align-items: baseline;
            padding: 4px 10px;
            font-size: 12px;
        }

        .rl-seg-row+.rl-seg-row {
            border-top: 1px solid color-mix(in srgb, var(--line) 55%, transparent);
        }

        .rl-seg-total .rl-seg-name {
            color: var(--sparkle);
            font-weight: 600;
        }

        .rl-seg-time {
            font-size: 11px;
            font-variant-numeric: tabular-nums;
        }

        .rl-seg-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 8px;
        }

        /* ── 詳細清單 ── */
        /* 詳細清單的欄位開關（一項資材一顆圖示鈕，只放圖示不放文字）。
           選中態沿用既有語言（--sparkle 邊框＋color-mix 的 --brass 淡底，同 equipment
           的 .eq-icon）；關掉的淡化＋去底色，仍看得見它存在。 */
        .rl-colrack {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            align-items: center;
            margin-top: 12px;
        }

        .rl-colrack-label {
            margin-right: 2px;
            color: var(--dim);
            font-size: 11px;
            letter-spacing: var(--track-label);
        }

        .rl-colbtn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 26px;
            padding: 0;
            border: 1px solid var(--line);
            border-radius: 4px;
            background: var(--bg);
            cursor: pointer;
            transition: border-color 100ms ease-out, background-color 100ms ease-out, opacity 100ms ease-out, transform 100ms ease-out;
        }

        .rl-colbtn:active { transform: scale(.97); }

        .rl-colbtn:not(.on) { opacity: .4; }

        .rl-colbtn.on {
            border-color: var(--sparkle);
            background: color-mix(in srgb, var(--brass) 16%, transparent);
        }

        .rl-colbtn .m-icon { width: 16px; height: 16px; }

        .rl-table-wrap {
            margin-top: 8px;
            overflow-x: auto;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel);
        }

        .rl-table {
            width: max-content;
            min-width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 12px;
        }

        .rl-table th {
            position: sticky;
            top: 0;
            z-index: 2;
            padding: 6px 8px;
            border-bottom: 1px solid var(--line);
            background: var(--panel);
            color: var(--dim);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: var(--track-label);
            text-align: right;
            white-space: nowrap;
        }

        .rl-table th.rl-th-time { text-align: left; }

        /* 表頭純圖示（使用者要求，同下方的欄位開關）。名稱靠 title 與上方圖表圖例補足。 */
        .rl-th-mat {
            text-align: center;
        }

        .rl-th-mat .m-icon { vertical-align: middle; }

        .rl-table td {
            padding: 3px 8px;
            border-bottom: 1px solid color-mix(in srgb, var(--line) 55%, transparent);
            white-space: nowrap;
        }

        .rl-table tbody tr:last-child td { border-bottom: none; }

        .rl-table tbody tr:hover td { background: color-mix(in srgb, var(--brass) 8%, transparent); }

        .rl-td-time {
            color: var(--dim);
            font-variant-numeric: tabular-nums;
        }

        .rl-td-mat {
            font-variant-numeric: tabular-nums;
            text-align: right;
        }

        /* 餘額是主角、消長是註腳：同一格兩個數字，靠字級與顏色分主次，不另開一欄
           （八項資材各開兩欄＝十六欄，橫捲到看不完） */
        .rl-td-mat .rl-d {
            margin-left: 6px;
            font-size: 11px;
        }

        /* 特殊時間點：整列橫跨，是清單裡的分隔標記而不是一筆資料 */
        .rl-mark-row td {
            padding: 5px 8px;
            background: color-mix(in srgb, var(--brass) 10%, transparent);
            white-space: normal;
        }

        .rl-mark-badge {
            margin-right: 6px;
            padding: 0 calc(4px - var(--track-tag)) 0 4px;
            border-radius: 4px;
            background: color-mix(in srgb, var(--brass) 30%, transparent);
            color: var(--sparkle);
            font-size: 10px;
            letter-spacing: var(--track-tag);
        }

        .rl-mark-name {
            margin-right: 6px;
            color: var(--text);
            font-weight: 600;
        }

        .rl-pager { margin-bottom: 4px; }

        /* ── 窄視窗 ──
           側欄在 ≤760px 一律轉成浮層（main.ts applyNav 依 innerWidth 決定），這裡處理
           內容區自身：縮內距、讓工具列的每組控制項各佔一行、圖磚回到單欄。 */
        @media (max-width: 760px) {
            #content { padding: 12px 12px 20px; }

            .eq-bar { gap: 6px; }

            /* 每組篩選各佔整行：擠在同一行時標籤與按鈕會被拆散到不同行，看不出哪個
               標籤管哪組按鈕。 */
            .eq-group {
                width: 100%;
                align-items: flex-start;
            }

            .eq-group-label {
                min-width: 44px;
                padding-top: 4px;
            }

            .eq-bar .grow { display: none; }

            .rl-bar .grow { display: none; }

            .bl-bar .grow,
            .dl-bar .grow,
            .el-bar .grow,
            .vl-bar .grow { display: none; }

            .dl-date,
            .bl-date,
            .vl-date { width: 100%; flex-wrap: wrap; }

            /* 提示框在窄視窗會擋住半個畫面；改成貼齊左緣、寬度自適應 */
            .rl-tip { max-width: calc(100% - 16px); }
        }

        @media (max-width: 620px) {
            .rs-row { grid-template-columns: minmax(0, 1fr); }
            .rl-seg-row { grid-template-columns: minmax(0, 1fr); }
            .rl-tip-chips { grid-template-columns: minmax(0, 1fr); }
            .eq-grid { grid-template-columns: minmax(0, 1fr); }
        }

        /* ── 無障礙偏好 ──
           減少動態不等於取消回饋：拿掉會位移的 transform，保留純色彩變化的按下回饋。 */
        @media (prefers-reduced-motion: reduce) {

            #header select,
            #header button,
            #nav a,
            .ov-btn,
            .rs-search,
            .rs-bar select,
            .rs-range input,
            .rs-seg button,
            .rs-mini,
            .rs-chip,
            .rl-leg,
            .rl-colbtn,
            .eq-search,
            .eq-bar select,
            .eq-seg button,
            .eq-icon,
            .eq-chip,
            .sl-head {
                transition: none;
            }

            /* 側欄浮層：不滑入，直接出現（收合／展開是狀態切換，不是裝飾動畫） */
            body[data-nav="hidden"] #nav,
            body[data-nav="open"] #nav {
                transition: none;
            }

            #header select:active,
            #header button:active,
            .ov-btn:active,
            .rs-search:active,
            .rs-bar select:active,
            .rs-range input:active,
            .rs-seg button:active,
            .rs-mini:active,
            .rs-chip:active,
            .rl-leg:active,
            .rl-colbtn:active,
            .eq-search:active,
            .eq-bar select:active,
            .eq-seg button:active,
            .eq-icon:active,
            .eq-chip:active {
                transform: none;
            }
        }

        @media (prefers-reduced-transparency: reduce) {
            .rs-chip,
            .rs-seg button.on,
            .rl-colbtn.on,
            .eq-chip,
            .eq-seg button.on,
            .eq-icon.on,
            .eq-star.max {
                background: color-mix(in srgb, var(--brass) 20%, var(--panel));
            }

            .rs-table tbody tr:hover td,
            .eq-table tbody tr:hover td,
            :is(.bl-table, .dl-table, .el-table, .vl-table) tbody tr:hover td {
                background: color-mix(in srgb, var(--brass) 8%, var(--panel));
            }

            .eq-inst {
                background: color-mix(in srgb, var(--line) 22%, var(--panel));
            }

            .eq-meter {
                background: color-mix(in srgb, var(--line) 70%, var(--panel));
            }

            .sl-head:hover {
                background: color-mix(in srgb, var(--brass) 8%, var(--panel));
            }

            .sl-ship {
                background: color-mix(in srgb, var(--line) 45%, var(--panel));
            }

            .sl-hp {
                background: color-mix(in srgb, var(--line) 70%, var(--panel));
            }

            .sl-line+.sl-line {
                border-top-color: var(--line);
            }

            .sl-pill.boss {
                background: color-mix(in srgb, var(--dmg-major) 12%, var(--panel));
            }

            .rl-table tbody tr:hover td {
                background: color-mix(in srgb, var(--brass) 8%, var(--panel));
            }

            .rl-mark-row td {
                background: color-mix(in srgb, var(--brass) 12%, var(--panel));
            }

            .rl-mark-badge {
                background: color-mix(in srgb, var(--brass) 30%, var(--panel));
            }

            .el-ship,
            .el-items span {
                background: color-mix(in srgb, var(--line) 14%, var(--panel));
            }
        }

        /* 高對比：邊界改為明確可見、弱化文字提高亮度；深淺主題各自調整。
           選中的側欄項目改為實心底＋粗邊，不再只靠底色深淺差異表示。 */
        @media (prefers-contrast: more) {
            :root {
                --line: #6b7a95;
                --dim: #a9b4c6;
            }

            :root[data-theme="light"] {
                --line: #8a8375;
                --dim: #4a5160;
            }

            #nav a.active {
                outline: 1px solid var(--accent);
            }

            .ov-btn,
            #header select,
            #header button,
            .rs-search,
            .rs-bar select,
            .rs-range input,
            .rs-seg button,
            .rs-mini,
            .eq-search,
            .eq-bar select,
            .eq-seg button,
            .eq-icon,
            .sl-bar select,
            .sl-pill,
            .sl-ec {
                border-color: var(--dim);
            }

            :is(.bl-table-wrap, .dl-table-wrap, .el-table-wrap, .vl-table-wrap) { border-color: var(--dim); }

            .el-unknown {
                color: var(--text);
                border-bottom-style: solid;
            }

            /* 出擊卡：hover 的淡底在高對比下幾乎看不出來，改為明確邊界 */
            .sl-head:hover {
                background: none;
                outline: 1px solid var(--sparkle);
                outline-offset: -1px;
            }

            /* 選中的分段選項不再只靠淡底色差異：改為實心底＋反色文字 */
            .rs-seg button.on,
            .eq-seg button.on {
                background: var(--sparkle);
                color: var(--bg);
            }

            /* 選中的圖示：淡底色差異在一整排圖示裡幾乎看不出來，改為粗邊＋外框 */
            .eq-icon.on {
                border-color: var(--sparkle);
                outline: 2px solid var(--sparkle);
            }

            /* 素質 0 的弱化點在高對比下要能與「有值」區分，但不能糊成看不見 */
            .eq-zero {
                color: var(--dim);
            }

            /* 折線圖：細線與虛線在高對比下不好追，加粗＋十字準線改實線 */
            .rl-line { stroke-width: 3; }

            .rl-cross {
                stroke: var(--sparkle);
                stroke-dasharray: none;
            }

            .rl-chart,
            .rl-leg,
            .rl-colbtn,
            .rl-event,
            .rl-table-wrap { border-color: var(--dim); }

            /* 開／關的差異不能只靠淡化（opacity 在高對比下幾乎看不出差別） */
            .rl-leg:not(.on) {
                opacity: 1;
                text-decoration: line-through;
            }

            /* 圖示鈕沒有文字可加刪除線，改用實心底＋外框標「選中」，其餘維持外框 */
            .rl-colbtn:not(.on) { opacity: 1; }

            .rl-colbtn.on {
                background: var(--sparkle);
                outline: 1px solid var(--sparkle);
            }

            /* 特殊時間點的淡底在高對比下看不出來，改為明確上下邊界 */
            .rl-mark-row td {
                background: none;
                border-top: 1px solid var(--sparkle);
                border-bottom: 1px solid var(--sparkle);
            }
        }
    </style>
</head>

<body>
    <div id="header">
        <button id="nav-toggle" aria-pressed="true" aria-controls="nav"></button>
        <h1 id="page-title">鎮守府情報總括</h1>
        <span class="grow"></span>
        <select id="lang-select" title="Language"></select>
        <button id="theme-toggle" title="Theme"></button>
        <button id="nav-side-toggle" title="Nav side"></button>
    </div>
    <!-- 側欄收起時的滑入熱區：純 CSS hover（見 #nav-hotspot 樣式），
         鍵盤／觸控使用者則走 header 的 #nav-toggle，不依賴 hover。
         側欄靠右時這顆熱區整個 display:none——右緣是內容捲軸的地盤，hover 熱區放在那裡
         會跟拖曳捲軸互搶、一直觸發開合亂跳，靠右一律只能按按鈕（見 index.html 內的
         `body[data-nav-side="right"] #nav-hotspot` 規則）。 -->
    <div id="nav-hotspot" aria-hidden="true"></div>
    <nav id="nav"></nav>
    <main id="content"></main>
    <script type="module" src="./main.ts"></script>
</body>

</html>
