        .ledger-nav button[aria-selected=true]{border-bottom-color:var(--brass);color:var(--text);font-weight:600}
        .ledger-nav .count{color:var(--dim);font-size:10.5px;font-weight:400;font-variant-numeric:tabular-nums}
        .ledger-nav button:focus-visible,.ledger-group-tabs button:focus-visible,.ledger-quest summary:focus-visible,.ledger-item-switch button:focus-visible,.ledger-item-search-toggle:focus-visible,.ledger-item-row>summary:focus-visible,.ledger-item-row .item-pin:focus-visible,.ledger-item-tools input:focus-visible{outline:2px solid var(--sparkle);outline-offset:-2px}
        .ledger-page{min-height:0;overflow:hidden}.ledger-page[hidden],.ledger-group[hidden]{display:none}
        .ledger-harbor{display:grid;grid-template-rows:48px 34px minmax(0,1fr);gap:7px}
        .ledger-materials{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(2,22px);gap:2px 12px}
        .ledger-material{display:flex;align-items:center;gap:5px;min-width:0;height:22px}
        .ledger-material img{width:14px;height:14px;flex:none}
        .ledger-material .value{min-width:0;overflow:hidden;color:var(--text);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;text-align:left;text-overflow:clip;white-space:nowrap}
        .ledger-material.secondary .value{color:var(--dim);font-size:11px;font-weight:500}
        .ledger-group-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border-bottom:1px solid var(--line)}
        .ledger-group-tabs button{appearance:none;display:flex;justify-content:center;align-items:center;gap:5px;min-width:0;margin-bottom:-1px;padding:4px 8px 5px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--dim);font:inherit;font-size:12px;font-weight:500;line-height:1.2;text-align:center;white-space:nowrap;cursor:pointer}
        .ledger-group-tabs button[aria-selected=true]{border-bottom-color:var(--brass);color:var(--text);font-weight:600}
        .ledger-group-tabs .count{color:var(--dim);font-size:10.5px;font-weight:400;font-variant-numeric:tabular-nums}
        .ledger-group{display:flex;flex-direction:column;min-height:0;border-top:0}
        .ledger-group-heading{flex:none;display:flex;justify-content:space-between;align-items:center;height:20px;color:var(--text);font-size:11px;font-weight:600}.ledger-group-heading .sub{color:var(--dim);font-size:10.5px;font-weight:400;font-variant-numeric:tabular-nums}
        .ledger-group-list{overflow-y:auto;min-height:0;scrollbar-width:thin}
        .ledger-op{display:grid;grid-template-columns:23px minmax(0,1fr) max-content;align-items:center;min-height:25px;gap:7px;padding:2px 4px;border-bottom:1px solid var(--line);font-size:12px;line-height:1.3}
        .ledger-op .slot{color:var(--brass);font-size:10px;font-weight:500;font-variant-numeric:tabular-nums}.ledger-op .name{min-width:0;font-weight:500;overflow-wrap:anywhere;line-height:1.3}.ledger-op .time{color:var(--text);font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
        .ledger-op.done .time{color:#58a55c}.ledger-op.locked{color:var(--dim)}.ledger-op.locked .time{color:var(--dim);font-weight:400}
        /* 任務種類色標：名稱前的細色塊；unknown 只畫空框，不借用任何種類色。 */
        .qc-mark { display: inline-block; flex: none; width: 4px; height: .95em; margin-right: 5px; border-radius: 1px; vertical-align: -.12em; background: var(--qc, transparent); }
        .qc-composition { --qc: var(--qc-composition); }
        .qc-sortie { --qc: var(--qc-sortie); }
        .qc-practice { --qc: var(--qc-practice); }
        .qc-expedition { --qc: var(--qc-expedition); }
        .qc-supply-dock { --qc: var(--qc-supply-dock); }
        .qc-arsenal { --qc: var(--qc-arsenal); }
        .qc-modernization { --qc: var(--qc-modernization); }
        .qc-unknown { box-shadow: inset 0 0 0 1px var(--line); }
        .ledger-quests{display:flex;flex-direction:column;min-height:0}.ledger-quest-heading{flex:none;display:flex;justify-content:space-between;align-items:center;height:21px;color:var(--text);font-size:12px;font-weight:600}.ledger-quest-heading span{color:var(--dim);font-size:10.5px;font-weight:500;font-variant-numeric:tabular-nums}
        .ledger-quest-list{display:block;min-height:0;overflow-y:auto;scrollbar-width:thin}.ledger-quest{border-bottom:1px solid var(--line)}
        .ledger-quest summary{display:grid;grid-template-columns:minmax(0,1fr) max-content 12px;align-items:start;gap:6px;min-height:24px;padding:3px 4px;color:var(--text);font-size:12px;line-height:1.2;cursor:pointer;list-style:none}
        .ledger-quest summary::-webkit-details-marker{display:none}.ledger-quest .name{min-width:0;padding-left:9px;text-indent:-9px;font-weight:500;overflow-wrap:anywhere}.ledger-quest .state{padding-top:1px;color:var(--dim);font-size:10.5px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
        .ledger-quest.done .state{color:#58a55c;font-weight:600}.ledger-quest .arrow{color:var(--dim);font-size:12px;text-align:right}.ledger-quest[open] .arrow{transform:rotate(90deg)}
        .ledger-quest .description{margin:0 3px 7px;padding:7px 9px;border-left:2px solid var(--brass);background:var(--panel);color:var(--text);font-size:12px;line-height:1.5;overflow-wrap:anywhere}
        /* 任務展開：說明／原文／進度三選一，同時只顯示一個分頁（面板長寬固定，不疊加內容）。 */
        .ledger-quest-seg{display:flex;margin-bottom:6px}
        .ledger-quest-seg button{appearance:none;padding:2px 8px;border:1px solid var(--line);background:var(--bg);color:var(--dim);font:inherit;font-size:10.5px;line-height:1.25;cursor:pointer}
        .ledger-quest-seg button+button{border-left:none}
        .ledger-quest-seg button:first-child{border-radius:4px 0 0 4px}.ledger-quest-seg button:last-child{border-radius:0 4px 4px 0}
        .ledger-quest-seg button[aria-pressed="true"]{border-color:var(--brass);color:var(--sparkle);background:color-mix(in srgb,var(--brass) 14%,var(--bg))}
        .ledger-quest-seg button[aria-pressed="true"]+button{border-left:1px solid var(--line)}
        .ledger-quest-seg button:focus-visible,.ledger-quest-more:focus-visible{outline:2px solid var(--sparkle);outline-offset:1px}
        .ledger-quest-pane[hidden]{display:none}
        .ledger-quest-reused{margin:0 0 5px;color:var(--dim);font-size:10.5px;line-height:1.4}
        .ledger-quest-original-name{margin:0 0 3px;overflow-wrap:anywhere}.ledger-quest-original-detail{margin:0;overflow-wrap:anywhere}
        .quest-rewards{display:grid;gap:3px;margin-top:7px;overflow-wrap:anywhere;font-size:10.5px;line-height:1.4}
        .quest-reward-title{color:var(--brass);font-size:10px;letter-spacing:var(--track-tag)}
        .quest-reward-resources{display:flex;flex-wrap:wrap;gap:1px 8px;color:var(--text);font-variant-numeric:tabular-nums}
        .quest-reward-group{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:3px 5px}
        .quest-reward-kind,.quest-reward-pending{color:var(--dim)}.quest-reward-values{min-width:0}
        /* 可信度標記只用中性色，以外框樣式區分等級，不新增色相（design-guidelines §1.5）。 */
        .quest-tier{display:inline-block;margin-right:4px;padding:0 3px;border:1px solid var(--line);border-radius:3px;color:var(--dim);font-size:9px;font-style:normal;font-weight:500;line-height:13px;letter-spacing:var(--track-tag);vertical-align:1px}
        .quest-tier.tier-verified{border-color:color-mix(in srgb,var(--brass) 60%,var(--line));color:var(--text)}
        .quest-tier.tier-text,.quest-tier.tier-server{border-style:dashed}
        .ledger-quest .state .n.est{color:var(--brass)}.ledger-quest .state .n.weak{color:var(--dim)}
        .ledger-quest-prog{display:grid;gap:2px;font-size:11px;line-height:1.45}
        .ledger-quest-prog .sub{color:var(--dim)}
        .ledger-quest-tier{display:flex;align-items:baseline;gap:4px;color:var(--dim);font-size:10.5px}.ledger-quest-tier .quest-tier{flex:none;margin-right:0}
        .ledger-quest-maps{display:flex;flex-wrap:wrap;gap:2px 10px;font-variant-numeric:tabular-nums}
        .ledger-quest-maps>span{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
        .ledger-quest-maps .pips{display:inline-flex;gap:2px}
        .ledger-quest-maps .pips i{width:8px;height:8px;border:1px solid var(--brass);border-radius:2px}
        .ledger-quest-maps .pips i.on{background:var(--brass)}
        /* 編成條件標籤：符合用黃銅框，不符用虛線中性框（不挪用傷害等語意色）。 */
        .ledger-quest-cond{display:flex;flex-wrap:wrap;gap:3px}
        .ledger-quest-cond span{padding:0 5px;border:1px solid var(--line);border-radius:3px;color:var(--dim);font-size:10px;line-height:15px;white-space:nowrap;font-variant-numeric:tabular-nums}
        .ledger-quest-cond span.ok{border-color:color-mix(in srgb,var(--brass) 60%,var(--line));color:var(--text)}
        .ledger-quest-cond span.ng{border-style:dashed}
        .ledger-quest-more{justify-self:start;padding:0;border:none;background:none;color:var(--brass);font:inherit;font-size:10.5px;cursor:pointer}
        .ledger-quest-more:hover{color:var(--sparkle)}
        /* 搜尋列平時收起（hidden），清單吃下省出的高度；用 flex 而非固定列高，收起的列才不會留空行。 */
        .ledger-item-layout{display:flex;flex-direction:column;gap:5px;box-sizing:border-box;height:100%;min-height:0}
        .ledger-item-bar{flex:none;display:grid;grid-template-columns:minmax(0,1fr) 28px;height:28px;border-bottom:1px solid var(--line)}
        .ledger-item-switch{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:0;min-width:0}
        .ledger-item-search-toggle{appearance:none;display:grid;place-items:center;margin-bottom:-1px;padding:0;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--dim);cursor:pointer}
        .ledger-item-search-toggle svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round}
        .ledger-item-search-toggle:hover{color:var(--text)}.ledger-item-search-toggle[aria-expanded=true]{border-bottom-color:var(--brass);color:var(--text)}
        .ledger-item-switch button{appearance:none;display:flex;justify-content:center;align-items:center;gap:5px;min-width:0;margin-bottom:-1px;padding:3px 7px 4px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--dim);font:inherit;font-size:11.5px;font-weight:500;line-height:1.2;text-align:center;white-space:nowrap;cursor:pointer}
        .ledger-item-switch button[aria-selected=true]{border-bottom-color:var(--brass);color:var(--text);font-weight:600}
        .ledger-item-switch .capacity{flex:none;color:var(--dim);font-size:10px;font-weight:400;font-variant-numeric:tabular-nums;white-space:nowrap}
        .ledger-item-switch button[aria-selected=true] .capacity{color:var(--dim)}
        .ledger-item-tools{flex:none;display:flex;align-items:center;height:24px;min-width:0}
        .ledger-item-tools input{box-sizing:border-box;width:100%;min-width:0;padding:3px 7px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;font-size:11.5px;line-height:1.25}
        .ledger-item-page{display:flex;flex:1;flex-direction:column;min-height:0;overflow:hidden;scrollbar-width:thin}
        .ledger-item-page[hidden],.ledger-item-tools[hidden],.ledger-item-row[hidden],.ledger-item-empty[hidden]{display:none}
        .ledger-item-grid{display:grid;flex:1;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px 7px;align-content:start;min-height:0;overflow-y:auto}
        html[lang="en"] .ledger-item-grid,html[lang="ja"] .ledger-item-grid{grid-template-columns:minmax(0,1fr)}
        .ledger-item-row{min-width:0;margin:0;border-bottom:1px solid color-mix(in srgb,var(--line) 78%,transparent)}
        .ledger-item-row>summary{display:grid;grid-template-columns:minmax(0,1fr) auto 12px;align-items:center;gap:5px;box-sizing:border-box;min-height:27px;padding:3px 4px;color:var(--text);font-size:11.5px;line-height:1.25;list-style:none;cursor:pointer}
        .ledger-item-row>summary::-webkit-details-marker{display:none}
        .ledger-item-row .name{min-width:0;overflow:hidden;color:var(--text);font-size:11.5px;font-weight:500;text-overflow:ellipsis;white-space:nowrap}
        .ledger-item-row .count{min-width:3ch;color:var(--text);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
        .ledger-item-row .arrow{color:var(--dim);font-size:12px;text-align:right}.ledger-item-row[open] .arrow{transform:rotate(90deg)}
        .ledger-item-row .pin-mark{width:9px;height:9px;margin-right:3px;vertical-align:-1px;fill:var(--brass)}
        .ledger-item-row .item-detail{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 6px;padding:3px 7px 6px;color:var(--dim);font-size:10.5px;line-height:1.45;overflow-wrap:anywhere}
        .ledger-item-row .item-detail-label{color:var(--brass);letter-spacing:var(--track-tag)}
        /* 釘選鈕放在展開內容，不佔收攏列寬；按鈕獨立一行靠右，雙欄窄格也不擠壓說明。 */
        .ledger-item-row .item-pin{appearance:none;grid-column:1/-1;justify-self:end;padding:1px 7px;border:1px solid var(--line);border-radius:3px;background:transparent;color:var(--dim);font:inherit;font-size:10.5px;line-height:1.35;white-space:nowrap;cursor:pointer}
        .ledger-item-row .item-pin:hover{border-color:var(--brass);color:var(--text)}.ledger-item-row .item-pin[aria-pressed=true]{border-color:var(--brass);color:var(--brass)}
        .ledger-item-switch .matches{color:var(--brass)}
        .ledger-item-empty{padding:8px 3px;color:var(--dim);font-size:11px}

        /* ── header 單行自動縮放 ──
           提督名放得下時維持原尺寸；會被截斷時由 main.ts fitHeader() 調低 --hs，名稱、Lv、
           艦／裝數量、圖示、間距與相機鈕一起等比縮小。高度固定 39px，縮放不會推動下方版面。 */
        #header { --hs: 1; height: 39px; padding-top: 0; padding-bottom: 0; gap: calc(12px * var(--hs)); }
        #header .idbox { gap: calc(6px * var(--hs)); }
        #header .nick { font-size: calc(14px * var(--hs)); }
        #header .num { font-size: calc(13px * var(--hs)); }
        #header .stat { gap: calc(4px * var(--hs)); font-size: calc(13px * var(--hs)); }
        #header .stat.first { margin-left: auto; }
        #header .h-icon { width: calc(16px * var(--hs)); height: calc(16px * var(--hs)); }
        #header .h-cam { flex: none; display: inline-flex; align-items: center; justify-content: center; width: calc(22px * var(--hs)); height: calc(22px * var(--hs)); padding: 0; border: 1px solid var(--line); border-radius: 4px; background: none; color: var(--dim); cursor: pointer; }
        #header .h-cam:hover { color: var(--text); border-color: var(--brass); }
        #header .h-cam[aria-pressed="true"] { color: var(--sparkle); border-color: var(--brass); background: color-mix(in srgb, var(--brass) 14%, transparent); }
        #header .h-cam svg { width: calc(15px * var(--hs)); height: calc(15px * var(--hs)); fill: none; stroke: currentColor; stroke-width: 1.4; }

        /* ── 編成寫真托盤：開啟時取代 #tabpanel，同樣固定 270px，不推動下方編成 ── */
        #photo-tray { display: flex; flex-direction: column; gap: 5px; height: 270px; padding: 6px 8px; min-height: 0; overflow: hidden; }
        #photo-tray[hidden], #tabpanel[hidden] { display: none; }
        .ph-head { display: flex; align-items: center; gap: 8px; min-width: 0; min-height: 20px; font-size: 12px; line-height: 1.2; }
        .ph-title { color: var(--text); white-space: nowrap; }
        .ph-target { min-width: 0; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ph-seg { display: inline-flex; flex: none; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
        .ph-seg button { border: none; background: none; color: var(--dim); font: inherit; font-size: 11px; padding: 1px 7px; cursor: pointer; white-space: nowrap; font-variant-numeric: tabular-nums; }
        .ph-seg button + button { border-left: 1px solid var(--line); }
        .ph-seg button[aria-pressed="true"] { color: var(--text); background: color-mix(in srgb, var(--brass) 16%, transparent); }
        .ph-count { margin-left: auto; color: var(--dim); font-size: 11px; font-variant-numeric: tabular-nums; white-space: nowrap; }
        .ph-count b { color: var(--text); font-weight: 600; }
        .ph-close { flex: none; border: none; background: none; color: var(--dim); cursor: pointer; font-size: 14px; line-height: 1; padding: 2px 4px; }
        .ph-close:hover { color: var(--text); }
        .ph-hint { font-size: 10px; color: var(--dim); line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ph-hint.toast { color: var(--text); }
        /* 錯誤沿用 #notice.err 的警示色；允許換行，原因不截斷（格線區會自動縮小讓位） */
        .ph-hint.err { color: var(--dmg-major); white-space: normal; }
        /* 格線區夾在 head／hint／foot 之間；以 container 尺寸推算格子大小，任何艦數都不撐破 270px */
        .ph-grid { display: grid; gap: 4px 5px; flex: 1; min-height: 0; container-type: size; align-content: start; }
        .ph-grid.fleet { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .ph-grid.fleet .ph-cell { height: calc((100cqh - (var(--rows) - 1) * 4px) / var(--rows)); }
        /* 基地航空隊：欄寬固定為三分之一，不足三隊時置中 */
        .ph-grid.lbas { grid-template-columns: repeat(var(--n, 3), calc((100% - 10px) / 3)); justify-content: center; }
        .ph-grid .ph-empty { grid-column: 1 / -1; align-self: center; color: var(--dim); font-size: 11px; text-align: center; }
        .ph-cell { position: relative; display: flex; gap: 6px; align-items: stretch; min-width: 0; margin: 0; padding: 2px; border: 1px solid var(--line); border-radius: 3px; background: var(--panel); color: inherit; font: inherit; text-align: left; cursor: pointer; overflow: hidden; }
        .ph-cell:hover { border-color: color-mix(in srgb, var(--brass) 55%, var(--line)); }
        .ph-thumb { position: relative; flex: none; height: 100%; aspect-ratio: 684 / 546; border: 1px dashed var(--line); border-radius: 2px; background: var(--bg); overflow: hidden; }
        .ph-cell.shot .ph-thumb { border: none; }
        .ph-thumb img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
        .ph-meta { display: flex; flex: 1; flex-direction: column; justify-content: center; gap: 1px; min-width: 0; font-size: 11px; line-height: 1.25; }
        .ph-name { color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ph-sub, .ph-state { color: var(--dim); font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
        .ph-cell.next { border-color: var(--brass); box-shadow: inset 0 0 0 1px var(--brass); }
        .ph-cell.next .ph-state { color: var(--sparkle); }
        .ph-cell.stale .ph-thumb img { opacity: .4; filter: grayscale(.7); }
        .ph-cell.stale .ph-state { color: var(--text); }
        .ph-grid.lbas .ph-cell { flex-direction: column; gap: 3px; height: 100cqh; }
        .ph-grid.lbas .ph-thumb { height: auto; width: min(100%, calc((100cqh - 38px) * 334 / 422)); aspect-ratio: 334 / 422; align-self: center; }
        .ph-grid.lbas .ph-meta { flex: none; align-items: center; text-align: center; }
        .ph-cell.flash::after { content: ''; position: absolute; inset: 0; background: #fff; animation: ph-flash 220ms ease-out forwards; pointer-events: none; }
        @keyframes ph-flash { from { opacity: .85; } to { opacity: 0; } }
        @media (prefers-reduced-motion: reduce) { .ph-cell.flash::after { animation: none; opacity: 0; } }
        .ph-foot { display: flex; align-items: center; gap: 6px; min-width: 0; }
        .ph-foot .grow { flex: 1; }
        .ph-shoot { flex: none; height: 26px; padding: 0 10px; border: 1px solid var(--brass); border-radius: 4px; background: color-mix(in srgb, var(--brass) 14%, var(--panel)); color: var(--sparkle); font: inherit; font-size: 12px; cursor: pointer; white-space: nowrap; }
        .ph-shoot:disabled { border-color: var(--line); background: var(--panel); color: var(--stub); cursor: default; }
        .ph-btn { flex: none; height: 26px; padding: 0 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); color: var(--text); font: inherit; font-size: 11px; cursor: pointer; white-space: nowrap; }
        .ph-btn:hover:not(:disabled) { border-color: var(--brass); }
        .ph-btn:disabled { color: var(--stub); cursor: default; }
        /* 輸出設定：原生 <details>；托盤更新時保留同一個元素，展開狀態不被重繪洗掉 */
        .ph-opts { position: relative; flex: none; }
        .ph-opts > summary { list-style: none; display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); color: var(--text); font-size: 11px; cursor: pointer; white-space: nowrap; }
        .ph-opts > summary::-webkit-details-marker { display: none; }
        .ph-opts > summary::after { content: '▾'; color: var(--dim); font-size: 9px; }
        .ph-opts[open] > summary { border-color: var(--brass); }
        .ph-opts-panel { position: absolute; right: 0; bottom: 30px; z-index: 5; width: 236px; padding: 8px; display: grid; gap: 7px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; box-shadow: 0 4px 14px color-mix(in srgb, #000 35%, transparent); font-size: 11px; }
        .ph-opts-panel label.row { display: grid; grid-template-columns: 64px minmax(0, 1fr); align-items: center; gap: 6px; color: var(--dim); }
        .ph-opts-panel select { min-width: 0; height: 24px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); color: var(--text); font: inherit; font-size: 11px; }
        .ph-opts-panel .checks { display: flex; flex-wrap: wrap; gap: 4px 10px; color: var(--text); }
        .ph-opts-panel .checks label { display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; }
    </style>
</head>

<body>
    <div id="header"></div>
    <!-- 狀態橫幅：載入中／事件積壓／啟動失敗共用一條，永遠在最上方。空白面板配一句
         console 訊息是查不出原因的，任何「面板看起來壞了」的狀態都必須在畫面上說明。 -->
    <div id="notice" hidden></div>
    <div id="tabs"></div>
    <div id="tabpanel" class="has-general">
        <div id="tab-general" class="ledger">
            <nav class="ledger-nav" id="general-nav" aria-label="一般分頁"></nav>
            <div class="ledger-page ledger-harbor" id="general-harbor">
                <div class="ledger-materials" id="resline"></div>
                <div class="ledger-group-tabs" id="operation-nav"></div>
                <section class="ledger-group" id="operation-exped"><div class="ledger-group-heading" id="heading-exped"></div><div class="ledger-group-list" id="missions"></div></section>
                <section class="ledger-group" id="operation-dock" hidden><div class="ledger-group-heading" id="heading-dock"></div><div class="ledger-group-list" id="ndocks"></div></section>
                <section class="ledger-group" id="operation-build" hidden><div class="ledger-group-heading" id="heading-build"></div><div class="ledger-group-list" id="kdocks"></div></section>
            </div>
            <div class="ledger-page ledger-quests" id="general-quests" hidden><div class="ledger-quest-heading" id="quest-heading"></div><div class="ledger-quest-list" id="quests"></div></div>
            <div class="ledger-page ledger-items" id="general-items" hidden>
                <div class="ledger-item-layout">
                    <div class="ledger-item-bar"><div class="ledger-item-switch" id="inventory-nav" role="tablist"></div><button type="button" class="ledger-item-search-toggle" id="item-search-toggle" aria-expanded="false" aria-controls="item-search-row"><svg viewBox="0 0 14 14" aria-hidden="true"><circle cx="6" cy="6" r="4.2"/><path d="M9.2 9.2 12.5 12.5"/></svg></button></div>
                    <div class="ledger-item-tools" id="item-search-row" hidden><input id="item-search" type="search" autocomplete="off"></div>
                    <div class="ledger-item-page" id="inventory-results"></div>
                </div>
            </div>
        </div>
        <div id="tab-exped" style="display:none">
            <div class="exped-header">
                <span id="exped-fleet-label" class="exped-fleet-lbl"></span>
                <select id="exped-select" class="exped-select"></select>
            </div>
            <div id="exped-check"></div>
        </div>
        <div id="tab-factory" style="display:none">
            <div class="fac-controls">
                <span class="grow"></span>
                <a class="akashi-link" href="https://akashi-list.me/" target="_blank" rel="noopener"
                    data-i18n="factory.akashiLink">明石の改修工廠 早見表 ↗</a>
            </div>
            <div id="factory-live"></div>
        </div>
        <div id="tab-order" style="display:none"></div>
        <div id="tab-activity" style="display:none">
            <h3 data-i18n="section.wanted">待驗證封包（自動擷取）</h3>
            <div id="wanted"></div>
            <h3 data-i18n="section.log">事件記錄</h3>
            <div id="log"></div>
        </div>
        <div id="tab-sortie" style="display:none">
            <div id="battle-content">
                <div style="color:var(--dim); padding:10px;" data-i18n="sortie.notEntered">尚未進入戰鬥。</div>
            </div>
        </div>
    </div>
    <div id="photo-tray" hidden></div>
    <div id="fleetnav"></div>
    <div id="fleets"></div>
    <div id="air-bases" style="display:none"></div>
    <script type="module" src="./main.ts"></script>
</body>

</html>
