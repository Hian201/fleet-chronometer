<!doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <title>航海鐘</title>
    <style>
        :root {
            --bg: #10151d;
            --panel: #182030;
            --line: #2a3548;
            --text: #cfd6e4;
            --dim: #7d8aa0;
            --brass: #b8860b;
            --stub: #4a5468;
            --dmg-major: #e05555;
            --dmg-mid: #e08b3d;
            --dmg-minor: #d4b83a;
            --sparkle: #e6c35c;
            /* 索敵/航向/觸接/航空戰數值色。刻意獨立於 --dmg-mid（傷害語意），
               避免兩種無關語意共用同一色而互相稀釋（design-guidelines §4.5）。 */
            --stat-mini: #e0954d;
            /* 基地航空隊「輕度疲勞」（中隊 cond 20–29）：分區內的黃臉與編成列的基地航空隊鈕
               共用這一個變數，兩處不得各自寫死色碼。重度疲勞沿用 --dmg-major。
               目前值與 --dmg-mid 相同，但**刻意保留成獨立變數**——疲勞與艦娘中破是兩種語意，
               只是現階段選了同一個橘；日後要調其中一邊時不該連動另一邊。
               對比：暗底 7.1:1；亮底 2.3:1（偏低，與面板既有的 --dmg-mid 用法同級）。 */
            --lbas-tired: #e08b3d;
            /* 關卡量表 pill 的軌道色。獨立變數而非沿用 --line：條子裡是白字的剩餘實數，
               軌道必須在兩個主題下都夠深才讀得到（亮色主題只調深、不轉淺，見 .s-gauge-bar）。 */
            --gauge-track: #2a3548;

            /* 字距（tracking）級距：與字級成反比——字愈小需要愈多字距才好讀，字愈大
               則要收緊。原本各處硬寫死的值彼此不成比例（9px 的 .04em 比 11px 的 .12em
               還窄，與此原則相反），改由這組變數統一。三種擴充頁面共用同一組值。 */
            --track-tag: .14em;
            /* 8–9px 標籤 */
            --track-label: .12em;
            /* 10–11px 小標題 */
            --track-body: 0;
            /* 13px 內文 */
            --track-title: -.01em;
            /* 14px 以上標題 */
        }

        /* 亮色主題（由「鎮守府情報總括」的主題切換透過 <html data-theme> 全域套用，#2）。
           M7 全圖示已帶深墨描邊，亮底可讀性已保證。傷害色維持不變（語意色，亮底仍清楚）。 */
        :root[data-theme="light"] {
            --bg: #eef0f4;
            --panel: #ffffff;
            --line: #d3d8e2;
            --text: #26303f;
            --dim: #6b7688;
            --brass: #9a6b0b;
            --stub: #aab3c2;
            --sparkle: #8a6d1a;
            --gauge-track: #4a5568;
        }

        * {
            box-sizing: border-box;
        }

        /* 捲軸配色（與 overview 同一套規則，見 design-guidelines §1.4）：軌道 transparent
           讓它跟著所在容器底色走，滑塊用 --line、hover 提到 --dim。 */
        * {
            scrollbar-width: thin;
            scrollbar-color: var(--line) transparent;
        }

        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-track,
        ::-webkit-scrollbar-corner {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            border: 2px solid transparent;
            border-radius: 6px;
            background: var(--line) padding-box;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--dim) padding-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            /* system-ui 置前：依使用者 OS 與語系解析到該平台的系統字（macOS SF／
               日文環境 Hiragino／中文環境思源黑體等），已內建字級光學調整與可讀性微調。
               -apple-system 保留作舊版 Safari/WebKit 回退。 */
            font: 13px/1.5 system-ui, -apple-system, "Hiragino Sans", sans-serif;
            letter-spacing: var(--track-body);
        }

        #header {
            /* 統計標籤改為圖示後（.h-icon 高於文字）改用 center 對齊；
               單行文字之間 center 與 baseline 視覺差可忽略 */
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 10px;
            border-bottom: 1px solid var(--line);
            font-variant-numeric: tabular-nums;
        }

        /* 提督識別區：名稱＋等級成組，共用一個 title（hover 顯示「全名　Lv等級」）。
           整組可收縮，收縮壓力落在名稱上（等級固定不縮）。 */
        #header .idbox {
            display: inline-flex;
            align-items: baseline;
            gap: 6px;
            min-width: 0;
            flex: 0 1 auto;
        }

        #header .nick {
            color: var(--sparkle);
            font-size: 14px;
            font-weight: 600;
            letter-spacing: var(--track-title);
            /* 提督名稱可能過長（遊戲上限 12 文字，全角時仍會擠掉右側統計）：
               唯一允許收縮的項目，超出以省略號截斷、全名在 title */
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #header .grow {
            flex: 1;
        }

        #header .stat {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            flex: none;
        }

        #header .h-icon {
            width: 16px;
            height: 16px;
            flex: none;
            display: block;
        }

        #header .stat b {
            color: var(--brass);
            font-weight: 600;
        }

        #header .stat.warn b {
            color: var(--dmg-mid);
        }

        #header select {
            background: var(--panel);
            color: var(--text);
            border: 1px solid var(--line);
            border-radius: 4px;
            font-size: 11px;
            flex: none;
        }

        #header .num {
            flex: none;
        }

        /* 狀態橫幅（載入中／事件積壓／啟動失敗）。預設是低調的說明語氣；.err 才轉為
           警示色——「面板停在這裡不動了」必須看得出來，但一般的載入提示不該搶戲。 */
        #notice {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            border-bottom: 1px solid var(--line);
            background: var(--panel);
            color: var(--dim);
            font-size: 11px;
            letter-spacing: var(--track-label);
        }

        #notice[hidden] {
            display: none;
        }

        #notice.err {
            color: var(--dmg-major);
        }

        #notice .grow {
            flex: 1;
            /* 錯誤訊息可能很長（Dexie 的例外訊息），允許換行，不截斷原因 */
            min-width: 0;
        }

        #notice button {
            flex: none;
            background: var(--panel);
            color: var(--text);
            border: 1px solid var(--line);
            border-radius: 4px;
            padding: 2px 8px;
            font-size: 11px;
            cursor: pointer;
        }

        #notice button:hover {
            border-color: var(--brass);
            color: var(--sparkle);
        }

        #tabs {
            display: flex;
            padding: 0 10px;
            border-bottom: 1px solid var(--line);
        }

        #tabs button {
            background: none;
            border: none;
            color: var(--dim);
            padding: 6px 12px;
            font-size: 12px;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            /* 回饋在「按下」當下就發生（見下方 :active），放開才有反應會顯得遲鈍；
               100ms 純視覺回饋，不阻擋輸入。 */
            transition: color 100ms ease-out, border-bottom-color 100ms ease-out;
        }

        /* 按下即回饋：不等 click 事件與分頁重繪（autoSwitch 亦會改變 .on） */
        #tabs button:not(.stub):active {
            color: var(--text);
            border-bottom-color: var(--line);
        }

        #tabs button.on {
            color: var(--text);
            border-bottom-color: var(--brass);
        }

        #tabs button.stub {
            color: var(--stub);
            cursor: default;
        }

        /* height（非 max-height）：固定高度讓艦隊編成不隨分頁內容上下跑。
           270（原 300）：在釘死 165px 戰鬥列＋陣型列的前提下，縮掉資訊區底多餘留白，
           編成上移約 30px，配合下方 padding 收斂後可露出七船；內容仍夠塞滿編出擊
          （含大破警告）。**不准改回 max-height**（CLAUDE.md 出擊面板）。 */
        #tabpanel {
            padding: 6px 8px;
            height: 270px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--line) var(--panel);
        }

        h3 {
            margin: 12px 0 6px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: var(--track-label);
            color: var(--brass);
            border-bottom: 1px solid var(--line);
            padding-bottom: 4px;
        }

        h3:first-child {
            margin-top: 0;
        }

        /* 一般分頁上段：資源(左) × 遠征(右) 左右並排；中段：入渠(左) × 建造(右)。
           兩段共用 1fr 1fr，讓資源/遠征欄寬對齊下方入渠/建造欄寬（同一組欄線貫穿兩段）。
           align-items:stretch（非 start）：3 個遠征全滿時遠征欄比資源欄高，若資源欄不隨之
           伸展，兩欄底部會對不齊、緊接著的入渠/建造 row 看起來像貼著較高的那欄——讓兩欄
           都伸展到同一列高，資源欄再用 align-content:space-between 把 4 列撐開對齊底部。
           欄寬一律用 minmax(0, 1fr) 而非裸 1fr：裸 1fr 等同 minmax(auto, 1fr)，欄內若有
           nowrap 長文字（艦名、任務名），該欄的 min-content 會高於半寬並把另一欄擠窄，
           欄界就不再落在容器正中、上下三段（資源/遠征・入渠/建造・任務）分界線互相錯開。
           下限改 0 後欄寬恆為精確半寬，截斷交給欄內元素的 min-width:0 + ellipsis 處理。 */
        .g-top {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 2px 12px;
            align-items: stretch;
            margin-bottom: 6px;
        }

        .g-docks {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 2px 12px;
            align-items: start;
            margin-bottom: 4px;
        }

        /* 資源看板：8 項固定 2 欄×4 列（主資源左欄、消耗材右欄），label 左、數值右對齊。
           label 目前為單字佔位，之後預計換成圖示。 */
        .resblock {
            display: grid;
            grid-auto-flow: column;
            grid-template-rows: repeat(4, auto);
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 1px 12px;
            align-content: space-between;
            font-size: 11px;
            color: var(--dim);
            font-variant-numeric: tabular-nums;
        }

        .resblock span {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
        }

        .resblock b {
            color: var(--text);
            font-weight: 600;
        }

        .resblock i {
            font-style: normal;
            color: var(--brass);
        }

        .timer-row {
            display: flex;
            gap: 8px;
            align-items: baseline;
            padding: 3px 6px;
            border-radius: 4px;
        }

        .timer-row:nth-child(odd) {
            background: var(--panel);
        }

        /* 進行中計時看板：遠征/入渠/建造合併，以彩色類型標籤區分（回收原三條 h3 橫幅） */
        .t-tag {
            font-size: 10px;
            font-weight: 700;
            line-height: 1.5;
            padding: 0 5px;
            border-radius: 4px;
            white-space: nowrap;
            flex: none;
            display: inline-flex;
            align-items: center;
        }

        /* 計時列標籤圖示（渠＝吊臂／建＝造船鎚／遠＝羅盤）：與 .g-icon 同尺寸，
           使計時列高度與裝備 chip 一致；padding 收窄，圖示自身已有留白。
           align-self: .timer-row 用 baseline 對齊，純圖示標籤的 baseline 落在圖片
           底緣、會整個浮高於文字——改成在列內垂直置中（文字彼此仍維持 baseline）。 */
        .t-tag:has(.t-icon) {
            padding: 0 2px;
            align-self: center;
        }

        .t-icon {
            width: 16px;
            height: 16px;
            flex: none;
            display: block;
        }

        /* tt-exped 只用於遠征空狀態列的色底標籤；有資料時遠征列也放羅盤圖示（艦隊編號與
           任務編號之間），但用不帶顏色的裸 .t-tag，純粹當分隔標示，不是狀態色塊。 */
        .t-tag.tt-exped {
            color: var(--brass);
            background: color-mix(in srgb, var(--brass) 16%, transparent);
        }

        .t-tag.tt-dock {
            color: #7fd0ff;
            background: color-mix(in srgb, #7fd0ff 16%, transparent);
        }

        /* 遠征名稱：預設寬度只靠 .timer-row 的 title 懸浮顯示（見 main.ts），這裡的文字
           仍照常渲染進 DOM（提供 a11y／可選取），只用 color:transparent 隱去視覺——
           .grow 既有的 flex:1+ellipsis+nowrap 已把它算進版面寬度，隱藏／顯示不改變
           那顆 badge（倒數時間）的位置，故不需另外用 display:none 挖掉再補空白撐版。
           使用者手動拉寬超過 460px（與 #quests 切欄同一斷點）時顯示出完整名稱。 */
        .exped-name {
            color: transparent;
        }

        @media (min-width: 460px) {
            .exped-name {
                color: inherit;
            }
        }

        .t-tag.tt-build {
            color: #58a55c;
            background: color-mix(in srgb, #58a55c 16%, transparent);
        }

        .dim-txt {
            color: var(--dim);
        }

        /* 任務雙欄：8 個受注任務由 8 列壓成 4 列，塞進摺線內不需捲動。
           用 grid（非 column-count）——multi-column 展開詳情變高時會觸發重新平衡，
           導致後面項目在兩欄間重新分配位置（不只是往下推，會跳欄）；grid-auto-flow:row
           讓每個任務的欄位由順序固定，展開只會把該列變高、下方項目往下推，不會跳欄。
           預設（面板視窗預設寬 420，見 background.ts openPanelWindow「不准加寬」硬約束）
           維持雙欄，欄寬用 minmax(0, 1fr)、column-gap 取 12px 與 .g-top/.g-docks 一致：
           三段的欄界與欄內起始邊因此完全對齊（任務名靠齊入渠列、受注中狀態靠齊建造列）。
           **不可改回裸 1fr**——任務名是 nowrap 長文字，min-content 會超過半寬把左欄擠窄，
           分界線就會偏左、與上方兩段錯開（實測 409px 內寬下曾算出 151px/228px）。
           使用者手動把 panel 視窗拉寬超過預設寬時（見下方 @media，用視窗寬度而非
           #tabpanel 容器寬——避免 #tabpanel 因內容過高出現捲軸時誤觸切欄）才切換成單欄，
           讓任務說明有更寬的可用空間。 */
        #quests {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 0 12px;
            align-items: start;
        }

        @media (min-width: 460px) {
            #quests {
                grid-template-columns: minmax(0, 1fr);
            }
        }

        .quest-row {
            display: flex;
            gap: 8px;
            align-items: baseline;
            padding: 3px 6px;
            border-radius: 4px;
            cursor: pointer;
        }

        .quest-cell:nth-child(odd) .quest-row {
            background: var(--panel);
        }

        .quest-row.done .grow {
            color: var(--dmg-minor);
        }

        .quest-detail {
            padding: 2px 6px 6px 6px;
            font-size: 0.9em;
            color: var(--dim);
            white-space: normal;
        }

        .badge {
            color: var(--brass);
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .grow {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .num {
            font-variant-numeric: tabular-nums;
            color: var(--dim);
        }

        .empty,
        .dim {
            color: var(--dim);
            padding: 2px 6px;
        }

        #log {
            font: 11px/1.6 ui-monospace, monospace;
            color: var(--dim);
            max-height: 260px;
            overflow-y: auto;
        }

        #fleetnav {
            display: flex;
            align-items: center;
            gap: 4px;
            /* 收垂直 padding：縮小「陣型列／分頁底」到編成之間的空隙，七船用 */
            padding: 4px 10px;
            border-bottom: 1px solid var(--line);
        }

        #fleetnav button {
            background: none;
            border: 1px solid var(--line);
            color: var(--dim);
            border-radius: 5px;
            padding: 3px 10px;
            font-size: 12px;
            cursor: pointer;
        }

        #fleetnav button.on {
            color: var(--text);
            border-color: var(--brass);
            background: color-mix(in srgb, var(--brass) 14%, transparent);
        }

        #fleetnav button.stub {
            color: var(--stub);
            border-style: dashed;
            cursor: default;
        }

        /* 該編成有大破或未補給的船——紅框疊在既有 border 外，跟 .on 的 border-color
           變化互不干擾（不論分頁是否選取都看得到警示）。 */
        #fleetnav button.attn {
            box-shadow: 0 0 0 1px var(--dmg-major);
        }

        /* 基地航空隊鈕：有中隊帶疲勞標記時，整顆鈕的文字與外框轉成對應語意色
           （黃標記＝cond 20–29／紅標記＝cond 0–19，取最嚴重的一段）。
           **必須排在 `.on` 之後**（同 specificity，後者勝）——面板正開著 LBAS 分區時
           一樣要看得到疲勞，否則最該注意的時候反而沒有標示。
           與 `.attn`（機數未補滿的紅框）是兩套獨立語意，可同時成立：框線色講疲勞、
           外圈 box-shadow 講未補給。 */
        #fleetnav button.cond-tired {
            color: var(--lbas-tired);
            border-color: var(--lbas-tired);
        }

        #fleetnav button.cond-exhausted {
            color: var(--dmg-major);
            border-color: var(--dmg-major);
        }

        #fleetnav .grow {
            flex: 1;
        }

        #fleets {
            padding: 6px 10px 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            align-items: flex-start;
        }

        section.fleet {
            flex: 1 1 320px;
            min-width: 320px;
            max-width: 480px;
        }

        /* 聯合艦隊檢視：#fleets 只放一個 .combined-wrap 子元素——上排 .fsummary.combined-total
           （兩隊合計統計，全寬）、下排 .c-fleet-row（兩隊左右並排，各佔一半可用寬，420
           視窗內寬 400 − gap 8 → 約 196px），故必須解除單隊檢視的 min-width:320
           （否則會被擠成上下堆疊）。欄內一切以 min-width:0 允許艦名截斷為前提。 */
        .combined-wrap {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
        }

        .c-fleet-row {
            display: flex;
            gap: 8px;
        }

        section.fleet.compact {
            flex: 1 1 0;
            min-width: 0;
            max-width: none;
        }

        /* 聯合檢視是全新版面，窗高 850px 是照「單隊 4 分頁」版面實機量測校準的
           （見 background.ts openPanelWindow 註解）。單隊版面有「遊撃部隊」最多 7 艘
           的特殊編成需要容納，聯合檢視兩隊組合則固定各 6 艘（一般艦隊上限，遊撃部隊
           不會出現在連合艦隊）——用無頭 Chrome 對真實 index.html+CSS 實測驗證：單隊
           7 艘滿編（沿用已知校準過的 ship-row/sub-row 版面）內容總高 779px，是這個
           850px 視窗已知安全（無捲動）的配置；聯合檢視 6 艘全裝滿槽的最差情況只要
           727px，等於還有約 50px 沒用到。這裡把這筆餘裕吃下去、放寬行距與圖示尺寸，
           不用再逼到 1.2 這麼緊；每項調整後都重新量測，總高抓在 770px 左右、比 779px
           的已知安全值再留一點餘裕（沒有實機裝置能再驗證，保守一點比較安心）。 */
        .fsummary.combined-total {
            padding: 6px 6px 5px;
            font-size: 12px;
            line-height: 1.3;
            border-bottom: 1px solid var(--line);
        }

        .fsummary.compact {
            gap: 6px;
            align-items: center;
            padding: 2px 4px 4px;
            line-height: 1.25;
        }

        .fsummary.compact .badge-tag {
            font-size: 9px;
            padding: 0 4px;
        }

        .ship.c {
            padding: 2px 5px;
            line-height: 1.3;
        }

        .ship.c .c-top,
        .ship.c .c-bot {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .ship.c .c-top {
            font-size: 12px;
        }

        /* 艦種縮寫固定寬度＋置中：縮寫本身長度不一（DD 2字 vs CVL 3字），若跟單隊
           檢視一樣讓徽章寬度隨文字伸縮，艦名起始位置會逐艦不同，並排欄裡直排下來
           會參差不齊。固定寬度後徽章本身长度仍隨文字置中顯示，但艦名一律從同一個
           x 位置起算，同時解決「沒有分隔」（沿用 .stype 徽章底色/邊框）與「對不
           齊」兩個問題。該艦艦種未知（stype 空字串）時徽章仍佔位、留空，不影響對齊。
           寬度用 px 非 em：用無頭 Chrome 實測全部 19 種縮寫（見 STYPE_ABBR）的自然
           寬度，最寬的 CAV/CVL/BBV/SSV/LHA/CVB 落在 28-30.4px（2.6em=23.4px 明顯不夠，
           CVB 溢出達 7px、正是 BBV 爆框的原因）；32px 留一點緩衝，不用 em 是因為
           em 是照 .stype 自己的 9px 字級換算，字級微調會連帶改變這個寬度，px 才是
           真正跟文字寬度需求綁定的單位。 */
        .ship.c .stype {
            width: 32px;
            text-align: center;
            flex: none;
            margin-right: 0;
        }

        /* 艦名過長時截斷（全名在 title）——並排欄寬無法容納長名，換行會破壞列高一致。 */
        .ship.c .c-top .grow {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .ship.c .lv {
            flex: none;
            font-size: 11px;
            color: var(--dim);
            font-variant-numeric: tabular-nums;
        }

        .ship.c .cond {
            width: 2.4em;
            font-size: 12px;
        }

        .ship.c .hpbar {
            flex: 1;
            width: auto;
            height: 6px;
        }

        .ship.c .num {
            font-size: 11px;
        }

        /* 燃彈迷你量表：左燃右彈，各自從外緣往內縮，中間露底色＝已消耗（同單隊檢視配色）。 */
        .ship.c .c-sup {
            display: inline-flex;
            gap: 1px;
            width: 28px;
            flex: none;
        }

        .ship.c .c-sup>i {
            height: 5px;
            flex: 1;
            border-radius: 2px;
            background-color: var(--line);
        }

        /* 裝備列（HP 列下方新增一行）：不沿用單隊檢視的完整 .chip 結構（那個排法
           連同 r-col 的熟練/改修兩行，塞進聯合欄寬後看起來就是縮小版單隊列，過於
           擁擠）。改用單純的「圖示＋搭載數」小標籤：數字放在圖示右側（非疊在圖示
           角落），改修★／熟練度移進 title、hover 才看到，讓聯合檢視的裝備列真正
           比單隊檢視精簡。 */
        /* 外層：一般槽位（.c-gear-slots，可換行）＋打洞格，打洞格 flex:none 天然被
           推到最右、不隨一般槽位數量變動而跳位（見 main.ts compactGearRow 說明）。 */
        .c-gear {
            display: flex;
            align-items: flex-start;
            gap: 4px;
            margin-top: 2px;
            line-height: 1;
        }

        .c-gear-slots {
            flex: 1;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            min-width: 0;
        }

        .cg-item {
            display: inline-flex;
            align-items: center;
            gap: 2px;
        }

        .cg-item .g-icon,
        .cg-item .g-icon-slot {
            width: 15px;
            height: 15px;
        }

        /* 未裝備槽位：同單隊檢視 .chip-empty 的淡化＋虛線語意，但縮到與 .cg-item
           圖示同尺寸的方框（非撐出完整 chip 寬度——這裡沒有跨艦對齊需求）。 */
        .cg-item.cg-empty {
            opacity: .5;
        }

        .cg-item.cg-empty .g-icon-slot {
            display: inline-block;
            outline: 1px dashed var(--line);
            outline-offset: -1px;
            border-radius: 2px;
        }

        /* 打洞格（補強增設）：呼應單隊檢視 .chip.ex 的 brass 虛線標示，跟一般裝備格
           區分開。:not(.cg-empty) 避免跟下面 .cg-empty .g-icon-slot 的內層虛線疊成雙框。 */
        .cg-item.ex:not(.cg-empty) {
            outline: 1px dashed var(--brass);
            outline-offset: 1px;
            border-radius: 2px;
        }

        .cg-item.cg-empty.ex .g-icon-slot {
            outline-color: var(--brass);
        }

        .cg-item em {
            font-style: normal;
            font-weight: 700;
            font-size: 9px;
            line-height: 1;
            color: var(--dim);
            font-variant-numeric: tabular-nums;
        }

        .cg-item em.hit {
            color: var(--dmg-mid);
        }

        .cg-item em.zero {
            color: var(--dmg-major);
        }

        section.fleet h4 {
            margin: 4px 0 4px;
            font-size: 12px;
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .badge-tag {
            font-size: 10px;
            padding: 1px 6px;
            border-radius: 8px;
            border: 1px solid var(--line);
            color: var(--dim);
        }

        .badge-tag.mission {
            color: var(--brass);
            border-color: var(--brass);
        }

        .badge-tag.danger {
            color: #fff;
            background: var(--dmg-major);
            border-color: var(--dmg-major);
        }

        .badge-tag.secretary {
            color: var(--sparkle);
            border-color: var(--sparkle);
        }

        /* 泊地修理／給糧的摘要 badge，與左緣範圍軌同色系互相呼應。 */
        .badge-tag.repair {
            color: var(--brass);
            border-color: var(--brass);
        }

        .badge-tag.morale {
            color: var(--sparkle);
            border-color: var(--sparkle);
        }

        /* 倒數是「估算值」（遊戲不送泊地修理封包，計時器靠觀察編成封包推算），
           故刻意用弱化樣式，不與確定性的遠征/入渠倒數同樣強調。 */
        .badge-tag.est {
            color: var(--dim);
            border-style: dashed;
        }

        .fsummary {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            font-size: 11px;
            color: var(--dim);
            padding: 0 6px 4px;
            font-variant-numeric: tabular-nums;
        }

        /* 估算值（目前只有熟練度過時的制空）：沿用面板既有的估算視覺語彙——虛線。
           數字照常顯示，只是提示它可能不是封包事實（見 GameState.alvStale）。 */
        .fsummary b.est {
            border-bottom: 1px dashed var(--dim);
            cursor: help;
        }

        .fsummary b {
            color: var(--text);
            font-weight: 600;
        }

        .fsummary select {
            background: var(--panel);
            color: var(--text);
            border: 1px solid var(--line);
            border-radius: 4px;
            font-size: 11px;
        }

        .ship {
            padding: 2px 6px;
            border-radius: 4px;
        }

        .ship:nth-child(odd) {
            background: var(--panel);
        }

        /* ── 泊地修理／給糧的「範圍軌」──
           以 inset box-shadow 疊在艦列左緣畫縱向色條，不動 DOM 結構。多層 inset 時
           先列的疊在上層，故 3px 的修理軌壓在 6px 的給糧軌之上 → 視覺上並排兩條。
           左內距讓出 8px 給軌條，避免壓到艦種縮寫。
           配色：修理用 --brass、給糧用 --sparkle（キラ/改修的既有語意，相符）；
           **不用 --dmg-* 語意色**，那組專屬損傷程度，見 design-guidelines §4.5。 */
        .ship.rail-rep,
        .ship.rail-mor {
            padding-left: 14px;
        }

        .ship.rail-rep {
            box-shadow: inset 3px 0 0 0 var(--brass);
        }

        .ship.rail-mor {
            box-shadow: inset 3px 0 0 0 var(--sparkle);
        }

        .ship.rail-rep.rail-mor {
            box-shadow: inset 3px 0 0 0 var(--brass), inset 7px 0 0 0 var(--sparkle);
        }

        /* 逐艦標記：在範圍內、本次結算會實際生效者為實色；因中破/入渠等被跳過者
           降為 --stub 並加刪除線，讓「在範圍內但不會被處理」與「根本不在範圍」可區分。 */
        .rmark {
            font-size: 9px;
            letter-spacing: var(--track-tag);
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }

        .rmark.rep {
            color: var(--brass);
        }

        .rmark.mor {
            color: var(--sparkle);
        }

        .rmark.skip {
            color: var(--stub);
            text-decoration: line-through;
        }

        .ship-row,
        .sub-row {
            display: flex;
            gap: 8px;
            align-items: baseline;
        }

        /* 三個直屬元件（一般槽組／增設槽／燃彈）各收 1px gap：五格一般槽＋增設槽的
           最寬組合仍在 420px 視窗內，且不必裁到任何圖示或數字。 */
        .sub-row {
            gap: 5px;
            min-width: 0;
        }

        .ship-row {
            flex-wrap: wrap;
        }

        .hpbar {
            position: relative;
            width: 56px;
            height: 5px;
            background: var(--line);
            border-radius: 3px;
            overflow: hidden;
            align-self: center;
        }

        .hpbar>i {
            position: absolute;
            inset: 0;
            right: auto;
            background: #58a55c;
        }

        .st-minor .hpbar>i {
            background: var(--dmg-minor);
        }

        .st-mid .hpbar>i {
            background: var(--dmg-mid);
        }

        .st-major .hpbar>i {
            background: var(--dmg-major);
        }

        /* 大破艦：艦名轉紅。單隊與聯合（.ship.c）兩種艦列同一條——**聯合檢視刻意不另外
           掛「大破」徽章**：徽章會在大破出現的瞬間憑空多長一列，把整排艦往下推，正在盯的
           那一艘會突然換位置，比沒有警示更難用。紅字長在該艘船自己身上，不佔版面。 */
        .st-major .ship-row .grow,
        .ship.c.st-major .c-top .grow {
            color: var(--dmg-major);
            font-weight: 600;
        }

        .cond {
            width: 3em;
            text-align: right;
            font-variant-numeric: tabular-nums;
            color: var(--dim);
        }

        .cond.sparkle {
            color: var(--sparkle);
        }

        .cond.tired {
            color: var(--dmg-mid);
        }

        .cond.heavy {
            color: var(--dmg-major);
        }

        /* 結構維持：.chips{flex:1} 裝一般槽，打洞＋燃彈在外側由剩餘空間推到列尾。
           曾改 display:contents＋sub-row nowrap＋ex margin-left:auto，會讓
           「跨艦 pad＋鎖寬＋燃彈 54」總寬超過視窗，右側燃彈整列被裁切
           （samples/fleet_slot_{1,2,3}.png）——那條路已否決。
           第五格換行的真因是 SVG／熟練字元把單格撐到 ~55px；下面鎖 min/max 即可。
           五格一般槽＋增設槽時，將一般格縮至 46px（20px 圖示＋1px gap＋23px
           資訊欄＋兩側各 1px 內距）且各 gap 收 1px，保證最後一格不會壓到增設槽。
           ⚠️ 高度硬約束：窗高 850 是按「單艘列高 ≈49.5px × 7 艘」校準的
           （background.ts openPanelWindow）。裝備列一旦 wrap 成兩行，單艘變高，
           第 7 艘就會被視窗底裁掉——所以這裡用 nowrap，並把格寬收到預算內。 */
        .chips {
            flex: 1;
            display: flex;
            flex-wrap: nowrap;
            gap: 2px;
            min-width: 0;
        }

        /* 一般格 46px、打洞 39、燃彈 56（「100」不裁字）：5×46+gap8=238，
           ＋39＋56＋sub-row gap10 ≈ 343，收進 420；.chips nowrap 禁止換行。
           必須對 .chip／.g-icon 鎖 min/max，否則 SVG／「///」撐破→換行→七船被裁。 */
        .chip {
            box-sizing: border-box;
            display: inline-flex;
            align-items: center;
            gap: 1px;
            width: 46px;
            min-width: 46px;
            max-width: 46px;
            flex: none;
            overflow: hidden;
            font-size: 10px;
            line-height: 1;
            padding: 2px 1px;
            border-radius: 3px;
            background: var(--line);
            color: var(--text);
            white-space: nowrap;
        }

        /* 空白 chip 的圖示佔位（無 <img>）：與 .g-icon 同尺寸，讓「未裝備」與「跨艦
           補位」兩種空 chip 都用真實 <u>/<b> 槽位撐出寬度，與有裝備的 chip 完全同寬——
           不必另外硬編一個總寬度數字去追平（那樣每次調整 padding/gap 都要重算，還容易兜不齊）。 */
        .g-icon-slot {
            width: 16px;
            height: 16px;
            flex: none;
            display: inline-block;
        }

        /* chip 內部佈局：右欄（r-col）上排熟練＋改修（r-top）、下排搭載機數（oc），
           自然高度約 19px（10+gap1+8）——左側圖示取 20px 正方形填滿這個自然高度，
           不另外撐大 chip（放大是「用好既有空間」而非搶預算）。oc 行高恆保留——
           非飛機槽／空格也佔同高，讓所有 chip、進而所有艦列高一致（見 main.ts
           chip/blankChip）。搭載數平時（滿載）暗灰低調；戰損轉橘、全滅轉紅。
           圖示放大只限艦隊裝備 chip（.chip 範圍），其餘處（sq-chip、資源列）維持 16px。 */
        .chip .g-icon,
        .chip .g-icon-slot {
            box-sizing: border-box;
            width: 20px;
            height: 20px;
            min-width: 20px;
            max-width: 20px;
            flex: none;
            /* SVG filter 外擴不應撐開 flex 最小內容尺寸 */
            overflow: hidden;
        }

        .r-col {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 1px;
            flex: none;
            width: 23px; /* u12 + gap1 + b10：鎖死以免 .oc 兩位數把整格撐寬 */
            min-width: 23px;
            max-width: 23px;
            overflow: hidden;
        }

        .r-top {
            display: flex;
            align-items: baseline;
            gap: 1px;
        }

        .r-col .oc {
            height: 8px;
            font-size: 8px;
            font-style: normal;
            font-weight: 700;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            color: var(--dim);
        }

        .r-col .oc.hit {
            color: var(--dmg-mid);
        }

        .r-col .oc.zero {
            color: var(--dmg-major);
        }

        /* 未裝備槽位：該艦真實存在、但未裝備的槽位，虛線＋低透明度標示。
           用 outline 而非 border，因 outline 不佔版面（不影響盒子尺寸），確保與
           有裝備的 chip 同寬。 */
        .chip-empty {
            outline: 1px dashed var(--line);
            outline-offset: -1px;
            background: none;
            opacity: .5;
        }

        /* 跨艦補位槽：該艦本身沒有這個槽位（例如 2 格艦排在 4 格艦旁邊），純粹用來讓
           同艦隊每艘船的裝備列行數（進而列高）一致，完全不可見（連虛線都不畫，
           避免被誤讀成「這裡有個空槽」）。 */
        .chip-pad {
            visibility: hidden;
        }

        /* 裝備／資源圖示：本專案原創向量重繪（見 THIRD-PARTY-NOTICES）。SVG 在任何
           解析度／縮放皆銳利，不隨 DPI 產生鋸齒或糊邊。固定寬度使多語系切換時排版
           一致（不隨字寬變動）。圖示自帶配色，故 chip 底色維持中性。 */
        .g-icon,
        .m-icon {
            width: 16px;
            height: 16px;
            flex: none;
        }

        .m-icon {
            vertical-align: -3px;
        }

        /* 熟練（u，在前）與改修（b，在後）槽固定寬度、不隨內容伸縮（flex:none），
           空槽也佔位——讓同格數裝備列跨艦等寬對齊。顏色刻意對調：熟練金、改修藍。
           熟練寬度以 /// 為準；改修僅單字元（數字或滿改修的 ★）故較窄。
           寬度屬於「六格一行」預算的一部分（見 .chip 註解），加寬前先重算。 */
        .chip u {
            flex: none;
            display: inline-block;
            box-sizing: border-box;
            width: 12px;
            min-width: 12px;
            max-width: 12px;
            overflow: hidden;
            text-align: left;
            text-decoration: none;
            color: var(--sparkle);
        }

        .chip b {
            flex: none;
            display: inline-block;
            box-sizing: border-box;
            width: 10px;
            min-width: 10px;
            max-width: 10px;
            overflow: hidden;
            text-align: left;
            color: #7fd0ff;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .chip.ex {
            width: 39px;
            min-width: 39px;
            max-width: 39px;
            outline: 1px dashed var(--brass);
        }

        /* 打洞格的改修沒有 r-col（見 main.ts chip()/blankChip() 的 ex 分支：裝不了
           熟練度、也裝不了飛機，無需 u／oc 兩個對齊基準），單獨一個 <b> 時置中
           比沿用一般 chip 的靠左更平衡；垂直置中則直接吃 .chip 既有的
           align-items:center，不必再寫。 */
        .chip.ex b {
            width: 14px;
            min-width: 14px;
            max-width: 14px;
            text-align: center;
        }

        /* 空的打洞格（該艦有補強增設能力、但未裝備）：沿用一般空格的淡化＋虛線，但
           虛線改用 brass（呼應已裝備打洞格的 .chip.ex），與「一般空裝備格」（灰虛線）
           及「已裝備打洞格」（brass 實色底）三者都能一眼分辨。 */
        .chip-empty.ex {
            outline-color: var(--brass);
        }

        /* 色別（艦隊裝備 chip 已移除左側色邊：圖示本身已帶配色，色邊會讓有色別/無
           色別的 chip 寬度不一致、破壞跨艦對齊；基地航空隊 sq-chip 無此對齊需求，保留）。 */
        .sq-chip.c-gun { border-left: 2px solid #c96a6a; }
        .sq-chip.c-sec { border-left: 2px solid #cbb35a; }
        .sq-chip.c-torp { border-left: 2px solid #5a86c9; }
        .sq-chip.c-ftr { border-left: 2px solid #5ac97a; }
        .sq-chip.c-db { border-left: 2px solid #d97a5a; }
        .sq-chip.c-tb { border-left: 2px solid #5ac2cc; }
        .sq-chip.c-rec { border-left: 2px solid #d9c95a; }
        .sq-chip.c-sea { border-left: 2px solid #5aa6d9; }
        .sq-chip.c-radar { border-left: 2px solid #d99e5a; }
        .sq-chip.c-asw { border-left: 2px solid #5ac2a6; }
        .sq-chip.c-etc { border-left: 2px solid #6a7488; }

        /* 燃彈合併 chip：在 .chips 之外，靠 .chips{flex:1} 推到列尾。
           56px＋9px 字：兩側「100」完整可見，不准 overflow 裁字。 */
        .chip.supply-combo {
            padding: 0;
            gap: 0;
            overflow: hidden;
            width: 56px;
            min-width: 56px;
            max-width: 56px;
            flex: none;
            align-self: center;
            font-variant-numeric: tabular-nums;
            font-weight: 600;
            font-size: 9px;
        }

        /* 兩半各為迷你量表：色塊背景由 inline linear-gradient 給（寬度=殘量%，
           燃料錨左、彈藥錨右，見 main.ts supplyChip），透明處露出 .chip 的 --line
           底色即消耗部分。文字用亮色＋暗描邊，色塊上與露底處都可讀。 */
        .chip.supply-combo .sup-fuel,
        .chip.supply-combo .sup-ammo {
            flex: 1 1 0;
            min-width: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2px 1px;
            overflow: visible;
            color: var(--text);
            text-shadow: 0 0 2px #10151d, 0 0 2px #10151d;
        }

        .exped-controls {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        .exped-controls select {
            background: var(--panel);
            color: var(--text);
            border: 1px solid var(--line);
            border-radius: 5px;
            font-size: 12px;
            padding: 3px 6px;
            max-width: 60%;
        }

        .check-row {
            display: flex;
            gap: 8px;
            align-items: baseline;
            padding: 3px 6px;
            border-radius: 4px;
        }

        .check-row:nth-child(odd) {
            background: var(--panel);
        }

        .check-row .mark {
            width: 1.4em;
            text-align: center;
            font-weight: 700;
        }

        .check-row.ok .mark {
            color: #58a55c;
        }

        .check-row.ng .mark {
            color: var(--dmg-major);
        }

        .check-row.ng .grow {
            color: var(--dmg-mid);
        }

        /* ── 基地航空隊 ──
           版面硬約束：一個海域最多三隊、一隊最多四個中隊，**三隊必須在不捲動的前提下
           全部看得完**（LBAS 區塊與 #fleets 共用同一塊可用高度，約 440px）。原本
           「表頭／制空列／四個中隊各自成列」的排法量到 626px，超出 186px。現行排法為
           (a) 隊名＋制空＋半徑＋行動徽章併成單行 `.ab-head1`、(b) 四個中隊改 2×2 雙欄
           `.ab-sq-grid`、(c) 卡片與列距收緊，量到 320px（餘裕 120px）。
           **改這一區前先跑離線預覽比高度**（不必等活動開圖、不必真的配好三隊）：
             npx vite-node --config vitest.config.ts tools/preview/lbas-layout.ts
           那支腳本套的是本檔同一份 CSS，並列出現況與各候選版本的實測高度。 */
        /* `.air-bases` 同列：離線預覽一頁要放多個 LBAS 區塊，id 只能有一個 */
        #air-bases,
        .air-bases {
            padding: 6px 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .ab-tabs {
            display: flex;
            gap: 6px;
            overflow-x: auto;
        }

        .ab-tabs button {
            background: none;
            border: 1px solid var(--line);
            color: var(--dim);
            border-radius: 5px;
            padding: 4px 10px;
            font-size: 11px;
            cursor: pointer;
            white-space: nowrap;
        }

        .ab-tabs button.on {
            color: var(--text);
            border-color: var(--brass);
            background: color-mix(in srgb, var(--brass) 14%, transparent);
        }

        .ab-tabs button:active {
            color: var(--text);
            border-color: var(--brass);
            transform: scale(.97);
        }

        .ab-area-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: var(--track-label);
            color: var(--brass);
            border-bottom: 1px solid var(--line);
            padding-bottom: 4px;
            margin: 0;
        }

        .ab-maintenance {
            color: var(--dim);
            font-size: 10px;
            font-weight: 500;
            letter-spacing: normal;
            white-space: nowrap;
        }

        .ab-card {
            background: var(--panel);
            border-radius: 6px;
            padding: 5px 8px;
            border: 1px solid var(--line);
        }

        /* 抬頭列：隊名｜制空・半徑｜行動徽章。制空/半徑刻意與隊名同列——它們是掃視用的
           兩個數字，獨立成列只是多吃 23px。baseline 對齊讓 12px 隊名與 10px 數字齊腳。 */
        .ab-head1 {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 4px;
        }

        .ab-head1 .ab-name {
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }

        .ab-head1 .grow {
            flex: 1;
        }

        .ab-action {
            font-size: 10px;
            padding: 1px 8px;
            border-radius: 8px;
            font-weight: 600;
        }

        .ab-action.act-0 {
            color: var(--dim);
            border: 1px solid var(--line);
        }

        /* 待機 */
        .ab-action.act-1 {
            color: #ff6b6b;
            border: 1px solid #ff6b6b;
        }

        /* 出撃 */
        .ab-action.act-2 {
            color: #51cf66;
            border: 1px solid #51cf66;
        }

        /* 防空 */
        .ab-action.act-3 {
            color: var(--stub);
            border: 1px solid var(--stub);
        }

        /* 退避 */
        .ab-action.act-4 {
            color: #74c0fc;
            border: 1px solid #74c0fc;
        }

        /* 休息 */

        .ab-inline-stats {
            font-size: 10px;
            color: var(--dim);
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        .ab-inline-stats b {
            color: var(--text);
            font-weight: 600;
        }

        /* 中隊 2×2：一隊四個中隊排成兩列兩欄，比逐列排省 48px/卡。
           `min-width: 0` **不可拿掉**——grid item 預設 `min-width: auto` 會被最長的中隊名
           （如「一式戦 隼III型甲(54戦隊)」）撐破卡片右緣，機數與疲勞標記會被切掉。 */
        .ab-sq-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            column-gap: 6px;
        }

        .ab-sq {
            display: flex;
            gap: 6px;
            align-items: center;
            padding: 1px 3px;
            border-radius: 4px;
            font-size: 11px;
            min-width: 0;
        }

        .ab-sq>* {
            min-width: 0;
        }

        /* 斑馬紋：雙欄下 `nth-child(odd)` 會變成左右交錯（讀起來像壞掉），改成整個上排一組 */
        .ab-sq-grid .ab-sq:nth-child(-n+2) {
            background: color-mix(in srgb, var(--line) 40%, transparent);
        }

        .ab-sq .sq-chip {
            display: inline-flex;
            align-items: center;
            gap: 1px;
            font-size: 10px;
            line-height: 1;
            padding: 2px 4px;
            border-radius: 3px;
            background: var(--line);
            white-space: nowrap;
        }

        /* 顏色與編成 chip 一致：熟練金、改修藍。 */
        .ab-sq .sq-chip b {
            color: #7fd0ff;
            font-weight: 600;
            margin-left: 1px;
        }

        .ab-sq .sq-chip u {
            text-decoration: none;
            color: var(--sparkle);
            margin-left: 1px;
        }

        .ab-sq .sq-name {
            flex: 1;
            min-width: 0;
            line-height: 1.3;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .ab-sq .sq-count {
            font-size: 10px;
            font-variant-numeric: tabular-nums;
            color: var(--dim);
        }

        .ab-sq .sq-count.depleted {
            color: var(--dmg-major);
        }

        /* 雙欄下欄寬只剩一半，疲勞標記不再預留固定寬（`min-width` 會再吃掉中隊名的空間） */
        .ab-sq .sq-cond {
            font-size: 10px;
            text-align: right;
            white-space: nowrap;
        }

        /* 疲勞標記的表情（見 main.ts `condFaceSvg` 的理由說明）。
           **必須是內聯 SVG**——走 `<img src>` 時 SVG 是獨立文件、吃不到這裡的 CSS，
           就無法用 currentColor 沿用下面 .cond-tired／.cond-exhausted 的語意色。 */
        .ab-sq .sq-cond.face {
            display: inline-flex;
            align-items: center;
            flex: none;
        }

        .ab-sq .cond-face {
            width: 11px;
            height: 11px;
            display: block;
        }

        /* 輕度疲勞（api_cond 1）：**遊戲本身不顯示任何標記**，所以這裡只給一顆空心小點，
           顏色走 --dim（不是警示色）。它回答的是「還沒到黃臉、但已經不是全滿」——
           KC3Kai 同樣把「全滿」與「輕度疲勞」分成兩種表情。
           ⚠️ 不可升級成臉或警示色：那會比遊戲本身還吵，屬過度提醒。 */
        .ab-sq .sq-cond.mild {
            display: inline-flex;
            align-items: center;
            flex: none;
            color: var(--dim);
        }

        .ab-sq .sq-cond.mild .cond-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            border: 1.5px solid currentColor;
        }

        /* 「可能已回復但不能斷定」：淡化＋去掉臉的填色，讓它明顯不是斷言。
           遊戲的疲勞回復不送封包，出撃札的橙 3 分鐘就可能退掉、卻要 30 分鐘才能確定
           （見 utils/lbas-cond.ts）；那段期間畫實心臉等於拿不確定的事當事實講。
           ⚠️ 只淡化、**不可直接不顯示**——「不能斷定」不等於「已經回復」，
           拿掉是把仍疲勞的中隊謊報成正常，那是更危險的方向。 */
        .ab-sq .sq-cond.face.unsure {
            opacity: .55;
        }

        .ab-sq .sq-cond.face.unsure .cond-face circle[fill],
        .ab-sq .sq-cond.face.unsure .cond-face path[fill="none"] {
            opacity: .7;
        }

        /* 與編成列的基地航空隊鈕同一個變數：同一個「輕度疲勞」語意只有一個色源 */
        .ab-sq .sq-cond.cond-tired {
            color: var(--lbas-tired);
        }

        .ab-sq .sq-cond.cond-exhausted {
            color: var(--dmg-major);
        }

        .ab-sq .sq-cond.cond-unknown {
            color: var(--stub);
        }

        /* 未配備只是佔位訊息，不需要跟已配備列一樣高 */
        .ab-sq.empty-sq {
            color: var(--stub);
            font-style: italic;
            font-size: 10px;
            padding: 0 3px;
        }

        /* ── 出擊 (Sortie) ── */
        .sortie-container {
            padding: 4px 6px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            background: rgba(10, 20, 30, 0.4);
            border-radius: 6px;
            margin: 0;
        }

        .s-header {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .s-map-id {
            color: var(--sparkle);
            font-size: 13px;
            font-weight: 900;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
            white-space: nowrap;
        }

        /* 活動難度徽章（甲乙丙丁）：貼在 E{n} 後面，字級小一階、不搶海域代號的視覺重量 */
        .s-map-id > i {
            margin-left: 3px;
            font-style: normal;
            font-size: 10px;
            font-weight: 700;
            color: var(--brass);
        }

        /* 未出擊時的關卡量表列（見 main.ts mapGaugeListHtml）。出擊資訊欄的釘死版面只在
           真的進入出擊後才成立，這一態是空畫面，可自由用一般流排版。 */
        .s-standby {
            padding: 10px;
        }

        .s-standby-hint {
            color: var(--dim);
        }

        .s-standby-maps {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 10px;
        }

        .s-standby-map {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 海域代號欄寬對齊，量表左緣才不會隨 E1／E2 長度參差 */
        .s-standby-map > .s-map-id {
            min-width: 44px;
        }

        /* 關卡進度：緊湊量表（擊破數式／HP量表式），或已攻略/未攻略/鎖定小標記 */
        .s-gauge {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* 圓矩 pill：殘量條當背景，剩餘實數（2760/4600）直接寫在條子裡。
           軌道色刻意固定為深色調（亮色主題也不轉淺）——條子裡是白字，軌道一淺
           就會有一半數字讀不到；這是可讀性需求，不是配色偏好。 */
        .s-gauge-bar {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            min-width: 56px;
            height: 13px;
            padding: 0 5px;
            background: var(--gauge-track);
            border-radius: 7px;
            overflow: hidden;
            flex: none;
        }

        .s-gauge-bar > i {
            position: absolute;
            inset: 0;
            right: auto;
            background: linear-gradient(90deg, var(--dmg-major), var(--sparkle));
        }

        .s-gauge-num {
            position: relative;
            font-size: 9px;
            font-weight: 700;
            line-height: 1;
            color: #fff;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
        }

        /* 斬殺期：不能只換量表顏色（新版曾因此讓狀態訊號消失），但標籤也**不可以是外掛的
           第二顆徽章**——兩顆並排會把標題列撐寬，`.s-header` 是 flex-wrap，撐過去就換行，
           換行就多一整列、把下面釘死的出擊資訊往下推到要捲動（出擊資訊欄硬約束）。
           故標籤併進量表本體，成為條子裡「斬殺期 840/4840」的一段。

           **高度與一般狀態完全相同（13px）**：狀態一變高度就變，量表所在的標題列會跟著
           長高、整個編成往下位移，而斬殺期正是最需要盯著版面不動的時候。輪廓因此改用
           inset box-shadow（不佔版面、不吃 border-box），不再改 height 或加 border。 */
        .s-gauge-final {
            position: relative;
            font-size: 9px;
            font-weight: 700;
            line-height: 1;
            letter-spacing: 0;
            white-space: nowrap;
            /* 不用純白＋800 粗：那組在深軌道上會糊成一團，亮度也壓過旁邊真正要讀的數值。
               改為偏暖的淡金，與斬殺斜紋同色源，維持辨識度又讓數值回到視覺主位。 */
            color: color-mix(in srgb, var(--sparkle) 55%, #fff);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
        }

        .s-gauge.zansatsu .s-gauge-bar {
            box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--sparkle) 72%, transparent);
        }

        .s-gauge.zansatsu .s-gauge-bar > i {
            background: repeating-linear-gradient(
                135deg,
                color-mix(in srgb, var(--sparkle) 76%, var(--gauge-track)) 0 5px,
                color-mix(in srgb, var(--sparkle) 52%, var(--gauge-track)) 5px 10px
            );
        }

        .s-gauge.cleared,
        .s-gauge.uncleared,
        .s-gauge.locked {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            font-size: 10px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--line);
        }

        .s-gauge.cleared {
            color: #58a55c;
            border-color: #58a55c;
        }

        .s-gauge.locked {
            font-size: 9px;
            color: var(--dim);
        }

        .s-gauge.uncleared {
            color: var(--dim);
        }

        .s-phase {
            font-size: 10px;
            font-weight: 700;
            color: #82ccdd;
            border: 1px solid #82ccdd;
            background: color-mix(in srgb, #82ccdd 12%, transparent);
            border-radius: 8px;
            padding: 0 8px;
            line-height: 15px;
            white-space: nowrap;
        }

        .s-phase.active {
            color: #fff;
            background: var(--dmg-major);
            border-color: var(--dmg-major);
        }

        /* 節點軌跡：緊湊、不撐滿，避免擠壓戰鬥資訊（#3） */
        .s-nodes {
            display: flex;
            gap: 3px;
            align-items: center;
            flex: 0 1 auto;
            flex-wrap: wrap;
        }

        .s-node {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #1a1a1a;
            border: 1px solid #555;
            color: #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8px;
            font-weight: bold;
            position: relative;
        }

        .s-node.visited {
            background: #8b0000;
            border-color: #ff4444;
            color: white;
            box-shadow: 0 0 4px rgba(255,0,0,0.5);
        }

        .s-node.boss::after {
            content: 'W';
            position: absolute;
            top: -8px;
            color: #ff4444;
            font-size: 10px;
            transform: scaleX(1.5);
        }

        .s-enemies {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .s-enemy-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 26px;
            gap: 2px;
        }

        .s-enemy-icon {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #333;
            border: 1px solid #777;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
            color: white;
            background-size: cover;
            background-position: center;
        }

        .s-enemy-hp {
            width: 100%;
            height: 3px;
            background: #222;
        }
        .s-enemy-hp i {
            display: block;
            height: 100%;
            background: #58a55c;
        }

        /* 出擊戰鬥資訊：左側敵艦晶片（隨伴／主隊）、右側索敵與戰爆固定並排在同一個
           165px 高的 row（=6 艘晶片的高度），不論敵艦是 1 艘還是連合艦隊 12 艘，
           索敵/戰爆/下面的陣形支援列都不會跟著移動。s-eside 用 space-between，
           上緣＝索敵區接晶片頂、下緣＝戰爆區接晶片底（不是跟「主隊/隨伴」文字對齊）。
           **不准改成隨內容收縮**——陣型／支援／友軍列必須釘死（CLAUDE.md 出擊面板）。 */
        .s-battle-row {
            display: grid;
            grid-template-columns: 1.35fr 1fr;
            grid-template-rows: auto 165px;
            column-gap: 8px;
        }

        .s-efleet-heads {
            grid-column: 1;
            grid-row: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0 6px;
        }

        /* 敵方只有單一艦隊（無隨伴）時橫向填滿，不留一半空白 */
        .s-efleet-heads.single {
            grid-template-columns: 1fr;
        }

        .s-efleet-body {
            grid-column: 1;
            grid-row: 2;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px 6px;
            align-content: start;
            /* 敵艦數少時晶片靠頂，不撐開、不置中 */
            overflow: hidden;
        }

        .s-efleet-body.single {
            grid-template-columns: 1fr;
        }

        .s-ecol-h {
            font-size: 10px;
            letter-spacing: var(--track-label);
            color: var(--brass);
            border-bottom: 1px solid var(--line);
            padding-bottom: 2px;
            margin-bottom: 2px;
        }

        .s-ecol-body {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }

        .s-echip {
            background: var(--panel);
            border: .5px solid var(--line);
            border-radius: 4px;
            padding: 2px 5px;
            min-width: 0;
        }

        .s-echip.sunk {
            opacity: .5;
        }

        .s-echip-name {
            display: block;
            font-size: 10.5px;
            line-height: 1.35;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .s-echip.sunk .s-echip-name {
            text-decoration: line-through;
            color: var(--dim);
        }

        .s-echip-hp {
            display: block;
            height: 3px;
            background: var(--line);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 2px;
        }

        .s-echip-hp>i {
            display: block;
            height: 100%;
        }

        /* 右側：索敵/航向/觸接/航空戰（置中、橘色 --stat-mini）＋我方/敵方戰爆
           （置中，戰綠/爆紅配色與「我方/敵方」金色標題維持不變）。 */
        .s-eside {
            grid-column: 2;
            grid-row: 2;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-width: 0;
        }

        .s-stats-mini {
            display: flex;
            flex-direction: column;
            gap: 3px;
            font-size: 11px;
        }

        .s-stats-mini .s-stat-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .s-stats-mini .lbl {
            color: var(--dim);
        }

        .s-stats-mini .val {
            color: var(--stat-mini);
        }

        .s-stats-mini .val.bad {
            color: var(--dmg-major);
        }

        /* 敵我方機數的定位容器：大破警告靠它做 absolute 定位（見 .s-taiha）。
           容器本身不設任何尺寸，高度完全由 .s-air-mini 撐出——警告展開時要「剛好蓋住
           機數表格」，靠的就是這個等高關係。 */
        .s-air-wrap {
            position: relative;
        }

        /* 警告展開時把機數藏起來（保留佔位，容器高度不變＝上方的索敵/航向列不會位移）。
           光靠警告框的不透明底也遮得住，但 visibility 讓「被遮住」變成確定的事，
           不受日後底色調整影響。 */
        .s-air-wrap.covered .s-air-mini {
            visibility: hidden;
        }

        .s-air-mini {
            display: grid;
            grid-template-columns: auto 1fr 1fr;
            gap: 2px 10px;
            font-size: 10.5px;
            align-items: center;
        }

        .s-air-mini .hd {
            color: var(--sparkle);
            font-weight: 700;
            text-align: center;
            font-size: 11px;
        }

        .s-air-mini .rowlbl {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .s-air-mini>span:not(.rowlbl) {
            text-align: center;
        }

        .s-air-icon {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #333;
            display: inline-block;
            text-align: center;
            line-height: 14px;
            font-size: 9px;
        }

        .s-air-lost {
            color: #ff6b6b;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            margin-left: 2px;
        }

        /* 艦種縮寫（編成艦名前綴，#6）；聯合檢視的 .c-top 共用同一份徽章底色/邊框，
           固定寬度覆寫見 .ship.c .stype。 */
        .ship-row .stype,
        .c-top .stype {
            display: inline-block;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: var(--track-tag);
            color: var(--brass);
            background: color-mix(in srgb, var(--brass) 14%, transparent);
            border: 1px solid color-mix(in srgb, var(--brass) 40%, transparent);
            border-radius: 3px;
            /* 右內距扣掉一個字距：letter-spacing 在最後一字後也會留白，
               窄徽章內不補償會讓文字看起來偏左 */
            padding: 0 calc(3px - var(--track-tag)) 0 3px;
            margin-right: 5px;
            vertical-align: baseline;
            font-variant-numeric: tabular-nums;
        }

        /* 固定寬度＋置中：縮寫本身長度不一（DD 2字 vs CVL 3字），寬度隨文字伸縮的話
           每艘艦的艦名起始 x 位置都不同，整個艦隊列表看起來參差不齊。32px 是用無頭
           Chrome 實測全部 19 種縮寫（STYPE_ABBR）自然寬度後訂出來的下限（最寬的
           CAV/CVL/BBV/SSV/LHA/CVB 落在 28-30.4px），跟聯合檢視 .ship.c .stype 共用
           同一個數字，兩種檢視視覺一致。 */
        .ship-row .stype {
            width: 32px;
            text-align: center;
        }

        /* 遠征艦隊編號：比照編成選擇按鈕（僅數字） */
        .timer-row .fleet-box {
            font-size: 12px;
            color: var(--text);
            border: 1px solid var(--brass);
            border-radius: 5px;
            padding: 1px 9px;
            background: color-mix(in srgb, var(--brass) 14%, transparent);
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }

        /* 陣形/支援/対空CI/夜戰/rank/友軍 一列＋Drop（掉落艦名，#5）：放大圖示、
           位置固定在敵艦晶片區下方，不隨敵艦數量位移。 */
        .s-icons-full {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .s-icon-cluster {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .s-icon {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #222;
            border: 1px solid #555;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9.5px;
            line-height: 1.05;
            color: #aaa;
            text-align: center;
        }

        /* 基地航空隊戰果圈（#4）：上排對敵傷害、下排損失機數，兩行塞進同一顆 30px 圈
           （line-height 1.05 × 兩行 ≈ 20px，放得下）。逐波明細在 title。 */
        .s-icon.lbas {
            flex-direction: column;
            font-variant-numeric: tabular-nums;
        }

        .s-icon.lbas .s-lbas-dmg {
            font-weight: 700;
        }

        .s-icon.active { color: #82ccdd; border-color: #82ccdd; }
        .s-icon.predicted { border-style: dashed; }
        .s-icon.rank-ss { color: #ffe066; border-color: #ffe066; font-size: 14px; font-weight: bold; text-shadow: 0 0 4px rgba(255,224,102,0.6); }
        .s-icon.rank-s { color: #f1c40f; border-color: #f1c40f; font-size: 15px; font-weight: bold; }
        .s-icon.rank-a { color: #e74c3c; border-color: #e74c3c; font-size: 15px; font-weight: bold; }
        .s-icon.rank-b { color: #d35400; border-color: #d35400; font-size: 15px; font-weight: bold; }
        .s-icon.rank-c { color: #95a5a6; border-color: #7f8c8d; font-size: 15px; font-weight: bold; }
        .s-icon.rank-d { color: #7f8c8d; border-color: #566060; font-size: 15px; font-weight: bold; }

        /* 打撈晶片：**金色只留給「本鎮守府還沒有的船」**。每一場都上色的話，看到金色
           的第一反應會是「又是同一批」，真正的新船就淹沒在裡面了；已持有的改用一般
           文字色與中性框，資訊照給、不搶注意力。 */
        .s-drop {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: color-mix(in srgb, var(--line) 30%, var(--panel));
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 2px 8px 2px 4px;
        }

        .s-drop.new {
            background: color-mix(in srgb, var(--sparkle) 12%, var(--panel));
            border-color: var(--sparkle);
        }

        .s-drop-tag {
            font-size: 8px;
            font-weight: 700;
            letter-spacing: var(--track-tag);
            color: #10151d;
            background: var(--dim);
            border-radius: 8px;
            /* 右內距扣掉一個字距，理由同 .ship-row .stype */
            padding: 1px calc(5px - var(--track-tag)) 1px 5px;
        }

        .s-drop.new .s-drop-tag {
            background: var(--sparkle);
        }

        .s-drop-name {
            font-size: 11px;
            font-weight: 600;
            color: var(--text);
            white-space: nowrap;
        }

        .s-drop.new .s-drop-name {
            color: var(--sparkle);
        }

        /* ── 出擊紀錄（紀錄分頁）── */
        .h-group {
            margin-bottom: 10px;
        }

        .h-head {
            display: flex;
            gap: 8px;
            align-items: baseline;
            font-size: 12px;
            border-bottom: 1px solid var(--line);
            padding-bottom: 2px;
            margin-bottom: 3px;
        }

        .h-head b {
            color: var(--sparkle);
        }

        .h-head .dim {
            font-size: 10px;
        }

        .h-row {
            display: flex;
            gap: 8px;
            align-items: center;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
        }

        .h-row:nth-child(even) {
            background: var(--panel);
        }

        .h-row.raid .grow {
            color: var(--dmg-mid);
        }

        .h-node {
            width: 24px;
            text-align: center;
            font-weight: 700;
            color: var(--dim);
            font-size: 10px;
            flex: none;
        }

        .h-node.boss {
            color: #ff4444;
        }

        .h-node.boss::after {
            content: '★';
            font-size: 8px;
        }

        .h-rank {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            flex: none;
        }

        .h-rank.rank-s { color: #f1c40f; border-color: #f1c40f; }
        .h-rank.rank-a { color: #e74c3c; border-color: #e74c3c; }
        .h-rank.rank-b { color: #d35400; border-color: #d35400; }
        .h-rank.rank-c { color: #95a5a6; border-color: #7f8c8d; }
        .h-rank.rank-d, .h-rank.rank-e { color: #7f8c8d; border-color: #566060; }

        .h-seiku {
            font-size: 10px;
            white-space: nowrap;
        }

        .h-seiku.sk-1 { color: #58a55c; }   /* 確保 */
        .h-seiku.sk-2 { color: #82ccdd; }   /* 優勢 */
        .h-seiku.sk-0 { color: var(--dim); } /* 互角 */
        .h-seiku.sk-3, .h-seiku.sk-4 { color: var(--dmg-major); }  /* 劣勢/喪失 */

        .h-taiha {
            font-size: 10px;
            color: #fff;
            background: var(--dmg-major);
            border-radius: 6px;
            padding: 0 5px;
            white-space: nowrap;
        }

        .h-drop {
            font-size: 10px;
            color: var(--sparkle);
            white-space: nowrap;
        }

        /* ── 待驗證封包（自動擷取）── */
        .wanted-row {
            display: flex;
            gap: 8px;
            align-items: center;
            padding: 4px 6px;
            border-radius: 4px;
            font-size: 11px;
        }

        .wanted-row:nth-child(odd) {
            background: var(--panel);
        }

        .wanted-tag {
            font-size: 10px;
            font-weight: 600;
            color: var(--sparkle);
            border: 1px solid var(--sparkle);
            border-radius: 8px;
            padding: 0 7px;
            white-space: nowrap;
        }

        .wanted-path {
            color: var(--dim);
            font: 10px/1.4 ui-monospace, monospace;
        }

        .wanted-row button {
            background: none;
            border: 1px solid var(--line);
            color: var(--text);
            border-radius: 4px;
            padding: 2px 8px;
            font-size: 10px;
            cursor: pointer;
        }

        .wanted-row button:hover {
            border-color: var(--brass);
        }

        .wanted-row button.copied {
            color: #58a55c;
            border-color: #58a55c;
        }

        .wanted-row button.failed {
            color: var(--dmg-major);
            border-color: var(--dmg-major);
        }

        /* 刪除鈕：語彙上比「複製」次要，平時只有邊框、hover 才轉警示色 */
        .wanted-row button.wanted-del {
            color: var(--dim);
        }

        .wanted-row button.wanted-del:hover {
            color: var(--dmg-major);
            border-color: var(--dmg-major);
        }

        /* 上限說明與清除入口：擷取有上限（見 main.ts captureWanted），
           使用者必須看得到目前用量與「刪掉就能再擷取」這件事 */
        .wanted-foot {
            display: flex;
            gap: 8px;
            align-items: center;
            padding: 4px 6px;
            font-size: 10px;
            color: var(--dim);
            letter-spacing: var(--track-label);
        }

        .wanted-foot.warn {
            color: var(--brass);
        }

        .wanted-foot button {
            background: none;
            border: 1px solid var(--line);
            color: var(--dim);
            border-radius: 4px;
            padding: 2px 8px;
            font-size: 10px;
            cursor: pointer;
        }

        .wanted-foot button:hover {
            color: var(--dmg-major);
            border-color: var(--dmg-major);
        }

        /* ── 工廠分頁 ── */
        .fac-controls {
            display: flex;
            align-items: center;
            margin-bottom: 6px;
        }

        /* akashi-list 外部連結：唯一的出站連結，做成按鈕樣（與 wanted-row button 同語彙） */
        .akashi-link {
            font-size: 11px;
            color: #82ccdd;
            text-decoration: none;
            border: 1px solid var(--line);
            border-radius: 4px;
            padding: 2px 8px;
            white-space: nowrap;
        }

        .akashi-link:hover {
            border-color: #82ccdd;
        }

        /* 最新開發/改修結果看板：卡片式，與出擊分頁的資訊區塊同視覺層級 */
        .fac-card {
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 6px 8px;
            margin-bottom: 8px;
            background: var(--panel);
        }

        .fac-card h4 {
            margin: 0 0 4px;
            font-size: 11px;
            color: var(--dim);
            font-weight: 600;
            display: flex;
            gap: 8px;
            align-items: baseline;
        }

        .fac-result-row {
            display: flex;
            gap: 8px;
            align-items: center;
            font-size: 12px;
            padding: 2px 0;
        }

        /* 紀錄列：沿用 .h-row 節奏（斑馬紋、圓角、11px） */
        .f-row {
            display: flex;
            gap: 8px;
            align-items: center;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
        }

        .f-row:nth-child(even) {
            background: var(--panel);
        }

        /* 種別徽章：開發／建造／改修（與 .h-rank 同語彙的描邊字） */
        .f-kind {
            width: 26px;
            text-align: center;
            flex: none;
            font-size: 10px;
            font-weight: 700;
            border: 1px solid var(--line);
            border-radius: 4px;
        }

        .f-kind.develop { color: #82ccdd; border-color: #82ccdd; }
        .f-kind.build { color: var(--dmg-mid); border-color: var(--dmg-mid); }
        .f-kind.improve { color: #c39bd3; border-color: #c39bd3; }
        .f-kind.speedup { color: var(--sparkle); border-color: var(--sparkle); }

        /* 投入資材（配方）：圖示＋數字成組，數字用等寬變體便於掃讀 */
        .f-res {
            display: inline-flex;
            gap: 5px;
            align-items: center;
            white-space: nowrap;
            font-size: 10px;
            color: var(--dim);
            font-variant-numeric: tabular-nums;
        }

        .f-res b {
            color: var(--text);
            font-weight: 600;
        }

        .f-ok { color: #58a55c; }
        .f-ng { color: var(--dmg-major); }
        .f-fail { color: var(--stub); }

        /* 改修等級變化：★n → ★n+1 */
        .f-lv {
            color: var(--sparkle);
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }

        .taiha-alert {
            background: rgba(224, 85, 85, 0.1);
            border: 1px solid var(--dmg-major);
            color: #ff6b6b;
            padding: 4px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            text-align: center;
            animation: pulse 2s infinite;
        }

        /* 大破警告的定位與兩態切換（釘在右下航空戰欄，見 main.ts renderSortie）。
           **兩態都是 absolute**：警告一出現就把 165px 敵艦列與底下釘死的陣型／rank／
           友軍列往下推是舊版的毛病（CLAUDE.md 出擊資訊欄硬約束），絕對定位讓它完全
           不參與版面計算，有沒有大破的版面一模一樣。

           · 收縮態＝浮在 .s-air-wrap 正上方，也就是「航空戰 ↔ 敵我方」之間那條縫
             （.s-eside 是 space-between，那裡本來就有約 50px 空白，一條 banner 進得去）。
           · 展開態＝貼齊容器底並 min-height:100%，剛好蓋住整張機數表；文字多時往上長，
             用掉的是同一塊空白，不會壓到索敵/航向列。**不設 max-height／overflow:hidden**
             ——寧可長一點也不能把警告文字截掉。 */
        .s-taiha {
            position: absolute;
            left: 0;
            right: 0;
            bottom: calc(100% + 3px);
            display: block;
            width: 100%;
            margin: 0;
            font-family: inherit;
            line-height: 1.3;
            cursor: pointer;
        }

        .s-taiha.open {
            top: auto;
            bottom: 0;
            min-height: 100%;
            /* 展開態要真的遮住底下的機數，故底色不透明（同 prefers-reduced-transparency
               的處理手法：把同色相混進 --panel 而不是疊在透明上）。 */
            background: color-mix(in srgb, var(--dmg-major) 18%, var(--panel));
        }

        /* 收縮態只留一行：字級降一階、不換行、超出以 … 收尾（完整內容在 title）。
           nowrap 順便把字典裡的 \n 當成一般空白吃掉，多行文案自然壓成單行。 */
        .s-taiha:not(.open) {
            font-size: 10.5px;
            padding: 2px 4px;
            white-space: nowrap;
            overflow: hidden;
        }

        /* 省略號要掛在**實際溢出的那個 block** 上：文字包在 .taiha-head 裡，
           只設在外層按鈕會變成硬切（實測「強制返舠」被切一半、沒有 …）。 */
        .s-taiha:not(.open) .taiha-head {
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 收縮態只顯示第一行（主警告）；退避提示等補充留給展開態與 title。 */
        .s-taiha:not(.open) .taiha-head~*,
        .s-taiha:not(.open) .taiha-hint {
            display: none;
        }

        .taiha-head {
            display: block;
        }

        /* 展開態讓字典裡的 \n 成為實際斷行。警告框只有約 180px 寬，中日文沒有空格可斷，
           全交給自動折行會把「大破艦」「強制返航」這種詞從中間切開，斷點必須由各語言
           自己決定（見 ui-i18n.ts；英文靠空格自然折行，不需要硬斷點）。
           **只掛在 .open 上**：收縮態的 banner 要維持單行，那邊由按鈕的 nowrap 把 \n
           當一般空白吃掉。 */
        .s-taiha.open .taiha-head,
        .s-taiha.open .taiha-hint {
            white-space: pre-line;
        }

        /* 退避提示（旗艦帶司令部施設時）：附在大破警告內的第二行，弱化成說明語氣——
           警告本身講「有轟沈風險」，這行講「還有一條路可走」，不該搶同樣的視覺強度。 */
        .taiha-hint {
            display: block;
            font-weight: normal;
            font-size: 11px;
            color: var(--dim);
        }

        /* 退避艦：整列淡出＋灰標。退避不是傷害等級，故刻意不用 --dmg-* 語意色
           （design-guidelines §4.5：語意色不跨功能挪用）。 */
        .ship.escaped {
            opacity: 0.5;
        }

        .esc-tag {
            margin-left: 4px;
            padding: 0 4px;
            border: 1px solid var(--line);
            border-radius: 6px;
            font-size: 9px;
            color: var(--dim);
            vertical-align: middle;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(224, 85, 85, 0.4); }
            70% { box-shadow: 0 0 0 6px rgba(224, 85, 85, 0); }
            100% { box-shadow: 0 0 0 0 rgba(224, 85, 85, 0); }
        }

        /* ── 無障礙偏好 ──
           減少動態不等於取消回饋，而是換成不會引發前庭不適的等效表現：
           大破警告是本面板最重要的即時訊號，脈動改為靜態強調光暈，警示強度不變。 */
        @media (prefers-reduced-motion: reduce) {
            .taiha-alert {
                animation: none;
                box-shadow: 0 0 0 3px rgba(224, 85, 85, 0.35);
            }

            #tabs button,
            .ab-tabs button {
                transition: none;
            }

            .ab-tabs button:active {
                transform: none;
            }
        }

        /* 降低透明：本面板的半透明底色（color-mix 疊到 transparent、警告框的 rgba）
           改為不透明——同色相直接混進 --panel，色調維持一致但不再透出底下內容。 */
        @media (prefers-reduced-transparency: reduce) {

            .ship-row .stype,
            .c-top .stype {
                background: color-mix(in srgb, var(--brass) 14%, var(--panel));
                border-color: color-mix(in srgb, var(--brass) 40%, var(--panel));
            }

            .timer-row .fleet-box,
            .ab-tabs button.on {
                background: color-mix(in srgb, var(--brass) 14%, var(--panel));
            }

            .s-drop {
                background: color-mix(in srgb, var(--line) 30%, var(--panel));
            }

            .s-drop.new {
                background: color-mix(in srgb, var(--sparkle) 12%, var(--panel));
            }

            /* `.s-taiha.open` 自己就用不透明底（要遮住機數），但選擇器比 .taiha-alert
               specific，這裡若不一併列出，收縮／展開兩態會有一態吃不到覆寫。 */
            .taiha-alert,
            .s-taiha.open {
                background: color-mix(in srgb, var(--dmg-major) 18%, var(--panel));
            }
        }

        /* 高對比：邊界改為明確可見、弱化文字提高亮度；深淺主題各自調整。
           大破警告改為實心底＋深色字，不再只靠淡紅底表示。 */
        @media (prefers-contrast: more) {
            :root {
                --line: #6b7a95;
                --dim: #a9b4c6;
                --stub: #7f8a9e;
            }

            :root[data-theme="light"] {
                --line: #8a8375;
                --dim: #4a5160;
                --stub: #7a8291;
            }

            /* 實心紅底：`.s-taiha.open` 的自帶底色選擇器較 specific，必須一併列出。 */
            .taiha-alert,
            .s-taiha.open {
                background: var(--dmg-major);
                color: #10151d;
            }

            /* 補充行原本走 --dim（淺灰），落在實心紅底上對比不足；改為繼承主色再降透明度，
               維持「弱化成說明語氣」的層次但不犧牲可讀性。 */
            .taiha-alert .taiha-hint {
                color: inherit;
                opacity: 0.85;
            }

            #tabs button.on {
                color: var(--text);
                border-bottom-width: 3px;
            }

            /* 疲勞表情：11px 下線條細，高對比模式加粗描邊。SVG 尺寸不變，零版面影響。 */
            .ab-sq .cond-face * {
                stroke-width: 1.8;
            }

            /* 高對比模式：輪廓加粗、標籤回到純白。仍用 inset box-shadow，維持零版面影響
               ——這裡改 border-width 會讓量表在高對比下比一般模式高，狀態一切換就位移。 */
            .s-gauge.zansatsu .s-gauge-bar {
                box-shadow: inset 0 0 0 2px var(--sparkle);
            }

            .s-gauge.zansatsu .s-gauge-final {
                color: #fff;
            }
        }

    </style>
</head>

<body>
    <div id="header"></div>
    <!-- 狀態橫幅：載入中／事件積壓／啟動失敗共用一條，永遠在最上方。空白面板配一句
         console 訊息是查不出原因的，任何「面板看起來壞了」的狀態都必須在畫面上說明。 -->
    <div id="notice" hidden></div>
    <div id="tabs"></div>
    <div id="tabpanel">
        <div id="tab-general">
            <div class="g-top">
                <div class="resblock" id="resline"></div>
                <div id="missions"></div>
            </div>
            <div class="g-docks">
                <div id="ndocks"></div>
                <div id="kdocks"></div>
            </div>
            <h3 data-i18n="section.quest">任務</h3>
            <div id="quests"></div>
        </div>
        <div id="tab-exped" style="display:none">
            <div class="exped-controls">
                <span id="exped-fleet-label" class="badge"></span>
                <select id="exped-select"></select>
            </div>
            <div id="exped-check"></div>
        </div>
        <div id="tab-factory" style="display:none">
            <div class="fac-controls">
                <span class="grow"></span>
                <a class="akashi-link" href="https://akashi-list.me/" target="_blank" rel="noopener"
                    data-i18n="factory.akashiLink">明石の改修工廠 早見表 ↗</a>
            </div>
            <div id="factory-live"></div>
        </div>
        <div id="tab-activity" style="display:none">
            <h3 data-i18n="section.wanted">待驗證封包（自動擷取）</h3>
            <div id="wanted"></div>
            <h3 data-i18n="section.log">事件記錄</h3>
            <div id="log"></div>
        </div>
        <div id="tab-sortie" style="display:none">
            <div id="battle-content">
                <div style="color:var(--dim); padding:10px;" data-i18n="sortie.notEntered">尚未進入戰鬥。</div>
            </div>
        </div>
    </div>
    <div id="fleetnav"></div>
    <div id="fleets"></div>
    <div id="air-bases" style="display:none"></div>
    <script type="module" src="./main.ts"></script>
</body>

</html>
