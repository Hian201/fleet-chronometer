<!doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <title>航海鐘</title>
    <style>
        :root {
            --bg: #10151d;
            --panel: #182030;
            --line: #2a3548;
            --text: #cfd6e4;
            --dim: #7d8aa0;
            --brass: #b8860b;
            --stub: #4a5468;
            --dmg-major: #e05555;
            --dmg-mid: #e08b3d;
            --dmg-minor: #d4b83a;

            /* 任務種類（語意色，不隨主題變化；對齊遊戲任務清單的分類色，禁止挪用做其他用途）。 */
            --qc-composition: #2a8144;
            --qc-sortie: #c0413e;
            --qc-practice: #559d3d;
            --qc-expedition: #39a29e;
            --qc-supply-dock: #d8ba63;
            --qc-arsenal: #6b473c;
            --qc-modernization: #a783b9;
            /* 血條刻度要壓在填色與空軌上。暗底用深線，亮底改淺線。 */
            --hp-tick: rgba(16, 21, 29, .92);
            --sparkle: #e6c35c;
            --alv-bar: #9dc3ef;
            /* 索敵/航向/觸接/航空戰數值色。刻意獨立於 --dmg-mid（傷害語意），
               避免兩種無關語意共用同一色而互相稀釋（design-guidelines §4.5）。 */
            --stat-mini: #e0954d;
            /* 基地航空隊「輕度疲勞」（中隊 cond 20–29）：分區內的黃臉與編成列的基地航空隊鈕
               共用這一個變數，兩處不得各自寫死色碼。重度疲勞沿用 --dmg-major。
               目前值與 --dmg-mid 相同，但**刻意保留成獨立變數**——疲勞與艦娘中破是兩種語意，
               只是現階段選了同一個橘；日後要調其中一邊時不該連動另一邊。
               對比：暗底 7.1:1；亮底 2.3:1（偏低，與面板既有的 --dmg-mid 用法同級）。 */
            --lbas-tired: #e08b3d;
            /* 關卡量表 pill 的軌道色。獨立變數而非沿用 --line：條子裡是白字的剩餘實數，
               軌道必須在兩個主題下都夠深才讀得到（亮色主題只調深、不轉淺，見 .s-gauge-bar）。 */
            --gauge-track: #2a3548;
            /* 調度分頁下拉浮層底色（掛 body，需獨立於 --panel 以免與表格底混成一塊）。 */
            --menu: #1c2738;
            /* 編成摘要的速力階層：不靠粗體，改用既有中性／黃銅色的明度順序。 */
            --speed-slow: var(--dim);
            --speed-fast: var(--text);
            --speed-fast-plus: color-mix(in srgb, var(--brass) 55%, var(--text));
            --speed-fastest: var(--sparkle);

            /* 字距（tracking）級距：與字級成反比——字愈小需要愈多字距才好讀，字愈大
               則要收緊。這組變數統一三種擴充頁面的字距比例，避免小字比大字更窄。 */
            --track-tag: .14em;
            /* 8–9px 標籤 */
            --track-label: .12em;
            /* 10–11px 小標題 */
            --track-body: 0;
            /* 13px 內文 */
            --track-title: -.01em;
            /* 14px 以上標題 */
        }

        /* 亮色主題由「鎮守府情報總括」的主題切換透過 <html data-theme> 全域套用。
           M7 全圖示已帶深墨描邊，亮底可讀性已保證。傷害色維持不變（語意色，亮底仍清楚）。 */
        :root[data-theme="light"] {
            --bg: #eef0f4;
            --panel: #ffffff;
            --line: #d3d8e2;
            --text: #26303f;
            --dim: #6b7688;
            --brass: #9a6b0b;
            --stub: #aab3c2;
            --hp-tick: rgba(255, 255, 255, .92);
            --sparkle: #8a6d1a;
            --alv-bar: #9dc3ef;
            --gauge-track: #4a5568;
            --menu: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        /* 捲軸配色（與 overview 同一套規則，見 design-guidelines §1.4）：軌道 transparent
           讓它跟著所在容器底色走，滑塊用 --line、hover 提到 --dim。 */
        * {
            scrollbar-width: thin;
            scrollbar-color: var(--line) transparent;
        }

        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-track,
        ::-webkit-scrollbar-corner {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            border: 2px solid transparent;
            border-radius: 6px;
            background: var(--line) padding-box;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--dim) padding-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            /* system-ui 置前：依使用者 OS 與語系解析到該平台的系統字（macOS SF／
               日文環境 Hiragino／中文環境思源黑體等），已內建字級光學調整與可讀性微調。
               -apple-system 作為 Safari/WebKit fallback。 */
            font: 13px/1.5 system-ui, -apple-system, "Hiragino Sans", sans-serif;
            letter-spacing: var(--track-body);
        }

        #header {
            /* 統計標籤含有高度高於文字的 .h-icon，使用 center 對齊可避免圖示把單行文字
               的基線拉歪。 */
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 10px;
            border-bottom: 1px solid var(--line);
            font-variant-numeric: tabular-nums;
        }

        /* 提督識別區：名稱＋等級成組，共用一個 title（hover 顯示「全名　Lv等級」）。
           整組可收縮，收縮壓力落在名稱上（等級固定不縮）。 */
        #header .idbox {
            display: inline-flex;
            align-items: baseline;
            gap: 6px;
            min-width: 0;
            flex: 0 1 auto;
        }

        #header .nick {
            color: color-mix(in srgb, var(--sparkle) 72%, #fff);
            font-size: 14px;
            font-weight: 600;
            letter-spacing: var(--track-title);
            /* 提督名稱上限 12 文字：放不下時整排由 fitHeader() 縮小（見檔尾「header 單行自動縮放」）；
               縮到下限仍放不下才以省略號截斷，全名在 title */
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #header .stat {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            flex: none;
        }

        #header .h-icon {
            width: 16px;
            height: 16px;
            flex: none;
            display: block;
        }

        #header .stat b {
            color: var(--text);
            font-weight: 600;
        }

        .g-chip .g-eta.grow {
            color: var(--dim);
        }

        #header .stat.warn b {
            color: var(--dmg-mid);
        }

        #header select {
            background: var(--panel);
            color: var(--text);
            border: 1px solid var(--line);
            border-radius: 4px;
            font-size: 11px;
            flex: none;
        }

        #header .num {
            flex: none;
        }

        /* 狀態橫幅（載入中／事件積壓／啟動失敗）。預設是低調的說明語氣；.err 才轉為
           警示色——「面板停在這裡不動了」必須看得出來，但一般的載入提示不該搶戲。 */
        #notice {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            border-bottom: 1px solid var(--line);
            background: var(--panel);
            color: var(--dim);
            font-size: 11px;
            letter-spacing: var(--track-label);
        }

        #notice[hidden] {
            display: none;
        }

        #notice.err {
            color: var(--dmg-major);
        }

        #notice .grow {
            flex: 1;
            /* 錯誤訊息可能很長（Dexie 的例外訊息），允許換行，不截斷原因 */
            min-width: 0;
        }

        #notice button {
            flex: none;
            background: var(--panel);
            color: var(--text);
            border: 1px solid var(--line);
            border-radius: 4px;
            padding: 2px 8px;
            font-size: 11px;
            cursor: pointer;
        }

        #notice button:hover {
            border-color: var(--brass);
            color: var(--sparkle);
        }

        #tabs {
            display: flex;
            padding: 0 10px;
            border-bottom: 1px solid var(--line);
        }

        #tabs button {
            background: none;
            border: none;
            color: var(--dim);
            padding: 6px 12px;
            font-size: 12px;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            /* 回饋在「按下」當下就發生（見下方 :active），放開才有反應會顯得遲鈍；
               100ms 純視覺回饋，不阻擋輸入。 */
            transition: color 100ms ease-out, border-bottom-color 100ms ease-out;
        }

        /* 按下即回饋：不等 click 事件與分頁重繪（autoSwitch 亦會改變 .on） */
        #tabs button:not(.stub):active {
            color: var(--text);
            border-bottom-color: var(--line);
        }

        #tabs button.on {
            color: var(--text);
            border-bottom-color: var(--brass);
        }

        #tabs button.stub {
            color: var(--stub);
            cursor: default;
        }

        /* height（非 max-height）：固定 270px 讓艦隊編成不隨分頁內容上下跑，並在釘死
           165px 戰鬥列與陣型列的前提下保留七船與大破警告所需的空間。 */
        #tabpanel {
            padding: 6px 8px;
            height: 270px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--line) var(--panel);
        }

        /* 調度分頁：整塊由內部表捲動，#tabpanel 本身不捲——否則固定 270px 內
           頂列＋選取列會跟著表一起滾掉。其他分頁維持 overflow-y:auto。 */
        #tabpanel.has-order {
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 一般分頁維持固定高度；各子頁自行處理內容捲動。 */
        #tabpanel.has-general {
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        #tabpanel.has-general > #tab-general {
            display: flex;
            flex: 1;
            min-height: 0;
            flex-direction: column;
            gap: 6px;
        }
        #tabpanel.has-order > #tab-order {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        /* 遠征檢核分頁：固定艦隊/選單抬頭與收益 HUD，檢核清單在內部自適應；避免 #tabpanel 產生外層捲軸。 */
        #tabpanel.has-exped {
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        #tabpanel.has-exped > #tab-exped {
            display: flex;
            flex: 1;
            min-height: 0;
            flex-direction: column;
            overflow: hidden;
        }
        #tab-exped > #exped-check {
            display: flex;
            flex: 1;
            min-height: 0;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── 調度／采配／Order（配船配裝快篩）─────────────────────────── */
        .od-top {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: none;
            min-width: 0;
        }
        .od-mode {
            position: relative;
            flex: none;
            width: 70px;
            height: 22px;
            padding: 0;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: var(--panel);
            cursor: pointer;
            box-shadow: inset 0 1px 1px color-mix(in srgb, #fff 4%, transparent);
            transition: border-color 120ms ease, background 120ms ease;
        }
        .od-mode:hover { border-color: var(--brass); }
        .od-mode:focus-visible {
            outline: 2px solid var(--sparkle);
            outline-offset: 2px;
        }
        .od-mode:active { filter: brightness(1.08); }
        .od-mode[data-mode="gear"] { border-color: var(--brass); }
        .od-mode-thumb {
            position: absolute;
            top: 2px;
            left: 2px;
            display: grid;
            width: 42px;
            height: 16px;
            place-items: center;
            border-radius: 999px;
            background: var(--sparkle);
            color: var(--bg);
            font-size: 11px;
            font-weight: 700;
            line-height: 1;
            white-space: nowrap;
            transform: translateX(0);
            transition: transform 180ms cubic-bezier(.2,.8,.2,1), background 120ms ease;
        }
        .od-mode[data-mode="gear"] .od-mode-thumb {
            transform: translateX(24px);
        }
        .od-goals {
            flex: 1;
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 4px;
            overflow-x: auto;
            overflow-y: hidden;
            padding-bottom: 1px;
        }
        .od-pill, .od-dd-btn {
            flex: none;
            background: var(--panel);
            border: 1px solid var(--line);
            color: var(--dim);
            border-radius: 999px;
            padding: 2px 9px;
            font-size: 11px;
            cursor: pointer;
            white-space: nowrap;
            user-select: none;
        }
        .od-dd-btn::after { content: " ▾"; color: var(--stub); font-size: 9px; }
        .od-pill.on, .od-dd-btn.on {
            color: var(--sparkle);
            border-color: var(--brass);
            background: color-mix(in srgb, var(--brass) 14%, transparent);
        }
        .od-sel {
            display: flex;
            flex: none;
            align-items: center;
            gap: 6px;
            min-height: 22px;
            font-size: 11px;
            color: var(--dim);
        }
        .od-sel[hidden] { display: none !important; }
        .od-sel .n { color: var(--sparkle); font-variant-numeric: tabular-nums; font-weight: 700; }
        .od-sel button {
            border: 1px solid var(--line);
            background: var(--panel);
            color: var(--text);
            border-radius: 999px;
            padding: 1px 8px;
            font-size: 11px;
            cursor: pointer;
        }
        .od-sel button.primary {
            border-color: var(--brass);
            color: var(--sparkle);
            background: color-mix(in srgb, var(--brass) 14%, transparent);
        }
        .od-sel .grow { flex: 1; }
        .od-menu {
            position: fixed;
            z-index: 10000;
            min-width: 140px;
            max-width: 220px;
            max-height: min(240px, 50vh);
            overflow-y: auto;
            background: var(--menu);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 4px;
            box-shadow: 0 10px 28px color-mix(in srgb, #000 40%, transparent);
        }
        .od-menu[hidden] { display: none !important; }
        .od-menu .subhead {
            padding: 4px 8px 2px; font-size: 10px; color: var(--dim);
            letter-spacing: var(--track-tag);
        }
        .od-menu .sep {
            height: 1px; margin: 4px 6px;
            background: var(--line);
        }
        .od-menu button {
            display: flex; width: 100%; text-align: left;
            align-items: center; gap: 6px;
            border: none; background: none; color: var(--text);
            padding: 5px 8px; border-radius: 5px; font-size: 11px; cursor: pointer;
        }
        .od-menu button:hover {
            background: color-mix(in srgb, var(--brass) 12%, transparent);
        }
        .od-menu button.on { color: var(--sparkle); }
        .od-menu button .meta { margin-left: auto; color: var(--dim); font-variant-numeric: tabular-nums; }
        .od-menu .row {
            display: flex; align-items: center; gap: 2px;
        }
        .od-menu .row > button.pick { flex: 1; }
        .od-menu .row > button.x {
            flex: none; width: 28px; justify-content: center;
            color: var(--dim); padding: 5px 0;
        }
        .od-table-wrap {
            flex: 1;
            min-height: 0;
            overflow: auto;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: var(--panel);
        }
        table.od {
            border-collapse: separate;
            border-spacing: 0;
            width: max-content;
            min-width: 100%;
            font-size: 11px;
            font-variant-numeric: tabular-nums;
        }
        table.od th, table.od td {
            padding: 3px 6px;
            border-bottom: 1px solid color-mix(in srgb, var(--line) 70%, transparent);
            white-space: nowrap;
            vertical-align: middle;
        }
        table.od th {
            position: sticky; top: 0; z-index: 2;
            background: var(--panel);
            color: var(--dim);
            font-weight: 600;
            font-size: 10px;
            letter-spacing: var(--track-tag);
            text-align: center;
            border-bottom: 1px solid var(--line);
            cursor: pointer;
            user-select: none;
        }
        table.od th:hover { color: var(--text); }
        table.od th.on { color: var(--sparkle); }
        /* 標籤與資料共用欄位中心；箭頭使用獨立欄位，避免窄欄時壓住文字。 */
        table.od th .od-head {
            display: grid;
            width: 100%;
            grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
            align-items: center;
        }
        table.od th .od-label {
            display: inline-block;
            grid-column: 2;
            min-width: 0;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            vertical-align: middle;
        }
        table.od th .od-arrow {
            grid-column: 3;
            justify-self: start;
            display: block;
            margin-inline-start: 2px;
            font-size: 9px;
            color: var(--stub);
            line-height: 1;
            pointer-events: none;
        }
        table.od th .od-arrow:empty { display: none; }
        table.od th.on .od-arrow { color: var(--sparkle); }
        table.od th.n .od-head { display: flex; justify-content: flex-start; }
        table.od th.n .od-arrow { margin-inline-start: 2px; }
        table.od th.n, table.od td.n { text-align: left; }
        table.od td { text-align: center; color: var(--text); }
        table.od th.n,
        table.od td.n {
            position: sticky;
            left: 0;
            background: var(--panel);
            max-width: 7.5em;
            overflow: hidden;
            text-overflow: ellipsis;
            box-shadow: 1px 0 0 var(--line);
        }
        table.od th.n {
            top: 0;
            z-index: 4;
        }
        table.od td.n {
            z-index: 3;
            font-weight: 600;
            cursor: pointer;
        }
        table.od tr:hover td { background: color-mix(in srgb, var(--brass) 8%, transparent); }
        table.od tr:hover td.n { background: color-mix(in srgb, var(--brass) 10%, var(--panel)); }
        table.od tr.in-fleet td.n { color: var(--sparkle); }
        table.od tr.picked td { background: color-mix(in srgb, var(--brass) 12%, transparent); }
        table.od tr.picked td.n {
            background: color-mix(in srgb, var(--brass) 14%, var(--panel));
            color: var(--sparkle);
            box-shadow: inset 2px 0 0 var(--brass);
        }
        .od-table-wrap .cond-spark { color: var(--sparkle); font-weight: 700; }
        .od-table-wrap .cond-tired { color: var(--dmg-mid); }
        .od-table-wrap .cond-red { color: var(--dmg-major); }
        .od-table-wrap .zero { color: var(--stub); }
        .od-empty {
            padding: 18px 10px; text-align: center; color: var(--dim); font-size: 12px;
        }
        /* 裝備名稱即展開鈕：外觀同一般名稱格，可用 Tab／Enter／Space 操作。 */
        table.od td.n .od-gear {
            display: block;
            width: 100%;
            padding: 0;
            border: 0;
            background: none;
            color: inherit;
            font: inherit;
            text-align: left;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
        }
        table.od td.n .od-gear:focus-visible { outline: 1px solid var(--brass); outline-offset: -1px; }
        /* 裝備艦：素質表的展開子列與裝備艦檢視共用同一種標籤。 */
        table.od td.n .od-tw {
            display: inline-block;
            width: 10px;
            color: var(--stub);
            font-size: 8px;
        }
        table.od tr.open td { background: color-mix(in srgb, var(--brass) 10%, transparent); }
        table.od tr.open td.n {
            background: color-mix(in srgb, var(--brass) 14%, var(--panel));
            color: var(--sparkle);
            box-shadow: inset 2px 0 0 var(--brass);
        }
        table.od tr.open td.n .od-tw { color: var(--sparkle); }
        table.od tr.od-hold td,
        table.od tr.od-hold:hover td {
            padding: 0;
            background: color-mix(in srgb, var(--brass) 5%, var(--panel));
        }
        /* 寬度＝表格外框內寬（370 − 2×10 邊距 − 2×1 邊框 − 捲軸），sticky 後不隨橫捲移動。 */
        table.od tr.od-hold .od-hold-in {
            position: sticky;
            left: 0;
            box-sizing: border-box;
            width: 340px;
            padding: 4px 6px 5px 16px;
            white-space: normal;
            text-align: left;
        }
        .od-hc-list { display: flex; flex-wrap: wrap; gap: 3px; }
        .od-hc {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            max-width: 100%;
            height: 17px;
            padding: 0 5px;
            box-sizing: border-box;
            border: 1px solid var(--line);
            border-radius: 4px;
            background: var(--bg);
            color: var(--text);
            font-size: 10.5px;
            font-weight: 400;
            white-space: nowrap;
        }
        .od-hc .x { color: var(--dim); }
        .od-hc-ex {
            padding: 0 2px;
            border: 1px solid var(--line);
            border-radius: 3px;
            color: var(--dim);
            font-size: 9px;
            line-height: 11px;
        }
        .od-hc.lbas { border-style: dashed; color: var(--dim); }
        .od-hc.idle { border-color: transparent; background: none; color: var(--dim); }
        /* 裝備艦檢視：四欄收在面板寬度內，不橫捲；裝備艦多時列高撐開，不截斷清單。 */
        table.od.od-hv { width: 100%; }
        table.od.od-hv th.h,
        table.od.od-hv td.h { text-align: left; }
        table.od.od-hv th.h .od-head { display: flex; justify-content: flex-start; }
        table.od.od-hv td.h { white-space: normal; width: 100%; }
        /* 數量／閒置欄表頭不可被裝備艦欄壓到省略：改 flex，項目保有內容寬度。 */
        table.od.od-hv th:not(.n):not(.h) .od-head { display: flex; justify-content: center; }
        table.od.od-hv th:not(.n):not(.h) .od-label { overflow: visible; }

        h3 {
            margin: 12px 0 6px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: var(--track-label);
            color: var(--brass);
            border-bottom: 1px solid var(--line);
            padding-bottom: 4px;
        }

        h3:first-child {
            margin-top: 0;
        }

        /* 一般分頁上段：資源(左) × 遠征(右) 左右並排；中段：入渠(左) × 建造(右)。
           兩段共用 1fr 1fr，讓資源/遠征欄寬對齊下方入渠/建造欄寬（同一組欄線貫穿兩段）。
           align-items:stretch（非 start）：3 個遠征全滿時遠征欄比資源欄高，若資源欄不隨之
           伸展，兩欄底部會對不齊、緊接著的入渠/建造 row 看起來像貼著較高的那欄——讓兩欄
           都伸展到同一列高，資源欄再用 align-content:space-between 把 4 列撐開對齊底部。
           欄寬一律用 minmax(0, 1fr) 而非裸 1fr：裸 1fr 等同 minmax(auto, 1fr)，欄內若有
           nowrap 長文字（艦名、任務名），該欄的 min-content 會高於半寬並把另一欄擠窄，
           欄界就不再落在容器正中、上下三段（資源/遠征・入渠/建造・任務）分界線互相錯開。
           下限改 0 後欄寬恆為精確半寬，截斷交給欄內元素的 min-width:0 + ellipsis 處理。 */
        .g-top {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 2px 12px;
            align-items: stretch;
            margin-bottom: 6px;
        }

        .g-docks {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 2px 12px;
            align-items: start;
            margin-bottom: 4px;
        }

        /* 資源看板：8 項固定 2 欄×4 列（主資源左欄、消耗材右欄），label 左、數值右對齊。 */
        .resblock {
            display: grid;
            grid-auto-flow: row;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 2px 14px;
            align-content: start;
            font-size: 11px;
            line-height: 1.3;
            color: var(--dim);
            font-variant-numeric: tabular-nums;
        }

        .resblock span {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 5px;
            min-width: 0;
            white-space: nowrap;
        }

        .resblock b {
            color: var(--text);
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .resblock .sec b {
            color: var(--dim);
            font-weight: 400;
        }

        .resblock i {
            font-style: normal;
            color: var(--brass);
        }

        /* 一般分頁資訊區：資源抬頭下接遠征／入渠／建造三欄，任務區使用剩餘高度。 */
        .g-status {
            flex: none;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .g-occ {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
            min-width: 0;
        }

        .g-cat {
            position: relative;
            min-width: 0;
            border-top: 1px solid var(--line);
            padding-top: 4px;
        }
        .g-cat-exped { border-top-color: var(--brass); }
        .g-cat-dock { border-top-color: #7fd0ff; }
        .g-cat-build { border-top-color: #58a55c; }
        .g-cat > .t-tag {
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1;
            padding: 0 4px;
            background: var(--bg);
            height: 14px;
            display: flex;
            align-items: center;
        }
        .g-cat > .t-tag .t-icon {
            width: 13px;
            height: 13px;
        }
        .g-cat > div {
            display: grid;
            gap: 2px;
            min-width: 0;
        }

        .g-item {
            min-width: 0;
        }
        .g-chip {
            display: flex;
            align-items: center;
            gap: 5px;
            min-width: 0;
            min-height: 21px;
            padding: 2px 5px;
            border-radius: 3px;
            background: var(--panel);
            color: var(--text);
            font-size: 11px;
            line-height: 1.25;
            font-variant-numeric: tabular-nums;
            cursor: default;
            transition: background 80ms ease;
        }
        .g-chip[data-exped-fleet] { cursor: pointer; }
        .g-chip:hover {
            background: color-mix(in srgb, var(--line) 40%, var(--panel));
        }
        .g-chip[data-exped-fleet]:hover {
            background: color-mix(in srgb, var(--brass) 14%, var(--panel));
        }
        .g-chip .fleet-box {
            flex: none;
            font-size: 10px;
            font-weight: 700;
            color: var(--sparkle);
            min-width: 12px;
            text-align: center;
        }
        .g-name {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-weight: 500;
        }
        .g-eta {
            flex: none;
            color: var(--brass);
            font-weight: 600;
            font-size: 11px;
            white-space: nowrap;
        }
        .g-chip .g-eta.grow {
            flex: 1;
            min-width: 0;
            color: var(--dim);
            font-weight: 500;
        }
        .g-chip > .g-eta:last-child {
            margin-left: auto;
            text-align: right;
        }
        .g-chip.done {
            background: color-mix(in srgb, var(--sparkle) 12%, var(--panel));
        }
        .g-chip.done .g-name {
            color: var(--sparkle);
            font-weight: 600;
        }
        .g-chip.done .g-eta {
            color: var(--sparkle);
            font-weight: 700;
        }
        .g-empty {
            min-height: 21px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2px 4px;
            color: var(--stub);
            font-size: 10.5px;
            user-select: none;
        }
        .exped-detail {
            padding: 2px 6px;
            margin-top: 1px;
            font-size: 10px;
            color: var(--dim);
            line-height: 1.3;
            white-space: normal;
            overflow-wrap: anywhere;
            background: color-mix(in srgb, var(--bg) 80%, var(--panel));
            border-left: 2px solid var(--brass);
        }

        .g-quest-block {
            position: relative;
            display: flex;
            flex: 1;
            min-height: 0;
            flex-direction: column;
            border-top: 1px solid var(--line);
            padding-top: 4px;
        }
        .g-quest-block > .t-tag {
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1;
            padding: 0 4px;
            background: var(--bg);
            height: 14px;
            display: flex;
            align-items: center;
        }
        .g-quest-block > .t-tag .t-icon {
            width: 13px;
            height: 13px;
        }

        .timer-row {
            display: flex;
            gap: 8px;
            align-items: baseline;
            padding: 3px 6px;
            border-radius: 4px;
        }

        .timer-row:nth-child(odd) {
            background: var(--panel);
        }

        /* 進行中計時看板：遠征/入渠/建造合併，以彩色類型標籤區分（回收原三條 h3 橫幅） */
        .t-tag {
            font-size: 10px;
            font-weight: 700;
            line-height: 1.5;
            padding: 0 5px;
            border-radius: 4px;
            white-space: nowrap;
            flex: none;
            display: inline-flex;
            align-items: center;
        }

        /* 計時列標籤圖示（渠＝吊臂／建＝造船鎚／遠＝羅盤）：與 .g-icon 同尺寸，
           使計時列高度與裝備 chip 一致；padding 收窄，圖示自身已有留白。
           align-self: .timer-row 用 baseline 對齊，純圖示標籤的 baseline 落在圖片
           底緣、會整個浮高於文字——在列內垂直置中（文字彼此仍維持 baseline）。 */
        .t-tag:has(.t-icon) {
            padding: 0 2px;
            align-self: center;
        }

        .t-icon {
            width: 16px;
            height: 16px;
            flex: none;
            display: block;
        }

        /* tt-exped 只用於遠征空狀態列的色底標籤；有資料時遠征列也放羅盤圖示（艦隊編號與
           任務編號之間），但用不帶顏色的裸 .t-tag，純粹當分隔標示，不是狀態色塊。 */
        .t-tag.tt-exped {
            color: var(--brass);
            background: color-mix(in srgb, var(--brass) 16%, transparent);
        }

        .t-tag.tt-dock {
            color: #7fd0ff;
            background: color-mix(in srgb, #7fd0ff 16%, transparent);
        }

        /* 遠征名稱：預設寬度只靠 .timer-row 的 title 懸浮顯示（見 main.ts），這裡的文字
           仍照常渲染進 DOM（提供 a11y／可選取），只用 color:transparent 隱去視覺——
           .grow 既有的 flex:1+ellipsis+nowrap 已把它算進版面寬度，隱藏／顯示不改變
           那顆 badge（倒數時間）的位置，故不需另外用 display:none 挖掉再補空白撐版。
           使用者手動拉寬超過 460px（與 #quests 切欄同一斷點）時顯示出完整名稱。 */
        .exped-name {
            color: transparent;
        }

        @media (min-width: 460px) {
            .exped-name {
                color: inherit;
            }
        }

        .t-tag.tt-build {
            color: #58a55c;
            background: color-mix(in srgb, #58a55c 16%, transparent);
        }

        .dim-txt {
            color: var(--dim);
        }

        /* 任務清單保留垂直捲動；實際單欄展開列由 .ledger-quest-list 管理。 */
        #quests {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
        }

        .quest-cell {
            min-width: 0;
        }

        .quest-row {
            display: flex;
            gap: 6px;
            align-items: center;
            padding: 2.5px 6px;
            border-radius: 3px;
            cursor: pointer;
            min-height: 21px;
            background: transparent;
            line-height: 1.25;
            transition: background 80ms ease;
        }

        .quest-cell:nth-child(odd) .quest-row {
            background: var(--panel);
        }

        .quest-row:hover {
            background: color-mix(in srgb, var(--line) 40%, var(--panel));
        }

        .quest-row .grow {
            font-size: 11px;
            font-weight: 500;
            color: var(--text);
        }

        .quest-row.done .grow {
            color: var(--sparkle);
            font-weight: 600;
        }

        .quest-row .q-prog {
            font-size: 10.5px;
            color: var(--brass);
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }
        .quest-row .q-st {
            font-size: 10px;
            color: var(--dim);
            font-weight: 500;
            white-space: nowrap;
        }
        .quest-row.done .q-st {
            color: #58a55c;
            font-weight: 600;
        }

        .quest-detail {
            padding: 3px 6px 4px;
            font-size: 10px;
            color: var(--dim);
            line-height: 1.35;
            background: color-mix(in srgb, var(--panel) 70%, var(--bg));
            border-left: 2px solid var(--brass);
            margin: 1px 0 2px;
            white-space: normal;
        }

        .badge {
            color: var(--brass);
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .grow {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .num {
            font-variant-numeric: tabular-nums;
            color: var(--dim);
        }

        .empty,
        .dim {
            color: var(--dim);
            padding: 2px 6px;
        }

        #log {
            font: 11px/1.6 ui-monospace, monospace;
            color: var(--dim);
            max-height: 260px;
            overflow-y: auto;
        }

        #fleetnav {
            display: flex;
            align-items: center;
            gap: 4px;
            /* 收垂直 padding：縮小「陣型列／分頁底」到編成之間的空隙，七船用。
               不畫底部分隔線：與下方 .fs-metrics 的間距改由 #fleets／.fsummary
               統一承擔，避免單隊與連合各多一條線、上下留白不一致。 */
            padding: 3px 10px;
        }

        #fleetnav button {
            background: none;
            border: 1px solid var(--line);
            color: var(--dim);
            border-radius: 5px;
            padding: 3px 10px;
            font-size: 12px;
            cursor: pointer;
        }

        #fleetnav button.on {
            color: var(--text);
            border-color: var(--brass);
            background: color-mix(in srgb, var(--brass) 14%, transparent);
        }

        #fleetnav button.stub {
            color: var(--stub);
            border-style: dashed;
            cursor: default;
        }

        /* 該編成有大破或未補給的船——紅框疊在既有 border 外，跟 .on 的 border-color
           變化互不干擾（不論分頁是否選取都看得到警示）。 */
        #fleetnav button.attn {
            box-shadow: 0 0 0 1px var(--dmg-major);
        }

        /* 基地航空隊鈕：有中隊帶疲勞標記時，整顆鈕的文字與外框轉成對應語意色
           （黃標記＝cond 20–29／紅標記＝cond 0–19，取最嚴重的一段）。
           **必須排在 `.on` 之後**（同 specificity，後者勝）——面板正開著 LBAS 分區時
           一樣要看得到疲勞，否則最該注意的時候反而沒有標示。
           與 `.attn`（機數未補滿的紅框）是兩套獨立語意，可同時成立：框線色講疲勞、
           外圈 box-shadow 講未補給。 */
        #fleetnav button.cond-tired {
            color: var(--lbas-tired);
            border-color: var(--lbas-tired);
        }

        #fleetnav button.cond-exhausted {
            color: var(--dmg-major);
            border-color: var(--dmg-major);
        }

        #fleetnav .grow {
            flex: 1;
        }

        #fleets {
            padding: 4px 10px 2px;
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            align-items: flex-start;
        }

        section.fleet {
            flex: 1 1 320px;
            min-width: 320px;
            max-width: 480px;
        }

        /* 聯合艦隊檢視：#fleets 只放一個 .combined-wrap 子元素——上排 .fsummary.combined-total
           （兩隊合計統計，全寬）、下排 .c-fleet-row（兩隊左右並排，各佔一半可用寬；370
           內寬扣除編成內距與欄距後，每欄約 160px），故必須解除單隊檢視的 min-width:320
           （否則會被擠成上下堆疊）。欄內一切以 min-width:0 允許艦名截斷為前提。 */
        .combined-wrap {
            display: flex;
            flex-direction: column;
            /* 合計列底內距已由 .fsummary 的 4px 承擔，此處不再加 gap，
               否則連合會比六／七船多一截把艦列往下推。 */
            gap: 0;
            width: 100%;
        }

        .c-fleet-row {
            display: flex;
            gap: 6px;
        }

        section.fleet.compact {
            flex: 1 1 0;
            min-width: 0;
            max-width: none;
        }

        /* 聯合檢視沿用 850px 視窗；兩隊各最多 6 艘，版面以不捲動顯示完整編成為約束。
           合計列與單隊 .fsummary 共用同一套上下內距（無底線），避免連合多出一圈
           留白把艦列往下推。 */
        .fsummary.combined-total {
            padding: 0 6px 4px;
        }

        .fsummary.compact {
            gap: 6px;
            align-items: center;
            padding: 2px 4px 4px;
            line-height: 1.25;
        }

        .fsummary.compact .badge-tag {
            font-size: 9px;
            padding: 0 4px;
        }

        .ship.c {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto auto;
            grid-template-rows: auto auto auto;
            column-gap: 6px;
            padding: 1px 4px;
            line-height: 1.3;
            background: var(--panel);
        }

        section.fleet.compact > .ship.c:not(:last-child) {
            margin-bottom: 6px;
        }

        .ship.c .c-top {
            grid-column: 1 / -1;
            grid-row: 1;
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .ship.c .c-top .c-name {
            flex: 1 1 auto;
            display: flex;
            align-items: center;
            gap: 4px;
            min-width: 0;
        }

        .ship.c .c-top .c-top-flags {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .ship.c .c-top .c-top-flags:empty {
            display: none;
        }

        .ship.c .c-bot {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .ship.c .c-top {
            font-size: 12px;
        }

        /* 艦種縮寫固定寬度＋置中：縮寫本身長度不一（DD 2字 vs CVL 3字），若跟單隊
           檢視一樣讓徽章寬度隨文字伸縮，艦名起始位置會逐艦不同，並排欄裡直排下來
           會參差不齊。固定寬度後徽章本身长度仍隨文字置中顯示，但艦名一律從同一個
           x 位置起算，同時解決「沒有分隔」（沿用 .stype 徽章底色/邊框）與「對不
           齊」兩個問題。該艦艦種未知（stype 空字串）時徽章仍佔位、留空，不影響對齊。
           寬度用 px 非 em：32px 足以容納最寬的艦種縮寫並保留緩衝，不用 em 是因為
           em 是照 .stype 自己的 9px 字級換算，字級微調會連帶改變這個寬度，px 才是
           真正跟文字寬度需求綁定的單位。 */
        .ship.c .stype {
            width: 32px;
            text-align: center;
            flex: none;
            margin-right: 0;
        }

        .ship.c .c-top .ship-asw-icon-only {
            flex: 0 0 11px;
            width: 11px;
            gap: 0;
        }

        /* 艦名過長時截斷（全名在 title）——並排欄寬無法容納長名，換行會破壞列高一致。 */
        .ship.c .c-top .grow {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .ship.c .lv {
            flex: none;
            font-size: 11px;
            color: var(--dim);
            font-variant-numeric: tabular-nums;
        }

        .ship.c .cond {
            width: 2.2em;
            font-size: 12px;
        }

        .ship.c .hpbar {
            flex: 1;
            width: auto;
            height: 6px;
        }

        .ship.c .num {
            font-size: 11px;
        }

        /* 燃彈迷你量表：左燃右彈，各自從外緣往內縮，中間露底色＝已消耗（同單隊檢視配色）。 */
        .ship.c .c-sup {
            display: inline-flex;
            gap: 1px;
            width: 28px;
            flex: none;
        }

        .ship.c .c-sup>i {
            height: 5px;
            flex: 1;
            border-radius: 2px;
            background-color: var(--line);
        }

        /* 裝備列（HP 列下方新增一行）採窄版「圖示＋搭載數」；改修／熟練度收在 title，
           增設格滿改另以星號顯示。整組 14px 圖示與 8px 數字是為五格一般裝備加增設格
           保留完整寬度，避免窄欄重疊或裁切。 */
        /* 外層：一般槽位（.c-gear-slots，固定單列）＋打洞格，打洞格 flex:none 天然被
           推到最右、不隨一般槽位數量變動而跳位（見 main.ts compactGearRow 說明）。
           五格空母的搭載數也必須留在同一列，否則 compact 艦列會被額外的第二行撐高。 */
        .c-gear {
            display: flex;
            align-items: flex-start;
            gap: 3px;
            margin-top: 2px;
            line-height: 1;
        }

        .c-gear-slots {
            flex: 1 1 auto;
            display: flex;
            flex-wrap: nowrap;
            gap: 3px;
            min-width: 0;
        }

        .cg-item {
            display: inline-flex;
            align-items: center;
            gap: 1px;
            flex: 0 0 auto;
            min-width: 0;
            white-space: nowrap;
        }

        .cg-item .g-icon,
        .cg-item .g-icon-slot {
            width: 14px;
            height: 14px;
        }

        /* 未裝備槽位：同單隊檢視 .chip-empty 的淡化＋虛線語意，但縮到與 .cg-item
           圖示同尺寸的方框（非撐出完整 chip 寬度——這裡沒有跨艦對齊需求）。 */
        .cg-item.cg-empty {
            opacity: .5;
        }

        .cg-item.cg-empty .g-icon-slot {
            display: inline-block;
            outline: 1px dashed var(--line);
            outline-offset: -1px;
            border-radius: 2px;
        }

        /* 打洞格（補強增設）：呼應單隊檢視 .chip.ex 的 brass 虛線標示，跟一般裝備格
           區分開。:not(.cg-empty) 避免跟下面 .cg-empty .g-icon-slot 的內層虛線疊成雙框。 */
        .cg-item.ex:not(.cg-empty) {
            outline: 1px dashed var(--brass);
            outline-offset: 1px;
            border-radius: 2px;
        }

        .cg-item.cg-empty.ex .g-icon-slot {
            outline-color: var(--brass);
        }

        .cg-item em {
            font-style: normal;
            font-weight: 600;
            font-size: 8px;
            line-height: 1;
            color: var(--dim);
            font-variant-numeric: tabular-nums;
        }

        .cg-item.ex em {
            color: #7fd0ff;
        }

        .c-gear-slots > .cg-item:not(.cg-empty) {
            background: var(--line);
            border-radius: 3px;
        }

        .cg-item em.hit {
            color: var(--dmg-mid);
        }

        .cg-item em.zero {
            color: var(--dmg-major);
        }

        section.fleet h4 {
            margin: 4px 0 4px;
            font-size: 12px;
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .badge-tag {
            font-size: 10px;
            padding: 1px 6px;
            border-radius: 8px;
            border: 1px solid var(--line);
            color: var(--dim);
        }

        .badge-tag.mission {
            color: var(--brass);
            border-color: var(--brass);
        }

        .badge-tag.danger {
            color: #fff;
            background: var(--dmg-major);
            border-color: var(--dmg-major);
        }

        .badge-tag.secretary {
            color: var(--sparkle);
            border-color: var(--sparkle);
        }

        /* 泊地修理／給糧的摘要 badge，與左緣範圍軌同色系互相呼應。 */
        .badge-tag.repair {
            color: var(--brass);
            border-color: var(--brass);
        }

        .badge-tag.morale {
            color: var(--sparkle);
            border-color: var(--sparkle);
        }

        /* 倒數是「估算值」（遊戲不送泊地修理封包，計時器靠觀察編成封包推算），
           故刻意用弱化樣式，不與確定性的遠征/入渠倒數同樣強調。 */
        .badge-tag.est {
            color: var(--dim);
            border-style: dashed;
        }

        .fsummary {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            font-size: 11px;
            color: var(--dim);
            padding: 0 6px 4px;
            font-variant-numeric: tabular-nums;
        }

        /* 估算值（目前只有熟練度過時的制空）：沿用面板既有的估算視覺語彙——虛線。
           數字照常顯示，只是提示它可能不是封包事實（見 GameState.alvStale）。 */
        .fsummary b.est {
            border-bottom: 1px dashed var(--dim);
            cursor: help;
        }

        .fsummary b {
            color: var(--text);
            font-weight: 600;
        }

        .fsummary select {
            background: var(--panel);
            color: var(--text);
            border: 1px solid var(--line);
            border-radius: 4px;
            font-size: 11px;
        }

        .ship {
            padding: 2px 6px;
            border-radius: 4px;
        }

        .ship:nth-child(odd) {
            background: var(--panel);
        }

        /* ── 泊地修理／給糧的「範圍軌」──
           以 inset box-shadow 疊在艦列左緣畫縱向色條，不動 DOM 結構。多層 inset 時
           先列的疊在上層，故 3px 的修理軌壓在 6px 的給糧軌之上 → 視覺上並排兩條。
           左內距讓出 8px 給軌條，避免壓到艦種縮寫。
           配色：修理用 --brass、給糧用 --sparkle（キラ/改修的既有語意，相符）；
           **不用 --dmg-* 語意色**，那組專屬損傷程度，見 design-guidelines §4.5。 */
        .ship.rail-rep,
        .ship.rail-mor {
            padding-left: 14px;
        }

        .ship.rail-rep {
            box-shadow: inset 3px 0 0 0 var(--brass);
        }

        .ship.rail-mor {
            box-shadow: inset 3px 0 0 0 var(--sparkle);
        }

        .ship.rail-rep.rail-mor {
            box-shadow: inset 3px 0 0 0 var(--brass), inset 7px 0 0 0 var(--sparkle);
        }

        /* 逐艦標記：在範圍內、本次結算會實際生效者為實色；因中破/入渠等被跳過者
           降為 --stub 並加刪除線，讓「在範圍內但不會被處理」與「根本不在範圍」可區分。 */
        .rmark {
            font-size: 9px;
            line-height: 16px;
            letter-spacing: var(--track-tag);
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }

        .rmark.rep {
            color: var(--brass);
        }

        .rmark.mor {
            color: var(--sparkle);
        }

        .rmark.skip {
            color: var(--stub);
            text-decoration: line-through;
        }

        .hpbar {
            position: relative;
            width: 56px;
            height: 5px;
            background: var(--line);
            border-radius: 3px;
            overflow: hidden;
            align-self: center;
        }

        .hpbar>i {
            position: absolute;
            inset: 0;
            right: auto;
            background: #58a55c;
        }

        /* 小破／中破／大破門檻。條寬已正規化，刻度固定在 75%／50%／25%，單艦隊與連合共用。 */
        .hpbar::after {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background:
                linear-gradient(var(--hp-tick), var(--hp-tick)) 75% 0 / 1px 100% no-repeat,
                linear-gradient(var(--hp-tick), var(--hp-tick)) 50% 0 / 1px 100% no-repeat,
                linear-gradient(var(--hp-tick), var(--hp-tick)) 25% 0 / 1px 100% no-repeat;
        }

        .st-minor .hpbar>i {
            background: var(--dmg-minor);
        }

        .st-mid .hpbar>i {
            background: var(--dmg-mid);
        }

        .st-major .hpbar>i {
            background: var(--dmg-major);
        }

        /* 大破艦：艦名轉紅。單隊與聯合（.ship.c）共用同一條警示語意；標籤不增加列高。 */
        .st-major .ship-id .grow,
        .ship.c.st-major .c-top .grow {
            color: var(--dmg-major);
            font-weight: 600;
        }

        .cond {
            width: 3em;
            text-align: right;
            font-variant-numeric: tabular-nums;
            color: var(--dim);
        }

        .cond.sparkle {
            color: var(--sparkle);
        }

        .cond.tired {
            color: var(--dmg-mid);
        }

        .cond.heavy {
            color: var(--dmg-major);
        }

        /* 結構：.chips{flex:1} 裝一般槽，打洞＋燃彈在外側由剩餘空間推到列尾。
           第五格換行的主因是 SVG／熟練字元把單格撐寬；下面鎖 min/max 可維持整排預算。
           共用基準格為 40px（16px 圖示＋1px gap＋21px 資訊欄＋兩側各 1px 內距）；
           正式單隊列在下方按 90% 同步縮放，保證最後一格不會壓到增設槽。
           ⚠️ 高度硬約束：窗高 850 是按「單艘列高 ≈49.5px × 7 艘」校準的
           （background.ts openPanelWindow）。裝備列一旦 wrap 成兩行，單艘變高，
           第 7 艘就會被視窗底裁掉——所以這裡用 nowrap，並把格寬收到預算內。 */
        .chips {
            flex: 1;
            display: flex;
            flex-wrap: nowrap;
            gap: 2px;
            min-width: 0;
        }

        /* 共用基準格 40px、打洞 34、燃彈 56（「100」不裁字）；正式單隊列另縮為
           36／31px。兩種配置都用 .chips nowrap 禁止換行，
           必須對 .chip／.g-icon 鎖 min/max，否則 SVG／「///」撐破→換行→七船被裁。 */
        .chip {
            box-sizing: border-box;
            display: inline-flex;
            align-items: center;
            gap: 1px;
            width: 40px;
            min-width: 40px;
            max-width: 40px;
            flex: none;
            overflow: hidden;
            font-size: 10px;
            line-height: 1;
            padding: 2px 1px;
            border-radius: 3px;
            background: var(--line);
            color: var(--text);
            white-space: nowrap;
        }

        /* 空白 chip 的圖示佔位（無 <img>）：與 .g-icon 同尺寸，讓「未裝備」與「跨艦
           補位」兩種空 chip 都用真實 <u>/<b> 槽位撐出寬度，與有裝備的 chip 完全同寬——
           不必另外硬編一個總寬度數字去追平（那樣每次調整 padding/gap 都要重算，還容易兜不齊）。 */
        .g-icon-slot {
            width: 16px;
            height: 16px;
            flex: none;
            display: inline-block;
        }

        /* chip 內部佈局：右欄（r-col）上排熟練＋改修（r-top）、下排搭載機數（oc），
           自然高度約 19px（10+gap1+8）——左側圖示取 20px 正方形填滿這個自然高度，
           不另外撐大 chip（放大是「用好既有空間」而非搶預算）。oc 行高恆保留——
           非飛機槽／空格也佔同高，讓所有 chip、進而所有艦列高一致（見 main.ts
           chip/blankChip）。搭載數平時（滿載）暗灰低調；戰損轉橘、全滅轉紅。
           圖示放大只限艦隊裝備 chip（.chip 範圍），其餘處（sq-chip、資源列）維持 16px。 */
        .chip .g-icon,
        .chip .g-icon-slot {
            box-sizing: border-box;
            width: 16px;
            height: 16px;
            min-width: 16px;
            max-width: 16px;
            flex: none;
            /* SVG filter 外擴不應撐開 flex 最小內容尺寸 */
            overflow: hidden;
        }

        .r-col {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 1px;
            flex: none;
            width: 21px; /* u11 + gap1 + b9：鎖死以免 .oc 兩位數把整格撐寬 */
            min-width: 21px;
            max-width: 21px;
            overflow: hidden;
        }

        .r-top {
            display: flex;
            align-items: baseline;
            gap: 1px;
        }

        .r-col .oc {
            height: 8px;
            font-size: 8px;
            font-style: normal;
            font-weight: 700;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            color: var(--dim);
        }

        .r-col .oc.hit {
            color: var(--dmg-mid);
        }

        .r-col .oc.zero {
            color: var(--dmg-major);
        }

        /* 未裝備槽位：該艦真實存在、但未裝備的槽位，虛線＋低透明度標示。
           用 outline 而非 border，因 outline 不佔版面（不影響盒子尺寸），確保與
           有裝備的 chip 同寬。 */
        .chip-empty {
            outline: 1px dashed var(--line);
            outline-offset: -1px;
            background: none;
            opacity: .5;
        }

        /* 跨艦補位槽：該艦本身沒有這個槽位（例如 2 格艦排在 4 格艦旁邊），純粹用來讓
           同艦隊每艘船的裝備列行數（進而列高）一致，完全不可見（連虛線都不畫，
           避免被誤讀成「這裡有個空槽」）。 */
        .chip-pad {
            visibility: hidden;
        }

        /* 裝備／資源圖示：本專案原創向量重繪（見 THIRD-PARTY-NOTICES）。SVG 在任何
           解析度／縮放皆銳利，不隨 DPI 產生鋸齒或糊邊。固定寬度使多語系切換時排版
           一致（不隨字寬變動）。圖示自帶配色，故 chip 底色維持中性。 */
        .g-icon,
        .m-icon {
            width: 16px;
            height: 16px;
            flex: none;
        }

        .m-icon {
            vertical-align: -3px;
        }

        /* 熟練（u，在前）與改修（b，在後）槽固定寬度、不隨內容伸縮（flex:none），
           空槽也佔位——讓同格數裝備列跨艦等寬對齊。
           1–3 階直條跟遊戲同色 --alv-bar；4–7 斜線／雙箭維持 --sparkle。
           熟練寬度以 /// 為準；滿熟 >> 以負字距收進同一槽，避免 overflow 切掉右箭、
           也不壓到改修數字。改修僅單字元（數字或滿改修的 ★）故較窄。
           寬度屬於「六格一行」預算的一部分（見 .chip 註解），縮窄前先重算。 */
        .chip u {
            flex: none;
            display: inline-block;
            box-sizing: border-box;
            width: 11px;
            min-width: 11px;
            max-width: 11px;
            overflow: hidden;
            text-align: left;
            text-decoration: none;
            color: var(--sparkle);
        }

        .chip u.alv-lo,
        .ab-sq .sq-chip u.alv-lo {
            color: var(--alv-bar);
        }

        .chip u.alv-ace {
            letter-spacing: -0.12em;
        }

        .chip b {
            flex: none;
            display: inline-block;
            box-sizing: border-box;
            width: 9px;
            min-width: 9px;
            max-width: 9px;
            overflow: hidden;
            text-align: left;
            color: #7fd0ff;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .chip.ex {
            width: 34px;
            min-width: 34px;
            max-width: 34px;
            outline: 1px dashed var(--brass);
        }

        /* 打洞格的改修沒有 r-col（見 main.ts chip()/blankChip() 的 ex 分支：裝不了
           熟練度、也裝不了飛機，無需 u／oc 兩個對齊基準），單獨一個 <b> 時置中
           比沿用一般 chip 的靠左更平衡；垂直置中則直接吃 .chip 既有的
           align-items:center，不必再寫。 */
        .chip.ex b {
            width: 12px;
            min-width: 12px;
            max-width: 12px;
            text-align: center;
        }

        /* 空的打洞格（該艦有補強增設能力、但未裝備）：沿用一般空格的淡化＋虛線，但
           虛線改用 brass（呼應已裝備打洞格的 .chip.ex），與「一般空裝備格」（灰虛線）
           及「已裝備打洞格」（brass 實色底）三者都能一眼分辨。 */
        .chip-empty.ex {
            outline-color: var(--brass);
        }

        /* 色別（艦隊裝備 chip 不使用左側色邊：圖示本身已帶配色，色邊會讓有色別/無
           色別的 chip 寬度不一致、破壞跨艦對齊；基地航空隊 sq-chip 無此對齊需求）。 */
        .sq-chip.c-gun { border-left: 2px solid #c96a6a; }
        .sq-chip.c-sec { border-left: 2px solid #cbb35a; }
        .sq-chip.c-torp { border-left: 2px solid #5a86c9; }
        .sq-chip.c-ftr { border-left: 2px solid #5ac97a; }
        .sq-chip.c-db { border-left: 2px solid #d97a5a; }
        .sq-chip.c-tb { border-left: 2px solid #5ac2cc; }
        .sq-chip.c-rec { border-left: 2px solid #d9c95a; }
        .sq-chip.c-sea { border-left: 2px solid #5aa6d9; }
        .sq-chip.c-radar { border-left: 2px solid #d99e5a; }
        .sq-chip.c-asw { border-left: 2px solid #5ac2a6; }
        .sq-chip.c-etc { border-left: 2px solid #6a7488; }

        /* 燃彈合併 chip：在 .chips 之外，靠 .chips{flex:1} 推到列尾。
           56px＋9px 字：兩側「100」完整可見，不准 overflow 裁字。 */
        .chip.supply-combo {
            padding: 0;
            gap: 0;
            overflow: hidden;
            width: 56px;
            min-width: 56px;
            max-width: 56px;
            flex: none;
            align-self: center;
            font-variant-numeric: tabular-nums;
            font-weight: 600;
            font-size: 9px;
        }

        /* 兩半各為迷你量表：色塊背景由 inline linear-gradient 給（寬度=殘量%，
           燃料錨左、彈藥錨右，見 main.ts supplyChip），透明處露出 .chip 的 --line
           底色即消耗部分。文字用亮色＋暗描邊，色塊上與露底處都可讀。 */
        .chip.supply-combo .sup-fuel,
        .chip.supply-combo .sup-ammo {
            flex: 1 1 0;
            min-width: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2px 1px;
            overflow: visible;
            color: var(--text);
            text-shadow: 0 0 2px #10151d, 0 0 2px #10151d;
        }

        /* ── 370px 編成定版：狀態、艦名、HP 與補給／裝備三列 ──
           正式面板由 entrypoints/panel/main.ts 實作；tools/preview/panel-sortie.ts 是獨立的
           離線量測 fixture，不會自動同步，版面變更必須兩邊一併更新。
           裝備 chip 固定 221px，油彈百分比條與士氣同列；一至六船使用共同列距，七船另依高度預算收緊。 */
        html,
        body {
            overflow: hidden;
        }

        .fsummary {
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            flex-wrap: nowrap;
            gap: 2px;
            min-width: 0;
            overflow: hidden;
            padding: 0 4px 4px;
            height: 42px;
            min-height: 42px;
            max-height: 42px;
        }

        .fsummary:not(:has(> .fs-ops)) {
            gap: 0;
            height: 26px;
            min-height: 26px;
            max-height: 26px;
        }

        .fs-ops {
            display: flex;
            align-items: center;
            flex-wrap: nowrap;
            gap: 8px;
            min-width: 0;
            white-space: nowrap;
        }

        .fs-metrics {
            flex-wrap: nowrap;
            min-width: 0;
            white-space: nowrap;
        }

        .fs-ops {
            min-height: 15px;
        }

        .fs-tick,
        .fs-tick-mini {
            white-space: nowrap;
            font-size: 9px;
        }

        .fs-pri {
            color: var(--text);
        }

        .fs-sec {
            color: var(--dim);
        }

        /* 編成摘要定版：.fs-ops／.fs-metrics 共用同一列骨架；資訊階層靠排列、字級與
           既有色階，不靠粗體。索敵倍率是索敵元件內的控制，不另立一顆白底 select。 */

            line-height: 1;
            white-space: nowrap;

        .fs-metrics {

            max-width: 100%;

            min-height: 22px;
            max-height: 22px;

            padding: 0;
            min-width: 0;

        .fs-metric {

            width: 100%;
            gap: 3px;
            min-width: 0;
            height: 22px;
            padding: 0 3px;

        .fs-metric .fs-value,

            color: var(--text);

            line-height: 11px;
            font-weight: 400;
            font-variant-numeric: tabular-nums;
        }

        .fs-air {

        }

            flex-direction: column;
            justify-content: center;
            gap: 0;
        }

        .fs-los {
            flex: none;
            min-width: 0;

            align-items: center;

            align-items: flex-start;
            flex-direction: column;

            min-width: 0;

            height: 1px;
            padding: 0;

            white-space: nowrap;
            border: 0;
        }

        .fs-scale select.cn {
            appearance: none;
            width: 100%;
            height: 100%;

            padding: 0 11px 0 5px;

        }

            flex: none;
