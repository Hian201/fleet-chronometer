        .s-icon.rank-a { color: #e74c3c; border-color: #e74c3c; font-size: 15px; font-weight: bold; }
        .s-icon.rank-b { color: #d35400; border-color: #d35400; font-size: 15px; font-weight: bold; }
        .s-icon.rank-c { color: #95a5a6; border-color: #7f8c8d; font-size: 15px; font-weight: bold; }
        .s-icon.rank-d { color: #7f8c8d; border-color: #566060; font-size: 15px; font-weight: bold; }

        /* 打撈晶片：**金色只留給「本鎮守府還沒有的船」**。每一場都上色的話，看到金色
           的第一反應會是「又是同一批」，真正的新船就淹沒在裡面了；已持有的改用一般
           文字色與中性框，資訊照給、不搶注意力。 */
        .s-drop {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: color-mix(in srgb, var(--line) 30%, var(--panel));
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 2px 8px 2px 4px;
        }

        .s-drop.new {
            background: color-mix(in srgb, var(--sparkle) 12%, var(--panel));
            border-color: var(--sparkle);
        }

        .s-drop-tag {
            font-size: 8px;
            font-weight: 700;
            letter-spacing: var(--track-tag);
            color: #10151d;
            background: var(--dim);
            border-radius: 8px;
            /* 右內距扣掉一個字距，理由同 .ship-row .stype */
            padding: 1px calc(5px - var(--track-tag)) 1px 5px;
        }

        .s-drop.new .s-drop-tag {
            background: var(--sparkle);
        }

        .s-drop-name {
            font-size: 11px;
            font-weight: 600;
            color: var(--text);
            white-space: nowrap;
        }

        .s-drop.new .s-drop-name {
            color: var(--sparkle);
        }

        /* ── 出擊定版覆寫 ───────────────────────────────────────────────
           正式 panel 與離線 panel-sortie 預覽共用這個 420×270 出擊資訊比例：左側是
           戰況卡，右側是敵方主隊／隨伴晶片；最下方固定為五項系統訊號＋掉落格。
           這段只覆寫出擊元件，避免影響紀錄分頁的同名 chip。 */
        .sortie-container {
            height: 258px;
            max-height: 258px;
            padding: 0 6px 4px;
            gap: 0;
            overflow: hidden;
            background: transparent;
        }

        .s-header {
            height: 21px;
            min-height: 21px;
            flex: none;
            gap: 5px;
            flex-wrap: nowrap;
            overflow: hidden;
        }

        .s-map-id {
            padding: 2px 4px;
            border-radius: 2px;
            line-height: 14px;
        }

        .s-gauge {
            min-width: 0;
            flex: 0 0 auto;
        }

        .s-gauge.zansatsu .s-gauge-bar {
            background: var(--gauge-track);
            box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--dmg-major) 82%, var(--line));
        }

        .s-gauge.zansatsu .s-gauge-bar > i {
            background: var(--dmg-major);
            opacity: .86;
        }

        .s-nodes {
            gap: 2px;
            min-width: 0;
            overflow: hidden;
            flex-wrap: nowrap;
        }

        .s-node.boss {
            width: 17px;
            height: 21px;
            padding: 0;
            border: 0;
            background: transparent;
            position: relative;
            top: 0;
            box-shadow: none;
            isolation: isolate;
        }

        .s-node.boss::before,
        .s-node.boss::after {
            display: none;
        }

        .s-node.boss .s-boss-node-svg {
            display: block;
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .s-node.boss .s-boss-head {
            fill: #3a1515;
            stroke: #250909;
            stroke-width: 4.5px;
            stroke-linejoin: round;
            stroke-linecap: round;
        }

        .s-node.boss .s-boss-letter {
            fill: #b09090;
            font-family: system-ui, sans-serif;
            font-size: 50px;
            font-weight: 900;
        }

        .s-node.boss.visited .s-boss-head {
            fill: #9e3030;
            stroke: #ec4b3f;
            filter: drop-shadow(0 0 2px rgba(236, 75, 63, .44));
        }

        .s-node.boss.visited .s-boss-letter {
            fill: #ffd9d4;
        }

        /* 所有 node 共用 21px 的垂直文字框；一般 node 仍以圓形內圈呈現，
           讓圓形字母基準與含角的 boss 字母一致，不因外框高度不同而上下跳動。 */
        .sortie-container .s-node:not(.boss) {
            width: 16px;
            height: 21px;
            padding: 2.8px 0 0;
            box-sizing: border-box;
            border: 0;
            border-radius: 0;
            background: transparent;
            position: relative;
            top: 0;
            box-shadow: none;
        }

        .sortie-container .s-node:not(.boss)::before {
            content: '';
            position: absolute;
            left: 0;
            top: 3.9px;
            width: 16px;
            height: 16px;
            box-sizing: border-box;
            border: 1px solid #555;
            border-radius: 50%;
            background: #1a1a1a;
            box-shadow: none;
            z-index: -1;
        }

        .sortie-container .s-node:not(.boss).visited::before {
            border-color: #ff4444;
            background: #8b0000;
            box-shadow: 0 0 4px rgba(255, 0, 0, .38);
        }

        .s-phase {
            flex: none;
            line-height: 15px;
            padding: 0 8px;
        }

        .s-battle-row {
            flex: none;
            height: 181px;
            min-height: 181px;
            margin-top: 1px;
            display: grid;
            grid-template-columns: minmax(0, 1.1fr) minmax(0, 1.2fr);
            grid-template-rows: auto 163px;
            column-gap: 10px;
            row-gap: 2px;
        }

        .s-efleet-heads {
            grid-column: 2;
            grid-row: 1;
            padding-inline: 7px;
            grid-template-columns: minmax(0, .96fr) minmax(0, 1.04fr);
            gap: 0 6px;
            min-height: 15px;
            box-sizing: border-box;
            background: color-mix(in srgb, var(--panel) 30%, transparent);
            border-radius: 4px 4px 0 0;
        }

        .s-efleet-heads.single {
            grid-template-columns: 1fr;
        }

        .s-efleet-body {
            grid-column: 2;
            grid-row: 2;
            padding-inline: 7px;
            grid-template-columns: minmax(0, .96fr) minmax(0, 1.04fr);
            grid-template-rows: minmax(0, 1fr);
            gap: 4px 6px;
            align-content: stretch;
            min-height: 0;
            background: color-mix(in srgb, var(--panel) 30%, transparent);
            border-radius: 0 0 4px 4px;
        }

        .s-efleet-body.single {
            grid-template-columns: 1fr;
        }

        .s-ecol-h {
            min-height: 15px;
            box-sizing: border-box;
            padding-bottom: 2px;
            margin: 0;
            font-size: 10px;
            line-height: 1.2;
        }

        .s-echip {
            display: flex;
            flex: 1 1 0;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            padding: 2px 5px;
            min-height: 0;
            background: var(--panel);
            border-color: var(--line);
        }

        .s-echip-name {
            font-size: 10.5px;
            line-height: 1.35;
        }

        .s-echip-hp {
            display: block;
            flex: 0 0 4px;
            height: 4px;
            background: var(--line);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 2px;
        }

        .s-echip-hp > i {
            display: block;
            width: 100%;
            height: 4px;
            border-radius: 2px;
        }

        .s-eside {
            grid-column: 1;
            grid-row: 1 / span 2;
            height: 181px;
            min-height: 181px;
            padding: 12px 7px 4px;
            border: 1px solid color-mix(in srgb, var(--line) 82%, transparent);
            border-radius: 5px;
            background: color-mix(in srgb, var(--panel) 32%, transparent);
            box-sizing: border-box;
            overflow: hidden;
            justify-content: space-between;
            gap: 0;
        }

        .s-priority-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            height: 27px;
            min-height: 27px;
            align-items: center;
            align-content: center;
            padding: 0;
            box-sizing: border-box;
        }

        .s-priority-item {
            display: inline-flex;
            align-items: baseline;
            justify-content: center;
            gap: 4px;
            min-width: 0;
            color: var(--dim);
            font-size: 9px;
            white-space: nowrap;
        }

        .s-priority-item b {
            color: var(--text);
            font-size: 11.5px;
            font-weight: 600;
        }

        .s-priority-item.good b { color: #58a55c; }
        .s-priority-item.warn b { color: var(--dmg-mid); }
        .s-priority-item.bad b { color: var(--dmg-major); }

        .s-rank-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            align-items: center;
            column-gap: 12px;
            height: 33px;
            min-height: 33px;
            padding: 4px 0;
            box-sizing: border-box;
            position: relative;
            border: 0;
        }

        .s-rank-row::before,
        .s-rank-row::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            border-color: var(--line);
            border-style: solid;
        }

        .s-rank-row::before { top: 0; border-width: 1px 0 0; }
        .s-rank-row::after { bottom: 0; border-width: 0 0 1px; }

        .s-rank-result {
            display: grid;
            grid-template-columns: 29px auto;
            align-items: center;
            column-gap: 7px;
            justify-content: center;
            min-width: 0;
            height: 100%;
        }

        .s-rank-grade {
            display: inline-flex;
            align-items: baseline;
            justify-content: center;
            width: 28px;
            height: 28px;
            box-sizing: border-box;
            color: var(--dim);
            font-family: Georgia, "Times New Roman", "Noto Serif TC", serif;
            font-size: 28px;
            font-style: italic;
            font-weight: 900;
            line-height: 1;
            letter-spacing: -.09em;
            transform: skewX(-5deg);
            -webkit-text-stroke: .55px currentColor;
            text-shadow: 1px 1px 0 color-mix(in srgb, var(--bg) 84%, transparent),
                0 0 3px color-mix(in srgb, currentColor 45%, transparent);
        }

        .s-rank-grade sup {
            margin-left: 1px;
            color: var(--text);
            font-size: 12px;
            font-style: normal;
            line-height: 1;
        }

        /* 戰果字樣沿用遊戲 Result 的各 rank 色相與斜體襯線字形：SS／S 金、A 紅、B 橙、
           C 金黃、D 綠、E 藍。 */
        .s-rank-grade.rank-ss { color: #ffe066; }
        .s-rank-grade.rank-s { color: #f3d342; }
        .s-rank-grade.rank-a { color: #ef4b3f; }
        .s-rank-grade.rank-b { color: #ed762e; }
        .s-rank-grade.rank-c { color: #e8d047; }
        .s-rank-grade.rank-d { color: #4fc363; }
        .s-rank-grade.rank-e { color: #4d8ee8; }
        .s-rank-grade.rank-unknown { color: var(--dim); }
        .s-rank-grade.predicted { opacity: .72; filter: saturate(.72); }

        .s-rank-name {
            min-width: 0;
            color: var(--text);
            font-size: 10.5px;
            font-weight: 650;
            line-height: 1.05;
            white-space: nowrap;
        }

        .s-formation-compact {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            min-width: 0;
            color: var(--dim);
            font-size: 10px;
            gap: 6px;
        }

        .s-formation-readout {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            min-width: 0;
            color: var(--text);
            line-height: 1;
            white-space: nowrap;
        }

        .s-formation-readout b {
            color: var(--text);
            font-size: 10px;
            font-weight: 700;
            line-height: 1;
        }

        .s-formation-icon {
            display: block;
            width: 22px;
            height: 22px;
            flex: 0 0 22px;
            color: var(--brass);
            fill: currentColor;
        }

        .s-air-wrap {
            position: relative;
            height: 44px;
            min-height: 44px;
            margin: 0;
        }

        .s-air-loss-grid {
            display: grid;
            grid-template-rows: 9px repeat(2, 13px);
            gap: 1px 0;
            height: 100%;
            min-height: 0;
            padding: 0;
            box-sizing: border-box;
            align-content: center;
        }

        .s-air-loss-head,
        .s-air-loss-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 20px minmax(0, 1fr);
            align-items: center;
            min-width: 0;
        }

        .s-air-loss-head {
            color: #dfb95f;
            font-size: 8.5px;
            line-height: 1;
            text-align: center;
        }

        .s-air-loss-head span { color: var(--dim); }
        .s-air-loss-head b { font-weight: 700; }

        .s-air-kind {
            color: var(--dim);
            font-size: 8px;
            text-align: center;
            line-height: 1;
        }

        .s-air-kind.fighter { color: #58a55c; }
        .s-air-kind.bomber { color: var(--dmg-major); }

        .s-air-loss-cell {
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 2px;
            min-width: 0;
            font-size: 10px;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }

        .s-air-loss-cell b { color: var(--text); font-weight: 700; font-size: 10px; }
        .s-air-loss-cell i { color: var(--dmg-major); font-size: 8px; font-style: normal; font-weight: 700; }

        .s-air-loss-cell.friendly b { color: var(--text); }
        .s-air-loss-cell.enemy b { color: var(--text); }

        .s-air-loss-grid + .s-taiha {
            inset: 0;
            height: 100%;
        }

        .s-taiha {
            left: 0;
            right: 0;
            width: 100%;
            z-index: 3;
        }

        .s-taiha.open {
            top: 0;
            bottom: 0;
            min-height: 100%;
            background: color-mix(in srgb, var(--dmg-major) 18%, var(--panel));
        }

        .s-night-effects {
            display: flex;
            align-items: center;
            height: 23px;
            min-height: 23px;
            padding: 2px 0;
            box-sizing: border-box;
        }

        .s-night-equipment-list {
            display: flex;
            align-items: center;
            gap: 4px;
            height: 18px;
        }

        .s-night-effect {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 18px;
            color: var(--dim);
        }

        .s-night-effect.on { color: var(--sparkle); opacity: 1; }
        .s-night-effect.off { color: var(--dim); opacity: .34; }
        .s-night-effect.unknown { color: var(--text); opacity: .56; }
        .s-night-effect .g-icon { width: 20px; height: 20px; object-fit: contain; }

        .s-friendly-fleet {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 19px;
            height: 18px;
            margin-left: 2px;
            color: var(--dim);
            flex: 0 0 19px;
        }

        .s-friendly-fleet img {
            display: block;
            width: 18px;
            height: 18px;
            object-fit: contain;
        }

        .wanted-path {

        .wanted-foot {

        .akashi-link {
            font-size: 11px;
            color: #82ccdd;
            text-decoration: none;

        .akashi-link:hover {

        }

        /* 最新開發/改修結果看板：卡片式，與出擊分頁的資訊區塊同視覺層級 */
        .fac-card {
            border: 1px solid var(--line);

            gap: 8px;
            align-items: center;
            font-size: 12px;
            padding: 2px 0;
        }

        /* 紀錄列：沿用 .h-row 節奏（斑馬紋、圓角、11px） */
        .f-row {
            display: flex;
            gap: 8px;
            align-items: center;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
        }

        .f-row:nth-child(even) {
            background: var(--panel);
        }

        /* 種別徽章：開發／建造／改修（與 .h-rank 同語彙的描邊字） */
        .f-kind {
            width: 26px;
            text-align: center;
            flex: none;
            font-size: 10px;
            font-weight: 700;
            border: 1px solid var(--line);
            border-radius: 4px;
        }

        .f-kind.develop { color: #82ccdd; border-color: #82ccdd; }
        .f-kind.build { color: var(--dmg-mid); border-color: var(--dmg-mid); }
        .f-kind.improve { color: #c39bd3; border-color: #c39bd3; }
        .f-kind.speedup { color: var(--sparkle); border-color: var(--sparkle); }

        /* 投入資材（配方）：圖示＋數字成組，數字用等寬變體便於掃讀 */
        .f-res {
            display: inline-flex;
            gap: 5px;
            align-items: center;
            white-space: nowrap;
            font-size: 10px;
            color: var(--dim);
            font-variant-numeric: tabular-nums;
        }

        .f-res b {
            color: var(--text);
            font-weight: 600;
        }

        .f-ok { color: #58a55c; }
        .f-ng { color: var(--dmg-major); }
        .f-fail { color: var(--stub); }

        /* 改修等級變化：★n → ★n+1 */
        .f-lv {
            color: var(--sparkle);
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }

        .taiha-alert {
            background: rgba(224, 85, 85, 0.1);
            border: 1px solid var(--dmg-major);
            color: #ff6b6b;
            padding: 4px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            text-align: center;
            animation: pulse 2s infinite;
        }

        /* 大破警告定位在航空戰欄，絕對定位使戰況列高度不受警告狀態影響。 */
        .s-taiha {
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            bottom: 0;
            display: block;
            width: 100%;
            height: 100%;
            margin: 0;
            font-family: inherit;
            line-height: 1.3;
            box-sizing: border-box;
        }

        .s-taiha.open {
            /* 展開態只覆蓋航空戰格本身，避免壓住上方敵我欄標。 */
            top: 0;
            bottom: 0;
            min-height: 100%;
            /* 展開態要真的遮住底下的機數，故底色不透明（同 prefers-reduced-transparency
               的處理手法：把同色相混進 --panel 而不是疊在透明上）。 */
            background: color-mix(in srgb, var(--dmg-major) 18%, var(--panel));
        }

        .taiha-head {
            display: block;
        }

        /* 展開態讓字典裡的 \n 成為實際斷行。警告框只有約 180px 寬，中日文沒有空格可斷，
           全交給自動折行會把「大破艦」「強制返航」這種詞從中間切開，斷點必須由各語言
           自己決定（見 ui-i18n.ts；英文靠空格自然折行，不需要硬斷點）。
           文字隱藏態不顯示文案，紅框與航空戰欄位尺寸維持不變。 */
        .s-taiha.open .taiha-head,
        .s-taiha.open .taiha-hint {
            white-space: pre-line;
        }

        /* 一般大破點擊後只隱藏文字，紅框與原本占位維持不變。 */
        .s-taiha-generic {
            cursor: pointer;
        }

        .s-taiha.open.s-taiha-generic.details-hidden {
            background: transparent;
        }

        .s-taiha-generic.details-hidden .taiha-head,
        .s-taiha-generic.details-hidden .taiha-hint {
            display: none;
        }

        /* 退避提示（旗艦帶司令部施設時）：附在大破警告內的第二行，弱化成說明語氣——
           警告本身講「有轟沈風險」，這行講「還有一條路可走」，不該搶同樣的視覺強度。 */
        .taiha-hint {
            display: block;
            font-weight: normal;
            font-size: 11px;
            color: var(--dim);
        }

        /* 退避艦：整列淡出＋灰標。退避不是傷害等級，故刻意不用 --dmg-* 語意色
           （design-guidelines §4.5：語意色不跨功能挪用）。 */
        .ship.escaped {
            opacity: 0.5;
        }

        .esc-tag {
            margin-left: 4px;
            padding: 0 4px;
            border: 1px solid var(--line);
            border-radius: 6px;
            font-size: 9px;
            color: var(--dim);
            vertical-align: middle;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(224, 85, 85, 0.4); }
            70% { box-shadow: 0 0 0 6px rgba(224, 85, 85, 0); }
            100% { box-shadow: 0 0 0 0 rgba(224, 85, 85, 0); }
        }

        /* ── 無障礙偏好 ──
           減少動態不等於取消回饋，而是換成不會引發前庭不適的等效表現：
           大破警告是本面板最重要的即時訊號，脈動改為靜態強調光暈，警示強度不變。 */
        @media (prefers-reduced-motion: reduce) {
            .taiha-alert {
                animation: none;
                box-shadow: 0 0 0 3px rgba(224, 85, 85, 0.35);
            }

            #tabs button,
            .ab-tabs button {
                transition: none;
            }

            .ab-tabs button:active {
                transform: none;
            }
        }

        /* 降低透明：本面板的半透明底色（color-mix 疊到 transparent、警告框的 rgba）
           使用不透明底——同色相直接混進 --panel，色調維持一致但不透出底下內容。 */
        @media (prefers-reduced-transparency: reduce) {

            .ship-id .stype,
            .c-top .stype {
                background: color-mix(in srgb, var(--brass) 14%, var(--panel));
                border-color: color-mix(in srgb, var(--brass) 40%, var(--panel));
            }

            .fs-tick.mission {
                background: color-mix(in srgb, var(--brass) 12%, var(--panel));
            }

            .dock-mark {
                background: color-mix(in srgb, #7fd0ff 10%, var(--panel));
            }

            .timer-row .fleet-box,
            .ab-tabs button.on {
                background: color-mix(in srgb, var(--brass) 14%, var(--panel));
            }

            .s-drop {
                background: color-mix(in srgb, var(--line) 30%, var(--panel));
            }

            .s-drop.new {
                background: color-mix(in srgb, var(--sparkle) 12%, var(--panel));
            }

            /* `.s-taiha.open` 自己就用不透明底（要遮住機數），但選擇器比 .taiha-alert
               specific，這裡若不一併列出，收縮／展開兩態會有一態吃不到覆寫。 */
            .taiha-alert,
            .s-taiha.open {
                background: color-mix(in srgb, var(--dmg-major) 18%, var(--panel));
            }
        }

        /* 高對比：邊界改為明確可見、弱化文字提高亮度；深淺主題各自調整。
           大破警告使用實心底＋深色字，避免只靠淡紅底表示。 */
        @media (prefers-contrast: more) {
            :root {
                --line: #6b7a95;
                --dim: #a9b4c6;
                --stub: #7f8a9e;
            }

            :root[data-theme="light"] {
                --line: #8a8375;
                --dim: #4a5160;
                --stub: #7a8291;
            }

            /* 實心紅底：`.s-taiha.open` 的自帶底色選擇器較 specific，必須一併列出。 */
            .taiha-alert,
            .s-taiha.open {
                background: var(--dmg-major);
                color: #10151d;
            }

            /* 補充行使用主色再降透明度，
               維持「弱化成說明語氣」的層次但不犧牲可讀性。 */
            .taiha-alert .taiha-hint {
                color: inherit;
                opacity: 0.85;
            }

            #tabs button.on {
                color: var(--text);
                border-bottom-width: 3px;
            }

            /* 疲勞表情：11px 下線條細，高對比模式加粗描邊。SVG 尺寸不變，零版面影響。 */
            .ab-sq .cond-face * {
                stroke-width: 1.8;
            }

            /* 高對比模式：輪廓加粗、標籤改用主文字色。仍用 inset box-shadow，維持零版面影響
               ——這裡改 border-width 會讓量表在高對比下比一般模式高，狀態一切換就位移。 */
            .s-gauge.zansatsu .s-gauge-bar {
                box-shadow: inset 0 0 0 2px var(--sparkle);
            }

            .s-gauge.zansatsu .s-gauge-final {
                color: var(--text);
            }
        }

    </style>
</head>

<body>
    <div id="header"></div>
    <!-- 狀態橫幅：載入中／事件積壓／啟動失敗共用一條，永遠在最上方。空白面板配一句
         console 訊息是查不出原因的，任何「面板看起來壞了」的狀態都必須在畫面上說明。 -->
    <div id="notice" hidden></div>
    <div id="tabs"></div>
    <div id="tabpanel" class="has-general">
        <div id="tab-general">
            <div class="g-status">
                <div class="resblock" id="resline"></div>
                <div class="g-occ">
                    <div class="g-cat g-cat-exped" data-i18n-title="tab.exped" title="遠征">
                        <span class="t-tag tt-exped" data-i18n-title="tag.exped" title="遠"><img class="t-icon" src="/icons/ui/exped.svg" data-i18n-alt="tag.exped" alt="遠"></span>
                        <div id="missions"></div>
                    </div>
                    <div class="g-cat g-cat-dock" data-i18n-title="section.dock" title="入渠">
                        <span class="t-tag tt-dock" data-i18n-title="tag.dock" title="渠"><img class="t-icon" src="/icons/ui/dock.svg" data-i18n-alt="tag.dock" alt="渠"></span>
                        <div id="ndocks"></div>
                    </div>
                    <div class="g-cat g-cat-build" data-i18n-title="section.build" title="建造">
                        <span class="t-tag tt-build" data-i18n-title="tag.build" title="建"><img class="t-icon" src="/icons/ui/build.svg" data-i18n-alt="tag.build" alt="建"></span>
                        <div id="kdocks"></div>
                    </div>
                </div>
            </div>
            <div class="g-quest-block" data-i18n-title="section.quest" title="任務">
                <span class="t-tag tt-quest" data-i18n-title="tag.quest" title="任"><img class="t-icon" src="/icons/ui/quest.svg" data-i18n-alt="tag.quest" alt="任"></span>
                <div id="quests"></div>
            </div>
        </div>
        <div id="tab-exped" style="display:none">
            <div class="exped-controls">
                <span id="exped-fleet-label" class="badge"></span>
                <select id="exped-select"></select>
            </div>
            <div id="exped-check"></div>
        </div>
        <div id="tab-factory" style="display:none">
            <div class="fac-controls">
                <span class="grow"></span>
                <a class="akashi-link" href="https://akashi-list.me/" target="_blank" rel="noopener"
                    data-i18n="factory.akashiLink">明石の改修工廠 早見表 ↗</a>
            </div>
            <div id="factory-live"></div>
        </div>
        <div id="tab-order" style="display:none"></div>
        <div id="tab-activity" style="display:none">
            <h3 data-i18n="section.wanted">待驗證封包（自動擷取）</h3>
            <div id="wanted"></div>
            <h3 data-i18n="section.log">事件記錄</h3>
            <div id="log"></div>
        </div>
        <div id="tab-sortie" style="display:none">
            <div id="battle-content">
                <div style="color:var(--dim); padding:10px;" data-i18n="sortie.notEntered">尚未進入戰鬥。</div>
            </div>
        </div>
    </div>
    <div id="fleetnav"></div>
    <div id="fleets"></div>
    <div id="air-bases" style="display:none"></div>
    <script type="module" src="./main.ts"></script>
</body>

</html>
