        .ship.c .c-hp .hp-num {
            color: var(--text);
            font-size: 12px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .ship.c .c-hp .hp-max {
            color: var(--dim);
            font-size: 10px;
            font-variant-numeric: tabular-nums;
        }

        /* 當前 HP 數字與同列 HP 條共用損傷色；滿血仍沿用主文字色，總 HP 永遠維持淡色。 */
        .ship.st-minor .hp-num,
        .ship.c.st-minor .c-hp .hp-num {
            color: var(--dmg-minor);
        }

        .ship.st-mid .hp-num,
        .ship.c.st-mid .c-hp .hp-num {
            color: var(--dmg-mid);
        }

        .ship.st-major .hp-num,
        .ship.c.st-major .c-hp .hp-num {
            color: var(--dmg-major);
        }

        .ship.c .taiha-cond-toggle {
            width: auto;
            min-width: 2.4em;
            max-width: 3.2em;
            padding-inline: 1px;
            font-size: 12px;
            overflow: hidden;
        }

        .ship.c .taiha-cond-toggle .taiha-mark {
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ── 遠征：一列艦隊選擇、固定資源欄、分組條件 ── */
        .exped-header {
            display: grid;
            grid-template-columns: 48px minmax(0, 1fr);
            align-items: center;
            gap: 5px;
            margin-bottom: 4px;
            flex: none;
            min-width: 0;
        }

        .exped-fleet-lbl {
            font-size: 10px;
            font-weight: 600;
            color: var(--brass);
            letter-spacing: var(--track-label);
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
            text-align: center;
        }

        .exped-select {
            flex: 1;
            min-width: 0;
            background: var(--panel);
            color: var(--text);
            border: 1px solid var(--line);
            border-radius: 4px;
            font-size: 11.5px;
            font-weight: 600;
            padding: 1px 6px;
            height: 24px;
            outline: none;
            font-variant-numeric: tabular-nums;
            color-scheme: dark;
        }

        .exped-select option,
        .exped-select optgroup {
            background: var(--menu);
            color: var(--text);
            white-space: normal;
            overflow-wrap: anywhere;
        }

        :root[data-theme="light"] .exped-select {
            color-scheme: light;
        }

        .exped-select:focus-visible {
            border-color: var(--sparkle);
        }

        .exped-yields {
            flex: none;
            min-width: 0;
            margin: 0 0 4px;
            padding: 0 0 4px;
            border-bottom: 1px solid var(--line);
        }

        .exped-resource-matrix {
            width: 100%;
            table-layout: fixed;
            border-collapse: collapse;
            font-size: 10px;
        }

        .exped-resource-matrix col.exped-resource-stub,
        .exped-resource-matrix .exped-resource-stub {
            width: 112px;
        }

        .exped-resource-matrix th,
        .exped-resource-matrix td {
            padding: 0;
            vertical-align: middle;
        }

        .exped-resource-matrix .exped-resource-stub,
        .exped-resource-matrix .exped-resource-head {
            height: 19px;
            border-bottom: 1px solid var(--line);
        }

        .exped-resource-head {
            text-align: right;
            box-sizing: border-box;
            padding: 0 4px !important;
        }

        .exped-resource-head .m-icon {
            display: block;
            width: 16px;
            height: 16px;
            margin-left: auto;
            margin-right: 0;
            object-fit: contain;
        }

        .exped-outcome-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 3px;
            height: 21px;
            box-sizing: border-box;
            text-align: left;
            font-weight: 400;
            white-space: nowrap;
        }

        .exped-outcome-name {
            min-width: 0;
            color: var(--text);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: var(--track-body);
        }

        .exped-outcome-status {
            flex: none;
            font-size: 9px;
            line-height: 12px;
            font-weight: 500;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        .exped-outcome-status.ok {
            color: #58a55c;
        }

        .exped-outcome-status.ng {
            color: var(--dmg-major);
        }

        .exped-outcome-status.gs {
            color: var(--sparkle);
        }

        .exped-outcome-status.dim {
            color: var(--dim);
        }

        .exped-resource-matrix tbody tr + tr th,
        .exped-resource-matrix tbody tr + tr td {
            border-top: 1px solid var(--line);
        }

        .exped-resource-value {
            height: 21px;
            box-sizing: border-box;
            padding: 0 4px !important;
            color: var(--text);
            text-align: right;
            font-size: 12px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        .exped-value-empty {
            color: var(--dim);
            font-weight: 400;
        }

        .exped-reward-unverified {
            height: 21px;
            padding: 2px 5px !important;
            color: var(--dim);
            text-align: right;
            font-size: 9px;
            line-height: 12px;
            overflow-wrap: anywhere;
        }

        .exped-items-row {
            display: grid;
            grid-template-columns: 112px minmax(0, 1fr);
            align-items: center;
            column-gap: 4px;
            margin-top: 2px;
            min-width: 0;
        }

        .exped-items-label {
            color: var(--dim);
            font-size: 10px;
            line-height: 12px;
            font-weight: 500;
            white-space: nowrap;
        }

        .exped-items-line {
            display: flex;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 2px 7px;
            min-width: 0;
            color: var(--text);
            font-size: 10px;
            line-height: 12px;
        }

        .exped-items-line .item-reward {
            display: inline-flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 0 3px;
            min-width: 0;
            max-width: 100%;
        }

        .exped-items-line .item-name {
            color: var(--text);
            font-weight: 500;
            overflow-wrap: anywhere;
        }

        .exped-items-line .item-note {
            color: var(--dim);
            font-size: 10px;
            font-weight: 400;
            font-variant-numeric: tabular-nums;
            overflow-wrap: anywhere;
        }

        .exped-items-line .item-note.gs {
            color: var(--sparkle);
            font-weight: 500;
        }

        .exped-conditions {
            display: flex;
            flex: 1;
            flex-direction: column;
            gap: 4px;
            min-height: 0;
            overflow: hidden;
        }

        .exped-check-tier {
            flex: none;
            min-width: 0;
        }

        .exped-check-tier + .exped-check-tier {
            padding-top: 3px;
            border-top: 1px solid var(--line);
        }

        .exped-tier-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            min-height: 15px;
            height: auto;
            margin: 0 0 2px;
            padding: 0;
            border: 0;
            color: var(--dim);
            font-size: 11px;
            line-height: 15px;
            font-weight: 500;
            letter-spacing: var(--track-label);
            white-space: nowrap;
        }

        .exped-tier-count {
            color: var(--dim);
            font-weight: 400;
            letter-spacing: 0;
            font-variant-numeric: tabular-nums;
        }

        .exped-tier-count.has-unmet {
            color: var(--dmg-major);
            font-weight: 500;
        }

        .exped-check-group {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            align-content: start;
            align-items: start;
            column-gap: 10px;
            row-gap: 4px;
            min-width: 0;
        }

        .check-row {
            display: grid;
            grid-template-columns: 11px minmax(0, 1fr) max-content;
            align-items: start;
            gap: 0 4px;
            min-width: 0;
            min-height: 0;
            margin: 0;
            padding: 0;
            border: 0;
            border-radius: 0;
            background: transparent;
            font-size: 10px;
            line-height: 13px;
        }

        .check-row .mark {
            grid-column: 1;
            width: 11px;
            color: var(--dim);
            text-align: center;
            font-size: 9px;
            font-weight: 700;
            line-height: 13px;
        }

        .check-row.ok .mark {
            color: #58a55c;
        }

        .check-row.ng .mark {
            color: var(--dmg-major);
        }

        .check-row .grow {
            grid-column: 2;
            min-width: 0;
            color: var(--text);
            font-weight: 400;
            white-space: normal;
            overflow: visible;
            text-overflow: clip;
            overflow-wrap: anywhere;
            padding-inline-end: 2px;
            line-height: 13px;
        }

        .check-row.ng .grow {
            color: var(--dmg-mid);
            font-weight: 500;
        }

        .check-row .num {
            grid-column: 3;
            color: var(--dim);
            text-align: right;
            font-size: 9.5px;
            font-weight: 400;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        .check-row.ng .num,
        .check-row .num.ng {
            color: var(--dmg-major);
            font-weight: 600;
        }

        .exped-warning {
            grid-column: 1 / -1;
            display: flex;
            align-items: baseline;
            gap: 4px;
            min-width: 0;
            color: var(--dim);
            font-size: 9.5px;
            line-height: 12px;
            overflow-wrap: anywhere;
        }

        .exped-warning > span {
            flex: none;
            font-weight: 600;
        }

        .exped-resource-matrix .sr-only,
        .check-row .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        /* ── 基地航空隊 ──
           版面硬約束：一個海域最多三隊、一隊最多四個中隊，**三隊必須在不捲動的前提下
           全部看得完**（LBAS 區塊與 #fleets 共用同一塊可用高度，約 440px）。現行排法為
           (a) 隊名＋制空＋半徑＋行動徽章併成單行 `.ab-head1`、(b) 四個中隊採 2×2 雙欄
           `.ab-sq-grid`、(c) 卡片與列距收緊，以保留多隊同時可見的高度。
           這樣可讓多隊同時顯示，不必依賴內容捲動才能查看完整資訊。 */
        /* `.air-bases` 同列：離線預覽一頁要放多個 LBAS 區塊，id 只能有一個 */
        #air-bases,
        .air-bases {
            padding: 6px 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .ab-tabs {
            display: flex;
            gap: 6px;
            overflow-x: auto;
        }

        .ab-tabs button {
            background: none;
            border: 1px solid var(--line);
            color: var(--dim);
            border-radius: 5px;
            padding: 4px 10px;
            font-size: 11px;
            cursor: pointer;
            white-space: nowrap;
        }

        .ab-tabs button.on {
            color: var(--text);
            border-color: var(--brass);
            background: color-mix(in srgb, var(--brass) 14%, transparent);
        }

        .ab-tabs button:active {
            color: var(--text);
            border-color: var(--brass);
            transform: scale(.97);
        }

        .ab-area-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: var(--track-label);
            color: var(--brass);
            border-bottom: 1px solid var(--line);
            padding-bottom: 4px;
            margin: 0;
        }

        .ab-maintenance {
            color: var(--dim);
            font-size: 10px;
            font-weight: 500;
            letter-spacing: normal;
            white-space: nowrap;
        }

        .ab-card {
            background: var(--panel);
            border-radius: 6px;
            padding: 5px 8px;
            border: 1px solid var(--line);
        }

        /* 抬頭列：隊名｜制空・半徑｜行動徽章。制空/半徑刻意與隊名同列——它們是掃視用的
           兩個數字，獨立成列只是多吃 23px。baseline 對齊讓 12px 隊名與 10px 數字齊腳。 */
        .ab-head1 {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 4px;
        }

        .ab-head1 .ab-name {
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }

        .ab-head1 .grow {
            flex: 1;
        }

        .ab-action {
            font-size: 10px;
            padding: 1px 8px;
            border-radius: 8px;
            font-weight: 600;
        }

        .ab-action.act-0 {
            color: var(--dim);
            border: 1px solid var(--line);
        }

        /* 待機 */
        .ab-action.act-1 {
            color: #ff6b6b;
            border: 1px solid #ff6b6b;
        }

        /* 出撃 */
        .ab-action.act-2 {
            color: #51cf66;
            border: 1px solid #51cf66;
        }

        /* 防空 */
        .ab-action.act-3 {
            color: var(--stub);
            border: 1px solid var(--stub);
        }

        /* 退避 */
        .ab-action.act-4 {
            color: #74c0fc;
            border: 1px solid #74c0fc;
        }

        /* 休息 */

        .ab-inline-stats {
            font-size: 10px;
            color: var(--dim);
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        .ab-inline-stats b {
            color: var(--text);
            font-weight: 600;
        }

        /* 中隊 2×2：一隊四個中隊排成兩列兩欄，比逐列排省 48px/卡。
           `min-width: 0` **不可拿掉**——grid item 預設 `min-width: auto` 會被最長的中隊名
           （如「一式戦 隼III型甲(54戦隊)」）撐破卡片右緣，機數與疲勞標記會被切掉。 */
        .ab-sq-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            column-gap: 6px;
        }

        .ab-sq {
            display: flex;
            gap: 6px;
            align-items: center;
            padding: 1px 3px;
            border-radius: 4px;
            font-size: 11px;
            min-width: 0;
        }

        .ab-sq>* {
            min-width: 0;
        }

        /* 斑馬紋：雙欄下 `nth-child(odd)` 會變成左右交錯（讀起來像壞掉），以上排為一組 */
        .ab-sq-grid .ab-sq:nth-child(-n+2) {
            background: color-mix(in srgb, var(--line) 40%, transparent);
        }

        .ab-sq .sq-chip {
            display: inline-flex;
            align-items: center;
            gap: 1px;
            font-size: 10px;
            line-height: 1;
            padding: 2px 4px;
            border-radius: 3px;
            background: var(--line);
            white-space: nowrap;
        }

        /* 顏色與編成 chip 一致：1–3 直條 --alv-bar、4–7 --sparkle；改修藍。 */
        .ab-sq .sq-chip b {
            color: #7fd0ff;
            font-weight: 600;
            margin-left: 1px;
        }

        .ab-sq .sq-chip u {
            text-decoration: none;
            color: var(--sparkle);
            margin-left: 1px;
        }

        .ab-sq .sq-name {
            flex: 1;
            min-width: 0;
            line-height: 1.3;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .ab-sq .sq-count {
            font-size: 10px;
            font-variant-numeric: tabular-nums;
            color: var(--dim);
        }

        .ab-sq .sq-count.depleted {
            color: var(--dmg-major);
        }

        /* 雙欄下欄寬只剩一半，疲勞標記不再預留固定寬（`min-width` 會再吃掉中隊名的空間） */
        .ab-sq .sq-cond {
            font-size: 10px;
            text-align: right;
            white-space: nowrap;
        }

        /* 疲勞標記的表情（見 main.ts `condFaceSvg` 的理由說明）。
           **必須是內聯 SVG**——走 `<img src>` 時 SVG 是獨立文件、吃不到這裡的 CSS，
           就無法用 currentColor 沿用下面 .cond-tired／.cond-exhausted 的語意色。 */
        .ab-sq .sq-cond.face {
            display: inline-flex;
            align-items: center;
            flex: none;
        }

        .ab-sq .cond-face {
            width: 11px;
            height: 11px;
            display: block;
        }

        /* 輕度疲勞（api_cond 1）：**遊戲本身不顯示任何標記**，所以這裡只給一顆空心小點，
           顏色走 --dim（不是警示色）。它回答的是「還沒到黃臉、但已經不是全滿」——
           KC3Kai 同樣把「全滿」與「輕度疲勞」分成兩種表情。
           ⚠️ 不可升級成臉或警示色：那會比遊戲本身還吵，屬過度提醒。 */
        .ab-sq .sq-cond.mild {
            display: inline-flex;
            align-items: center;
            flex: none;
            color: var(--dim);
        }

        .ab-sq .sq-cond.mild .cond-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            border: 1.5px solid currentColor;
        }

        /* 「可能已回復但不能斷定」：淡化＋去掉臉的填色，讓它明顯不是斷言。
           遊戲的疲勞回復不送封包，出撃札的橙 3 分鐘就可能退掉、卻要 30 分鐘才能確定
           （見 utils/lbas-cond.ts）；那段期間畫實心臉等於拿不確定的事當事實講。
           ⚠️ 只淡化、**不可直接不顯示**——「不能斷定」不等於「已經回復」，
           拿掉是把仍疲勞的中隊謊報成正常，那是更危險的方向。 */
        .ab-sq .sq-cond.face.unsure {
            opacity: .55;
        }

        .ab-sq .sq-cond.face.unsure .cond-face circle[fill],
        .ab-sq .sq-cond.face.unsure .cond-face path[fill="none"] {
            opacity: .7;
        }

        /* 與編成列的基地航空隊鈕同一個變數：同一個「輕度疲勞」語意只有一個色源 */
        .ab-sq .sq-cond.cond-tired {
            color: var(--lbas-tired);
        }

        .ab-sq .sq-cond.cond-exhausted {
            color: var(--dmg-major);
        }

        .ab-sq .sq-cond.cond-unknown {
            color: var(--stub);
        }

        /* 未配備只是佔位訊息，不需要跟已配備列一樣高 */
        .ab-sq.empty-sq {
            color: var(--stub);
            font-style: italic;
            font-size: 10px;
            padding: 0 3px;
        }

        /* ── 出擊 (Sortie) ── */
        .sortie-container {
            padding: 4px 6px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            background: rgba(10, 20, 30, 0.4);
            border-radius: 6px;
            margin: 0;
        }

        .s-header {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .s-map-id {
            color: var(--sparkle);
            font-size: 13px;
            font-weight: 900;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
            white-space: nowrap;
        }

        /* 活動難度徽章（甲乙丙丁）：貼在 E{n} 後面，字級小一階、不搶海域代號的視覺重量 */
        .s-map-id > i {
            margin-left: 3px;
            font-style: normal;
            font-size: 10px;
            font-weight: 700;
            color: var(--brass);
        }

        /* 未出擊時的關卡量表列（見 main.ts mapGaugeListHtml）。出擊資訊欄的釘死版面只在
           真的進入出擊後才成立，這一態是空畫面，可自由用一般流排版。 */
        .s-standby {
            padding: 10px;
        }

        .s-standby-hint {
            color: var(--dim);
        }

        .s-standby-maps {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 10px;
        }

        .s-standby-map {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 海域代號欄寬對齊，量表左緣才不會隨 E1／E2 長度參差 */
        .s-standby-map > .s-map-id {
            min-width: 44px;
        }

        /* 關卡進度：緊湊量表（擊破數式／HP量表式），或已攻略/未攻略/鎖定小標記 */
        .s-gauge {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* 圓矩 pill：殘量條當背景，剩餘實數（2760/4600）直接寫在條子裡。
           軌道色刻意固定為深色調（亮色主題也不轉淺）——條子裡是白字，軌道一淺
           就會有一半數字讀不到；這是可讀性需求，不是配色偏好。 */
        .s-gauge-bar {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            width: 50px;
            min-width: 50px;
            height: 13px;
            padding: 0;
            background: var(--gauge-track);
            border-radius: 7px;
            overflow: hidden;
            flex: none;
        }

        .s-gauge-bar > i {
            position: absolute;
            inset: 0;
            right: auto;
            background: linear-gradient(90deg, var(--dmg-major), var(--sparkle));
        }

        .s-gauge-num {
            position: relative;
            display: inline-flex;
            align-items: baseline;
            font-size: 9px;
            font-weight: 700;
            line-height: 1;
            color: var(--text);
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        .s-gauge-num strong {
            color: var(--text);
            font-size: 10px;
            font-weight: 800;
        }

        .s-gauge-num small {
            color: var(--dim);
            font-size: 8px;
            font-weight: 650;
        }

        .s-gauge.zansatsu .s-gauge-num strong {
            color: var(--dmg-major);
        }

        /* 斬殺期：不能只換量表顏色，狀態標籤也**不可以是外掛的
           第二顆徽章**——兩顆並排會把標題列撐寬，`.s-header` 是 flex-wrap，撐過去就換行，
           換行就多一整列、把下面釘死的出擊資訊往下推到要捲動（出擊資訊欄硬約束）。
           故標籤併進量表本體，成為條子裡「斬殺期 840/4840」的一段。

           **高度與一般狀態完全相同（13px）**：狀態一變高度就變，量表所在的標題列會跟著
           長高、整個編成往下位移，而斬殺期正是最需要盯著版面不動的時候。輪廓因此改用
           inset box-shadow（不佔版面、不吃 border-box），維持 height 與 border-box 不變。 */
        .s-gauge-final {
            position: relative;
            font-size: 9px;
            font-weight: 700;
            line-height: 1;
            letter-spacing: 0;
            white-space: nowrap;
            color: color-mix(in srgb, var(--sparkle) 72%, #fff);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
        }

        .s-gauge.zansatsu .s-gauge-bar {
            box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--sparkle) 72%, transparent);
        }

        .s-gauge.zansatsu .s-gauge-bar > i {
            background: repeating-linear-gradient(
                135deg,
                color-mix(in srgb, var(--sparkle) 76%, var(--gauge-track)) 0 5px,
                color-mix(in srgb, var(--sparkle) 52%, var(--gauge-track)) 5px 10px
            );
        }

        .s-gauge.cleared,
        .s-gauge.uncleared,
        .s-gauge.locked {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            font-size: 10px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--line);
        }

        .s-gauge.cleared {
            color: #58a55c;
            border-color: #58a55c;
        }

        .s-gauge.locked {
            font-size: 9px;
            color: var(--dim);
        }

        .s-gauge.uncleared {
            color: var(--dim);
        }

        /* 節點軌跡：緊湊、不撐滿，避免擠壓戰鬥資訊。 */
        .s-nodes {
            display: flex;
            gap: 3px;
            align-items: center;
            flex: 0 1 auto;
            flex-wrap: wrap;
        }

        .s-node {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #1a1a1a;
            border: 1px solid #555;
            color: #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8px;
            font-weight: bold;
            position: relative;
        }

        .s-node.visited {
            background: #8b0000;
            border-color: #ff4444;
            color: white;
            box-shadow: 0 0 4px rgba(255,0,0,0.5);
        }

        .s-node.boss::after {
            content: 'W';
            position: absolute;
            top: -8px;
            color: #ff4444;
            font-size: 10px;
            transform: scaleX(1.5);
        }

        .s-enemies {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .s-enemy-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 26px;
            gap: 2px;
        }

        .s-enemy-icon {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #333;
            border: 1px solid #777;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
            color: white;
            background-size: cover;
            background-position: center;
        }

        .s-enemy-hp {
            width: 100%;
            height: 3px;
            background: #222;
        }
        .s-enemy-hp i {
            display: block;
            height: 100%;
            background: #58a55c;
        }

        /* 出擊戰鬥資訊：左側敵艦晶片（隨伴／主隊）、右側索敵與戰爆固定並排在同一個
           165px 高的 row（=6 艘晶片的高度），不論敵艦是 1 艘還是連合艦隊 12 艘，
           索敵/戰爆/下面的陣形支援列都不會跟著移動。s-eside 用 space-between，
           上緣＝索敵區接晶片頂、下緣＝戰爆區接晶片底（不是跟「主隊/隨伴」文字對齊）。
           **不准改成隨內容收縮**——陣型／支援／友軍列必須釘死（CLAUDE.md 出擊面板）。 */
        .s-battle-row {
            display: grid;
            grid-template-columns: 1.35fr 1fr;
            grid-template-rows: auto 165px;
            column-gap: 8px;
        }

        .s-efleet-heads {
            grid-column: 1;
            grid-row: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0 6px;
        }

        /* 敵方只有單一艦隊（無隨伴）時橫向填滿，不留一半空白 */
        .s-efleet-heads.single {
            grid-template-columns: 1fr;
        }

        .s-efleet-body {
            grid-column: 1;
            grid-row: 2;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: minmax(0, 1fr);
            gap: 4px 6px;
            align-content: stretch;
            /* 欄體固定填滿敵方資訊列；每個 chip 由欄高平均分配，避免底部留下空白 */
            overflow: hidden;
        }

        .s-efleet-body.single {
            grid-template-columns: 1fr;
        }

        .s-ecol-h {
            font-size: 10px;
            letter-spacing: var(--track-label);
            color: var(--brass);
            border-bottom: 1px solid var(--line);
            padding-bottom: 2px;
            margin-bottom: 2px;
        }

        .s-ecol-body {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            gap: 2px;
            height: 100%;
            min-height: 0;
            min-width: 0;
        }

        .s-echip {
            display: flex;
            flex: 0 0 25px;
            flex-direction: column;
            justify-content: space-between;
            background: var(--panel);
            border: .5px solid var(--line);
            border-radius: 4px;
            box-sizing: border-box;
            padding: 3px 5px 2px;
            min-width: 0;
            min-height: 25px;
            height: 25px;
        }

        .s-echip.sunk {
            opacity: .5;
        }

        .s-echip-name {
            display: block;
            font-size: 10.5px;
            line-height: 1.2;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .s-echip.sunk .s-echip-name {
            text-decoration: line-through;
            color: var(--dim);
        }

        .s-echip-hp {
            display: block;
            flex: 0 0 4px;
            height: 4px;
            background: var(--line);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 2px;
        }

        .s-echip-hp>i {
            display: block;
            height: 100%;
        }

        /* 右側：索敵/航向/觸接/航空戰（置中、橘色 --stat-mini）＋我方/敵方戰爆
           （置中，戰綠/爆紅配色與「我方/敵方」金色標題維持不變）。 */
        .s-eside {
            grid-column: 2;
            grid-row: 2;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-width: 0;
        }

        .s-stats-mini {
            display: flex;
            flex-direction: column;
            gap: 3px;
            font-size: 11px;
        }

        .s-stats-mini .s-stat-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .s-stats-mini .lbl {
            color: var(--dim);
        }

        .s-stats-mini .val {
            color: var(--stat-mini);
        }

        .s-stats-mini .val.bad {
            color: var(--dmg-major);
        }

        /* 敵我方機數的定位容器：大破警告靠它做 absolute 定位（見 .s-taiha）。
           容器本身不設任何尺寸，高度完全由 .s-air-mini 撐出——警告展開時要「剛好蓋住
           機數表格」，靠的就是這個等高關係。 */
        .s-air-wrap {
            position: relative;
        }

        /* 警告展開時把機數藏起來（保留佔位，容器高度不變＝上方的索敵/航向列不會位移）。
           光靠警告框的不透明底也遮得住，但 visibility 讓「被遮住」變成確定的事，
           不受日後底色調整影響。 */
        .s-air-wrap.covered .s-air-loss-grid {
            visibility: hidden;
        }

        .s-air-mini {
            display: grid;
            grid-template-columns: auto 1fr 1fr;
            gap: 2px 10px;
            font-size: 10.5px;
            align-items: center;
        }

        .s-air-mini .hd {
            color: var(--sparkle);
            font-weight: 700;
            text-align: center;
            font-size: 11px;
        }

        .s-air-mini .rowlbl {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .s-air-mini>span:not(.rowlbl) {
            text-align: center;
        }

        .s-air-icon {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #333;
            display: inline-block;
            text-align: center;
            line-height: 14px;
            font-size: 9px;
        }

        .s-air-lost {
            color: #ff6b6b;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            margin-left: 2px;
        }

        /* 艦種縮寫（編成艦名前綴）：單隊是 .ship-body 直屬莖，聯合檢視則是 .c-top，
           兩者共用同一份徽章規則。 */
        .ship-kind-status > .stype,
        .c-top .stype {
            display: inline-block;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: var(--track-tag);
            color: var(--brass);
            background: color-mix(in srgb, var(--brass) 14%, transparent);
            border: 1px solid color-mix(in srgb, var(--brass) 40%, transparent);
            border-radius: 3px;
            /* 右內距扣掉一個字距：letter-spacing 在最後一字後也會留白，
               窄徽章內不補償會讓文字看起來偏左 */
            padding: 0 calc(3px - var(--track-tag)) 0 3px;
            /* 單隊艦種莖靠 grid column-gap、聯合欄靠 .c-top flex gap 控制組距；
               不可再加外距，否則單隊與聯合欄都會出現雙倍間隔。 */
            margin-right: 0;
            vertical-align: baseline;
            font-variant-numeric: tabular-nums;
        }

        /* 固定寬度＋置中：縮寫本身長度不一（DD 2字 vs CVL 3字），寬度隨文字伸縮的話
           每艘艦的艦名起始 x 位置都不同，整個艦隊列表看起來參差不齊。32px 能容納
           艦種縮寫並與聯合檢視 .ship.c .stype 共用，兩種檢視視覺一致。 */
        .ship-kind-status > .stype {
            width: 32px;
            text-align: center;
        }

        /* 編成狀態標籤：遠征是艦隊狀態，入渠是單艦狀態；兩者使用同樣緊湊的標籤骨架，
           以色別區分而不是只留一段沒有邊界的文字。 */
        .fs-tick.mission,
        .dock-mark {
            display: inline-flex;
            align-items: center;
            flex: none;
            box-sizing: border-box;
            min-height: 15px;
            padding: 0 4px;
            border: 1px solid var(--line);
            border-radius: 3px;
            font-size: 9px;
            font-weight: 700;
            line-height: 1.2;
            letter-spacing: var(--track-tag);
            white-space: nowrap;
        }

        .fs-tick.mission {
            color: var(--brass);
            border-color: color-mix(in srgb, var(--brass) 58%, var(--line));
            background: color-mix(in srgb, var(--brass) 12%, transparent);
        }

        .dock-mark {
            color: #7fd0ff;
            border-color: color-mix(in srgb, #7fd0ff 52%, var(--line));
            background: color-mix(in srgb, #7fd0ff 10%, transparent);
        }

        /* 遠征艦隊編號：比照編成選擇按鈕（僅數字） */
        .timer-row .fleet-box {
            font-size: 12px;
            color: var(--text);
            border: 1px solid var(--brass);
            border-radius: 5px;
            padding: 1px 9px;
            background: color-mix(in srgb, var(--brass) 14%, transparent);
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }

        /* 陣形/支援/対空CI/夜戰/rank/友軍 一列＋Drop（掉落艦名）：放大圖示、
           位置固定在敵艦晶片區下方，不隨敵艦數量位移。 */
        .s-icons-full {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .s-icon-cluster {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .s-icon {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #222;
            border: 1px solid #555;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9.5px;
            line-height: 1.05;
            color: #aaa;
            text-align: center;
        }

        /* 基地航空隊戰果圈：上排對敵傷害、下排損失機數，兩行塞進同一顆 30px 圈
           （line-height 1.05 × 兩行 ≈ 20px，放得下）。逐波明細在 title。 */
        .s-icon.lbas {
            flex-direction: column;
            font-variant-numeric: tabular-nums;
        }

        .s-icon.lbas .s-lbas-dmg {
            font-weight: 700;
        }

        .s-icon.active { color: #82ccdd; border-color: #82ccdd; }
        .s-icon.predicted { border-style: dashed; }
        .s-icon.rank-ss { color: #ffe066; border-color: #ffe066; font-size: 14px; font-weight: bold; text-shadow: 0 0 4px rgba(255,224,102,0.6); }
        .s-icon.rank-s { color: #f1c40f; border-color: #f1c40f; font-size: 15px; font-weight: bold; }
        .s-icon.rank-a { color: #e74c3c; border-color: #e74c3c; font-size: 15px; font-weight: bold; }
        .s-icon.rank-b { color: #d35400; border-color: #d35400; font-size: 15px; font-weight: bold; }
        .s-icon.rank-c { color: #95a5a6; border-color: #7f8c8d; font-size: 15px; font-weight: bold; }
        .s-icon.rank-d { color: #7f8c8d; border-color: #566060; font-size: 15px; font-weight: bold; }

        /* 打撈晶片：**金色只留給「本鎮守府還沒有的船」**。每一場都上色的話，看到金色
           的第一反應會是「又是同一批」，真正的新船就淹沒在裡面了；已持有的改用一般
           文字色與中性框，資訊照給、不搶注意力。 */
        .s-drop {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: color-mix(in srgb, var(--line) 30%, var(--panel));
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 2px 8px 2px 4px;
        }

        .s-drop.new {
            background: color-mix(in srgb, var(--sparkle) 12%, var(--panel));
            border-color: var(--sparkle);
        }

        .s-drop-tag {
            font-size: 8px;
            font-weight: 700;
            letter-spacing: var(--track-tag);
            color: #10151d;
            background: var(--dim);
            border-radius: 8px;
        /* 右內距扣掉一個字距，避免窄徽章文字視覺偏左。 */
            padding: 1px calc(5px - var(--track-tag)) 1px 5px;
        }

        .s-drop.new .s-drop-tag {
            background: var(--sparkle);
        }

        .s-drop-name {
            font-size: 11px;
            font-weight: 600;
            color: var(--text);
            white-space: nowrap;
        }

        .s-drop.new .s-drop-name {
            color: var(--sparkle);
        }

        /* ── 出擊定版覆寫 ───────────────────────────────────────────────
           正式 panel 與離線 panel-sortie 預覽共用這個 370×270 出擊資訊比例：左側是
           戰況卡，右側是敵方主隊／隨伴晶片；最下方固定為五項系統訊號＋掉落格。
           這段只覆寫出擊元件，避免影響紀錄分頁的同名 chip。 */
        .sortie-container {
            height: 258px;
            max-height: 258px;
            padding: 0 6px 4px;
            gap: 0;
            overflow: hidden;
            background: transparent;
        }

        .s-header {
            height: 21px;
            min-height: 21px;
            flex: none;
            gap: 5px;
            flex-wrap: nowrap;
            overflow: hidden;
        }

        .s-map-id {
            padding: 2px 4px;
            border-radius: 2px;
            line-height: 14px;
        }

        .s-gauge {
            min-width: 0;
            flex: 0 0 auto;
        }

        .s-gauge.zansatsu .s-gauge-bar {
            background: var(--gauge-track);
            box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--dmg-major) 82%, var(--line));
        }

        .s-gauge.zansatsu .s-gauge-bar > i {
            background: var(--dmg-major);
            opacity: .86;
        }

        .s-nodes {
            gap: 2px;
            min-width: 0;
            overflow: hidden;
            flex-wrap: nowrap;
            flex: 1 1 auto;
            /* 當前節點的藍綠／紅色光暈不能被容器左右緣裁掉；內距只佔節點列自身空間，
               不改變量表或戰鬥資訊欄的外部幾何。 */
            padding-inline: 4px;
            box-sizing: border-box;
        }

        .s-node.boss {
            width: 17px;
            height: 21px;
            padding: 0;
            border: 0;
            background: transparent;
            position: relative;
            top: 0;
            box-shadow: none;
            isolation: isolate;
        }

        .s-node.boss::before,
        .s-node.boss::after {
            display: none;
        }

        .s-node.boss .s-boss-node-svg {
            display: block;
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .s-node.boss .s-boss-head {
            fill: #3a1515;
            stroke: #250909;
            stroke-width: 4.5px;
            stroke-linejoin: round;
            stroke-linecap: round;
        }

        .s-node.boss .s-boss-letter {
            fill: #b09090;
            font-family: system-ui, sans-serif;
            font-size: 50px;
            font-weight: 900;
        }

        .s-node.boss.visited .s-boss-head {
            fill: #9e3030;
            stroke: #ec4b3f;
            filter: drop-shadow(0 0 2px rgba(236, 75, 63, .44));
        }

        .s-node.boss.visited .s-boss-letter {
            fill: #ffd9d4;
        }

        /* 所有 node 共用 21px 的垂直文字框；一般 node 仍以圓形內圈呈現，
           讓圓形字母基準與含角的 boss 字母一致，不因外框高度不同而上下跳動。 */
        .sortie-container .s-node:not(.boss) {
            width: 16px;
            height: 21px;
            padding: 2.8px 0 0;
            box-sizing: border-box;
            border: 0;
            border-radius: 0;
            background: transparent;
            position: relative;
            top: 0;
            box-shadow: none;
        }

        .sortie-container .s-node:not(.boss)::before {
            content: '';
            position: absolute;
            left: 0;
            top: 3.9px;
            width: 16px;
            height: 16px;
            box-sizing: border-box;
            border: 1px solid #555;
            border-radius: 50%;
            background: #1a1a1a;
            box-shadow: none;
            z-index: -1;
        }

        .sortie-container .s-node:not(.boss).visited::before {
            border-color: #ff4444;
            background: #8b0000;
            box-shadow: 0 0 4px rgba(255, 0, 0, .38);
        }

        /* 節點狀態沿用遊戲／KC3Kai 的語意色：非戰鬥藍、能動分歧白；

        .sortie-container .s-node:not(.boss).no-battle::before {

        .s-priority-row {

        .s-priority-item.good b { color: #58a55c; }

        .s-rank-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) max-content;

        .s-rank-row::before { top: 0; border-width: 1px 0 0; }
        .s-rank-row::after { bottom: 0; border-width: 0 0 1px; }

        .s-rank-result {

        .s-rank-grade {

            font-style: normal;
            line-height: 1;

        /* 戰果字樣沿用遊戲 Result 的各 rank 色相與斜體襯線字形：SS／S 金、A 紅、B 橙、
           C 金黃、D 綠、E 藍。 */
        .s-rank-grade.rank-ss { color: #ffe066; }
        .s-rank-grade.rank-s { color: #f3d342; }
        .s-rank-grade.rank-a { color: #ef4b3f; }
        .s-rank-grade.rank-b { color: #ed762e; }
        .s-rank-grade.rank-c { color: #e8d047; }
        .s-rank-grade.rank-d { color: #4fc363; }
        .s-rank-grade.rank-e { color: #4d8ee8; }

        .s-rank-name {
            min-width: 0;
            overflow: hidden;
            color: var(--text);
            font-size: 9.5px;
            letter-spacing: -.03em;
            font-weight: 650;
            line-height: 1.1;
            display: -webkit-box;

        .s-formation-compact {

            font-weight: 700;
            line-height: 1;

        .s-formation-icon {
            display: block;
            width: 22px;
            height: 22px;

            color: var(--brass);

        }

        .s-air-wrap {

            height: 44px;
            min-height: 44px;
            margin: 0;
            overflow: hidden;
        }

        .s-air-loss-grid {
            display: grid;
            grid-template-rows: 9px repeat(2, 13px);
            gap: 1px 0;
            height: 100%;
            min-height: 0;
            padding: 0;
            box-sizing: border-box;
            align-content: center;
        }

        .s-air-loss-head,
        .s-air-loss-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 20px minmax(0, 1fr);
            align-items: center;

        }

        .s-air-loss-head {
            color: #dfb95f;
            font-size: 8.5px;
            line-height: 1;
            text-align: center;
        }

        .s-air-loss-head span { color: var(--dim); }
        .s-air-loss-head b { font-weight: 700; }

        .s-air-kind {
            color: var(--dim);
            font-size: 8px;
            text-align: center;
            line-height: 1;
        }

        .s-air-kind.fighter { color: #58a55c; }
        .s-air-kind.bomber { color: var(--dmg-major); }

        .s-air-loss-cell {
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 2px;
            min-width: 0;
            font-size: 10px;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }

        .s-air-loss-cell b { color: var(--text); font-weight: 700; font-size: 10px; }
        .s-air-loss-cell i { color: var(--dmg-major); font-size: 8px; font-style: normal; font-weight: 700; }

        .s-air-loss-cell.friendly b { color: var(--text); }
        .s-air-loss-cell.enemy b { color: var(--text); }

        .s-air-loss-grid + .s-taiha {
            inset: 0;
            height: 100%;
        }

        .s-taiha {
            left: 0;
            right: 0;
            width: 100%;
            z-index: 3;
        }

        .s-taiha.open {
            top: 0;
            bottom: 0;
            min-height: 100%;
            overflow: hidden;
            background: color-mix(in srgb, var(--dmg-major) 18%, var(--panel));
        }

        .s-night-effects {
            display: flex;
            align-items: center;
            height: 23px;
            min-height: 23px;
            padding: 2px 0;
            box-sizing: border-box;
        }

        .s-night-equipment-list {
            display: flex;
            align-items: center;
            gap: 4px;
            height: 18px;
        }

        .s-night-effect {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 18px;
            color: var(--dim);
        }

        /* 與友軍錨同一套退場語言：未發動與狀態未知都轉灰階，只有發動時顯示裝備原色；
           夜偵圖示隨觸接機 master 變動，所以灰圖由同一張圖套濾鏡產生，不另備檔。 */
        .s-night-effect.on { color: var(--sparkle); opacity: 1; filter: drop-shadow(0 0 3px color-mix(in srgb, var(--sparkle) 65%, transparent)); }
        .s-night-effect.off { color: var(--dim); opacity: .32; filter: grayscale(100%); }
        .s-night-effect.unknown { color: var(--dim); opacity: .42; filter: grayscale(100%); }
        .s-night-effect .g-icon { width: 20px; height: 20px; object-fit: contain; }

        .s-friendly-fleet {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 19px;
            height: 18px;
            margin-left: 2px;
            color: var(--dim);
            flex: 0 0 19px;
            cursor: help;
            outline: none;
        }

        .s-friendly-fleet img {
            display: block;
            width: 18px;
            height: 18px;
            object-fit: contain;
        }

        .s-friendly-fleet.off { opacity: .32; filter: grayscale(100%); }
        .s-friendly-fleet.on { filter: drop-shadow(0 0 3px color-mix(in srgb, var(--sparkle) 65%, transparent)); }

        /* 友軍提示沿用系統 tooltip，但把艦名拆成清單；每艘船各佔一行，避免
           以斜線串接時被固定寬度裁切。title 仍保留作為原生提示的後備。 */
        .s-friendly-hover {
            position: absolute;
            left: 50%;
            bottom: calc(100% + 4px);
            z-index: 6;
            display: none;
            min-width: max-content;
            max-width: calc(100vw - 16px);
            padding: 3px 6px;
            transform: translateX(-50%);
            border: 1px solid #9b9b9b;
            border-radius: 3px;
            background: #f4f4f4;
            color: #171717;
            box-shadow: 0 2px 6px rgba(0, 0, 0, .28);
            font-size: 9px;
            font-weight: 500;
            line-height: 1.25;
            white-space: normal;
            overflow-wrap: anywhere;
            pointer-events: none;
        }

        .s-friendly-hover > span { display: block; }
        .s-friendly-fleet:hover .s-friendly-hover,
        .s-friendly-fleet:focus-visible .s-friendly-hover { display: block; }
        .s-friendly-fleet:focus-visible { outline: 1px solid var(--sparkle); outline-offset: 1px; }

        .s-night-entry-group {
            display: inline-flex;
            flex-direction: row;
            align-items: center;
            gap: 3px;
            height: 18px;
            min-width: 0;
            margin-left: auto;
            padding-left: 8px;
            white-space: nowrap;
        }

        .s-night-entry-moon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            height: 18px;
            flex: 0 0 16px;
        }

        .s-night-moon { display: block; width: 16px; height: 16px; object-fit: contain; }

        .s-night-entry-cells {
            display: inline-flex;
            flex-direction: column;
            justify-content: center;
            gap: 2px;
            height: 18px;
        }

        .s-night-entry-cell {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            height: 8px;
            min-width: 0;
            color: var(--dim);
            font-size: 8px;
            line-height: 1;
        }

        .s-night-entry-cell span {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .s-night-entry-cell i {
            width: 5px;
            height: 5px;
            border: 1px solid currentColor;
            border-radius: 50%;
            opacity: .62;
        }

        .s-night-entry-cell.active { color: var(--sparkle); font-weight: 700; }
        .s-night-entry-cell.active i { background: currentColor; opacity: 1; }
        .s-night-entry-group.unknown .s-night-entry-cell { opacity: .82; }
        /* 沒有夜戰的日戰仍保留月亮／主隊／伴隨占位，與未發動夜戰裝備同樣轉暗。 */
        .s-night-entry-group.unavailable { opacity: .34; }

        .s-action-rail.with-system {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            column-gap: 8px;
            height: 35px;
            min-height: 35px;
            margin-top: 4px;
            border-top: 0;
        }

        .s-action-rail.with-system > .s-system-rail,
        .s-action-rail.with-system > .s-drop-slot {
            min-width: 0;
            max-width: 100%;
        }

        .s-action-rail.with-system > .s-system-rail { grid-column: 1; }
        .s-action-rail.with-system > .s-drop-slot { grid-column: 2; }

        .s-system-rail {
            display: grid;
            /* 不設最小欄寬，否則五格加總會超出左欄而壓到右側掉落模組。欄寬依各格最寬
               內容分配：支援與陸航常同時出現四字標籤（砲擊支援＋陸航抵達），多留寬度
               才不會黏成一串；索敵要放得下英文 Missed，觸接要放得下敵我並排的 30px
               圖示，對空 CI 只需 Typ n。與掉落格的距離由本列的 padding-inline-end 保留。 */
            grid-template-columns: minmax(0, 36fr) minmax(0, 36fr) minmax(0, 33fr) minmax(0, 31fr) minmax(0, 24fr);
            column-gap: 2px;
            width: 100%;
            /* 與右側掉落格保留一個欄內安全邊界；370px 面板在放大顯示時，
               對空 CI 的圖示與文案也不能越過左欄邊界。 */
            box-sizing: border-box;
            height: 35px;
            min-height: 35px;
            padding: 0;
            padding-inline-end: 6px;
            border: 0;
        }

        .s-system-signal {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0;
            min-width: 0;
            color: var(--dim);
            overflow: visible;
            line-height: 1;
        }

        .s-system-glyph {
            display: block;
            width: 18px;
            height: 15px;
            flex: 0 0 15px;
            overflow: visible;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.35;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .s-system-glyph.support-shell,
        .s-system-glyph.support-torpedo { width: 24px; }

        .s-system-glyph .support-ship-raster,
        .s-system-glyph .support-torpedo-raster,
        .s-system-glyph .support-aircraft-raster,
        .s-system-glyph .support-asw-raster,
        .s-system-glyph .lbas-aircraft-raster,
        .s-system-glyph .aaci-gun-raster {
            display: block;
            width: 18px;
            height: 15px;
            object-fit: contain;
        }

        .s-system-glyph.support-shell .support-ship-raster { width: 24px; }
        .s-system-glyph.support-torpedo .support-torpedo-raster { width: 24px; height: 15px; }
        .s-system-glyph.support-asw .support-asw-raster { width: 18px; height: 15px; }

        .s-system-copy {
            display: inline-flex;
            align-items: baseline;
            justify-content: center;
            gap: 2px;
            max-width: 100%;
            min-width: 0;
            min-height: 9px;
            font-size: 8.5px;
            line-height: 1;
            white-space: nowrap;
        }

        .s-system-label,
        .s-system-val {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .s-system-label { color: var(--dim); font-size: 8.5px; font-weight: 500; }
        .s-system-val { color: currentColor; font-size: 8.5px; font-weight: 500; }
        .s-system-signal.on { color: var(--sparkle); }
        .s-system-signal.on .s-system-label { color: var(--sparkle); font-weight: 500; }
        /* 陸航／LBAS 與 LBAS in 是固定狀態文案，不能被共用省略號裁成半個字。 */
        .s-system-signal.lbas .s-system-label {
            overflow: visible;
            text-overflow: clip;
            font-size: 8px;
            letter-spacing: -.04em;
        }
        .s-system-signal.support .s-system-label {
            overflow: visible;
            text-overflow: clip;
            font-size: 8px;
            letter-spacing: -.04em;
        }
        /* 對空 CI／AACI 在未發動時顯示短標籤、發動後顯示 Typ n；兩種長度都必須
           保持完整，不能沿用其餘狀態欄的省略號。 */
        .s-system-signal.aaci .s-system-label,
        .s-system-signal.aaci .s-system-val {
            overflow: visible;
            text-overflow: clip;
            letter-spacing: -.06em;
            font-size: 7.5px;
        }
        .s-system-signal.off .s-system-glyph { opacity: .38; filter: grayscale(100%); }
        .s-system-signal.off .s-system-copy { color: var(--dim); }
        .s-system-signal:hover { z-index: 5; }

        .s-system-hover {
            position: absolute;
            left: 50%;
            bottom: calc(100% + 4px);
            display: none;
            flex-direction: column;
            align-items: flex-start;
            gap: 2px;
            min-width: max-content;
            padding: 3px 6px;
            transform: translateX(-50%);
            border: 1px solid #9b9b9b;
            border-radius: 3px;
            background: #f4f4f4;
            color: #171717;
            box-shadow: 0 2px 6px rgba(0, 0, 0, .28);
            font-size: 9px;
            line-height: 1.2;
            white-space: nowrap;
            pointer-events: none;
        }

        .s-system-hover b { color: #171717; font-weight: 700; }
        .s-system-hover i { color: var(--dmg-major); font-style: normal; font-weight: 700; }
        .s-system-signal:hover .s-system-hover,
        .s-system-signal:focus-within .s-system-hover { display: flex; }

        /* AACI 裝備逐項換行；長裝備名在面板寬度內折行，不讓整串內容被右緣裁掉。 */
        .s-system-signal.aaci .s-system-hover {
            min-width: 0;
            width: max-content;
            max-width: calc(100vw - 16px);
            white-space: normal;
            overflow-wrap: anywhere;
            line-height: 1.25;
        }

        .s-system-signal.aaci .s-system-hover > span { display: block; }
        .s-system-signal.aaci .s-aaci-gear { padding-left: 4px; }

        .s-system-glyph.contact-both {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            width: 30px;
            height: 18px;
            flex: 0 0 30px;
            overflow: visible;
        }

        .s-system-glyph.contact-both .contact-sub {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 13px;
            height: 16px;
            flex: 0 0 13px;
            overflow: visible;
        }

        .s-system-glyph.contact-both .contact-sub .g-icon,
        .s-system-glyph.contact-both .deepsea-aircraft-raster {
            display: block;
            width: 13px;
            height: 13px;
            object-fit: contain;
        }

        .s-system-glyph.contact-single {
            position: relative;
            width: 20px;
            height: 18px;
            overflow: visible;
        }

        .s-system-glyph.contact-single > .g-icon,
        .s-system-glyph.contact-single > .deepsea-aircraft-raster {
            display: block;
            width: 16px;
            height: 16px;
            margin: 1px auto;
            object-fit: contain;
        }

        .s-contact-fallback { display: block; color: currentColor; font-size: 9px; line-height: 18px; text-align: center; }

        .s-contact-hover {
            position: absolute;
            left: 50%;
            bottom: calc(100% + 4px);
            z-index: 20;
            display: none;
            min-width: max-content;
            padding: 3px 6px;
            transform: translateX(-50%);
            border: 1px solid #9b9b9b;
            border-radius: 3px;
            background: #f4f4f4;
            color: #171717;
            box-shadow: 0 2px 6px rgba(0, 0, 0, .28);
            font-size: 9px;
            line-height: 1.2;
            white-space: nowrap;
            pointer-events: none;
        }

        .s-contact-hover.both { flex-direction: column; align-items: flex-start; gap: 2px; }
        .s-system-glyph.contact-single:hover .s-contact-hover,
        .s-system-glyph.contact-both:hover .s-contact-hover { display: inline-flex; }

        .s-system-glyph.search .search-sweep { fill: currentColor; stroke: currentColor; stroke-width: .35; opacity: .34; }
        .s-system-glyph.search .search-ring.outer { stroke-width: 1.15; }
        .s-system-glyph.search .search-ring.middle { stroke-width: .8; opacity: .62; }
        .s-system-glyph.search .search-ring.inner { stroke-width: .7; opacity: .54; }
        .s-system-glyph.search .search-grid { stroke-width: .7; opacity: .48; }
        .s-system-glyph.search .search-needle { stroke-width: 1; opacity: .84; }
        .s-system-glyph.search .search-center,
        .s-system-glyph.search .search-blip { fill: currentColor; stroke: none; }

        .s-drop-slot {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
            height: 35px;
            border: 1px solid var(--line);
            border-radius: 4px;
            background: color-mix(in srgb, var(--panel) 30%, transparent);
        }

        /* 已有掉落內容只保留底色；空欄同樣保留底色，但不再用外框搶占注意力。 */
        .s-drop-slot.filled {
            border: 0;
        }

        .s-drop-slot.empty {
            border: 0;
            color: var(--dim);
            font-size: 10px;
            line-height: 1;
            text-align: center;
            letter-spacing: 0;
        }
        .s-drop-chip.sakura-drop { display: inline-flex; align-items: center; justify-content: center; gap: 5px; max-width: 100%; min-width: 0; }
        .sakura-drop-icon { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; flex: 0 0 24px; }
        .s-sakura-anchor { display: block; width: 24px; height: 24px; object-fit: contain; }
        .s-sakura-anchor.new {
            filter:
                drop-shadow(0 0 5px rgba(255, 218, 105, .92))
                drop-shadow(0 0 13px rgba(236, 169, 42, .62));
        }
        .s-sakura-anchor.owned { opacity: .88; }
        .sakura-drop-name { max-width: calc(100% - 29px); overflow: hidden; color: #e2bb67; font-size: 9.5px; font-weight: 600; line-height: 1; text-overflow: ellipsis; white-space: nowrap; }
        .sakura-drop.owned .sakura-drop-name { color: #8ea0b0; }

        /* ── 出擊紀錄（紀錄分頁）── */
        .h-group {
            margin-bottom: 10px;
        }

        .h-head {
            display: flex;
            gap: 8px;
            align-items: baseline;
            font-size: 12px;
            border-bottom: 1px solid var(--line);
            padding-bottom: 2px;
            margin-bottom: 3px;
        }

        .h-head b {
            color: var(--sparkle);
        }

        .h-head .dim {
            font-size: 10px;
        }

        .h-row {
            display: flex;
            gap: 8px;
            align-items: center;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
        }

        .h-row:nth-child(even) {
            background: var(--panel);
        }

        .h-row.raid .grow {
            color: var(--dmg-mid);
        }

        .h-node {
            width: 24px;
            text-align: center;
            font-weight: 700;
            color: var(--dim);
            font-size: 10px;
            flex: none;
        }

        .h-node.boss {
            color: #ff4444;
        }

        .h-node.boss::after {
            content: '★';
            font-size: 8px;
        }

        .h-rank {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            flex: none;
        }

        .h-rank.rank-s { color: #f1c40f; border-color: #f1c40f; }
        .h-rank.rank-a { color: #e74c3c; border-color: #e74c3c; }
        .h-rank.rank-b { color: #d35400; border-color: #d35400; }
        .h-rank.rank-c { color: #95a5a6; border-color: #7f8c8d; }
        .h-rank.rank-d, .h-rank.rank-e { color: #7f8c8d; border-color: #566060; }

        .h-seiku {
            font-size: 10px;
            white-space: nowrap;
        }

        .h-seiku.sk-1 { color: #58a55c; }   /* 確保 */
        .h-seiku.sk-2 { color: #82ccdd; }   /* 優勢 */
        .h-seiku.sk-0 { color: var(--dim); } /* 互角 */
        .h-seiku.sk-3, .h-seiku.sk-4 { color: var(--dmg-major); }  /* 劣勢/喪失 */

        .h-taiha {
            font-size: 10px;
            color: #fff;
            background: var(--dmg-major);
            border-radius: 6px;
            padding: 0 5px;
            white-space: nowrap;
        }

        .h-drop {
            font-size: 10px;
            color: var(--sparkle);
            white-space: nowrap;
        }

        /* ── 待驗證封包（自動擷取）── */
        .wanted-row {
            display: flex;
            gap: 8px;
            align-items: center;
            padding: 4px 6px;
            border-radius: 4px;
            font-size: 11px;
        }

        .wanted-row:nth-child(odd) {
            background: var(--panel);
        }

        .wanted-tag {
            font-size: 10px;
            font-weight: 600;
            color: var(--sparkle);
            border: 1px solid var(--sparkle);
            border-radius: 8px;
            padding: 0 7px;
            white-space: nowrap;
        }

        .wanted-path {
            color: var(--dim);
            font: 10px/1.4 ui-monospace, monospace;
        }

        .wanted-row button {
            background: none;
            border: 1px solid var(--line);
            color: var(--text);
            border-radius: 4px;
            padding: 2px 8px;
            font-size: 10px;
            cursor: pointer;
        }

        .wanted-row button:hover {
            border-color: var(--brass);
        }

        .wanted-row button.copied {
            color: #58a55c;
            border-color: #58a55c;
        }

        .wanted-row button.failed {
            color: var(--dmg-major);
            border-color: var(--dmg-major);
        }

        /* 刪除鈕：語彙上比「複製」次要，平時只有邊框、hover 才轉警示色 */
        .wanted-row button.wanted-del {
            color: var(--dim);
        }

        .wanted-row button.wanted-del:hover {
            color: var(--dmg-major);
            border-color: var(--dmg-major);
        }

        /* 上限說明與清除入口：擷取有上限（見 main.ts captureWanted），
           使用者必須看得到目前用量與「刪掉就能再擷取」這件事 */
        .wanted-foot {
            display: flex;
            gap: 8px;
            align-items: center;
            padding: 4px 6px;
            font-size: 10px;
            color: var(--dim);
            letter-spacing: var(--track-label);
        }

        .wanted-foot.warn {
            color: var(--brass);
        }

        .wanted-foot button {
            background: none;
            border: 1px solid var(--line);
            color: var(--dim);
            border-radius: 4px;
            padding: 2px 8px;
            font-size: 10px;
            cursor: pointer;
        }

        .wanted-foot button:hover {
            color: var(--dmg-major);
            border-color: var(--dmg-major);
        }

        /* ── 工廠分頁 ── */
        .fac-controls {
            display: flex;
            align-items: center;
            margin-bottom: 6px;
        }

        /* akashi-list 外部連結：唯一的出站連結，做成按鈕樣（與 wanted-row button 同語彙） */
        .akashi-link {
            font-size: 11px;
            color: #82ccdd;
            text-decoration: none;
            border: 1px solid var(--line);
            border-radius: 4px;
            padding: 2px 8px;
            white-space: nowrap;
        }

        .akashi-link:hover {
            border-color: #82ccdd;
        }

        /* 最新開發/改修結果看板：卡片式，與出擊分頁的資訊區塊同視覺層級 */
        .fac-card {
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 6px 8px;
            margin-bottom: 8px;
            background: var(--panel);
        }

        .fac-card h4 {
            margin: 0 0 4px;
            font-size: 11px;
            color: var(--dim);
            font-weight: 600;
            display: flex;
            gap: 8px;
            align-items: baseline;
        }

        .fac-result-row {
            display: flex;
            gap: 8px;
            align-items: center;
            font-size: 12px;
            padding: 2px 0;
        }

        /* 紀錄列：沿用 .h-row 節奏（斑馬紋、圓角、11px） */
        .f-row {
            display: flex;
            gap: 8px;
            align-items: center;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
        }

        .f-row:nth-child(even) {
            background: var(--panel);
        }

        /* 種別徽章：開發／建造／改修（與 .h-rank 同語彙的描邊字） */
        .f-kind {
            width: 26px;
            text-align: center;
            flex: none;
            font-size: 10px;
            font-weight: 700;
            border: 1px solid var(--line);
            border-radius: 4px;
        }

        .f-kind.develop { color: #82ccdd; border-color: #82ccdd; }
        .f-kind.build { color: var(--dmg-mid); border-color: var(--dmg-mid); }
        .f-kind.improve { color: #c39bd3; border-color: #c39bd3; }
        .f-kind.speedup { color: var(--sparkle); border-color: var(--sparkle); }

        /* 投入資材（配方）：圖示＋數字成組，數字用等寬變體便於掃讀 */
        .f-res {
            display: inline-flex;
            gap: 5px;
            align-items: center;
            white-space: nowrap;
            font-size: 10px;
            color: var(--dim);
            font-variant-numeric: tabular-nums;
        }

        .f-res b {
            color: var(--text);
            font-weight: 600;
        }

        .f-ok { color: #58a55c; }
        .f-ng { color: var(--dmg-major); }
        .f-fail { color: var(--stub); }

        /* 改修等級變化：★n → ★n+1 */
        .f-lv {
            color: var(--sparkle);
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }

        .taiha-alert {
            background: rgba(224, 85, 85, 0.1);
            border: 1px solid var(--dmg-major);
            color: #ff6b6b;
            padding: 4px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            text-align: center;
            animation: pulse 2s infinite;
        }

        /* 大破警告定位在航空戰欄，絕對定位使戰況列高度不受警告狀態影響。 */
        .s-taiha {
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            bottom: 0;
            display: block;
            width: 100%;
            height: 100%;
            margin: 0;
            font-family: inherit;
            line-height: 1.3;
            box-sizing: border-box;
        }

        .s-taiha.open {
            /* 展開態只覆蓋航空戰格本身，避免壓住上方敵我欄標。 */
            top: 0;
            bottom: 0;
            min-height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            text-align: center;
            /* 展開態要真的遮住底下的機數，故底色不透明（同 prefers-reduced-transparency
               的處理手法：把同色相混進 --panel 而不是疊在透明上）。 */
            background: color-mix(in srgb, var(--dmg-major) 18%, var(--panel));
        }

        .taiha-head {
            display: block;
        }

        /* 展開態讓字典裡的 \n 成為實際斷行。警告框只有約 180px 寬、航空戰格 44px 高；
           中日文沒有空格可斷，斷點必須由各語言自己決定（見 ui-i18n.ts）。英文用與
           「大破！」同密度的短句，避免空格折行畫出格外。文字隱藏態不顯示文案，紅框
           與航空戰欄位尺寸維持不變。 */
        .s-taiha.open .taiha-head,
        .s-taiha.open .taiha-hint {
            white-space: pre-line;
            max-width: 100%;
            overflow: hidden;
        }

        /* 大破警告（旗艦與一般）點擊後只隱藏文字，紅框與原本占位維持不變。 */
        .s-taiha-toggle {
            cursor: pointer;
        }

        .s-taiha.open.s-taiha-toggle.details-hidden {
            background: transparent;
        }

        .s-taiha-toggle.details-hidden .taiha-head,
        .s-taiha-toggle.details-hidden .taiha-hint {
            display: none;
        }

        /* 可切換的提示：右上角折角。展開態是掀起的紙角（暗角＋亮色翻面），表示底下還有內容；
           隱藏態改為實心紅角標，表示警告收在這裡、可再翻回來。角落 10px 內不會壓到置中的
           敵我欄標與機數，也不依語言長度變動。 */
        .s-taiha-toggle {
            transition: border-color 100ms ease-out, background 100ms ease-out, transform 100ms ease-out;
        }

        .taiha-flip {
            position: absolute;
            top: 0;
            right: 0;
            width: 9px;
            height: 9px;
            pointer-events: none;
            border-bottom-left-radius: 2px;
            background: linear-gradient(225deg,
                    var(--panel) 50%,
                    color-mix(in srgb, #ffffff 55%, var(--dmg-major)) 50%);
            box-shadow: -1px 1px 2px rgba(0, 0, 0, 0.35);
            transition: width 100ms ease-out, height 100ms ease-out;
        }

        .s-taiha-toggle.details-hidden .taiha-flip {
            border-bottom-left-radius: 0;
            background: linear-gradient(225deg, var(--dmg-major) 50%, transparent 50%);
            box-shadow: none;
        }

        .s-taiha-toggle:hover {
            border-color: #ff8a8a;
        }

        .s-taiha-toggle:hover .taiha-flip {
            width: 13px;
            height: 13px;
        }

        .s-taiha.open.s-taiha-toggle.details-hidden:hover {
            background: rgba(224, 85, 85, 0.08);
        }

        .s-taiha-toggle:active {
            transform: scale(.97);
        }

        .s-taiha-toggle:focus-visible {
            outline: 2px solid var(--sparkle);
            outline-offset: -2px;
        }

        /* 退避提示（旗艦帶司令部施設時）：附在大破警告內的第二行，弱化成說明語氣——
           警告本身講「有轟沈風險」，這行講「還有一條路可走」，不該搶同樣的視覺強度。 */
        .taiha-hint {
            display: block;
            font-weight: normal;
            font-size: 11px;
            color: var(--dim);
        }

        /* 退避艦：聯合仍整列淡出；單隊列改對艦種／身分／輔助／第二 sweep 淡出，
           32px 狀態槽的退避標籤保持可讀對比。退避不是傷害等級，故刻意不用 --dmg-*
           語意色（design-guidelines §4.5：語意色不跨功能挪用）。 */
        .ship.escaped {
            opacity: 0.5;
        }

        .ship:has(.ship-body).escaped {
            opacity: 1;
        }

        .ship:has(.ship-body).escaped .ship-kind-status > .stype,
        .ship:has(.ship-body).escaped .ship-id,
        .ship:has(.ship-body).escaped .ship-hp > *,
        .ship:has(.ship-body).escaped .ship-gear-row {
            opacity: 0.5;
        }

        .esc-tag {
            margin-left: 4px;
            padding: 0 4px;
            border: 1px solid var(--line);
            border-radius: 6px;
            font-size: 9px;
            color: var(--dim);
            vertical-align: middle;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(224, 85, 85, 0.4); }
            70% { box-shadow: 0 0 0 6px rgba(224, 85, 85, 0); }
            100% { box-shadow: 0 0 0 0 rgba(224, 85, 85, 0); }
        }

        /* ── 無障礙偏好 ──
           減少動態不等於取消回饋，而是換成不會引發前庭不適的等效表現：
           大破警告是本面板最重要的即時訊號，脈動改為靜態強調光暈，警示強度不變。 */
        @media (prefers-reduced-motion: reduce) {
            .taiha-alert {
                animation: none;
                box-shadow: 0 0 0 3px rgba(224, 85, 85, 0.35);
            }

            #tabs button,
            .ab-tabs button {
                transition: none;
            }

            .ab-tabs button:active,
            .s-taiha-toggle:active {
                transform: none;
            }

            .s-taiha-toggle,
            .taiha-flip {
                transition: none;
            }
        }

        /* 降低透明：本面板的半透明底色（color-mix 疊到 transparent、警告框的 rgba）
           使用不透明底——同色相直接混進 --panel，色調維持一致但不透出底下內容。 */
        @media (prefers-reduced-transparency: reduce) {

            .ship-body > .stype,
            .c-top .stype {
                background: color-mix(in srgb, var(--brass) 14%, var(--panel));
                border-color: color-mix(in srgb, var(--brass) 40%, var(--panel));
            }

            .fs-tick.mission {
                background: color-mix(in srgb, var(--brass) 12%, var(--panel));
            }

            .dock-mark {
                background: color-mix(in srgb, #7fd0ff 10%, var(--panel));
            }

            .timer-row .fleet-box,
            .ab-tabs button.on {
                background: color-mix(in srgb, var(--brass) 14%, var(--panel));
            }

            .s-drop {
                background: color-mix(in srgb, var(--line) 30%, var(--panel));
            }

            .s-drop.new {
                background: color-mix(in srgb, var(--sparkle) 12%, var(--panel));
            }

            /* `.s-taiha.open` 自己就用不透明底（要遮住機數），但選擇器比 .taiha-alert
               specific，這裡若不一併列出，收縮／展開兩態會有一態吃不到覆寫。 */
            .taiha-alert,
            .s-taiha.open {
                background: color-mix(in srgb, var(--dmg-major) 18%, var(--panel));
            }
        }

        /* 高對比：邊界改為明確可見、弱化文字提高亮度；深淺主題各自調整。
           大破警告使用實心底＋深色字，避免只靠淡紅底表示。 */
        @media (prefers-contrast: more) {
            :root {
                --line: #6b7a95;
                --dim: #a9b4c6;
                --stub: #7f8a9e;
            }

            :root[data-theme="light"] {
                --line: #8a8375;
                --dim: #4a5160;
                --stub: #7a8291;
            }

            /* 實心紅底：`.s-taiha.open` 的自帶底色選擇器較 specific，必須一併列出。 */
            .taiha-alert,
            .s-taiha.open {
                background: var(--dmg-major);
                color: #10151d;
            }

            /* 補充行使用主色再降透明度，
               維持「弱化成說明語氣」的層次但不犧牲可讀性。 */
            .taiha-alert .taiha-hint {
                color: inherit;
                opacity: 0.85;
            }

            #tabs button.on {
                color: var(--text);
                border-bottom-width: 3px;
            }

            /* 疲勞表情：11px 下線條細，高對比模式加粗描邊。SVG 尺寸不變，零版面影響。 */
            .ab-sq .cond-face * {
                stroke-width: 1.8;
            }

            /* 高對比模式：輪廓加粗、標籤改用主文字色。仍用 inset box-shadow，維持零版面影響
               ——這裡改 border-width 會讓量表在高對比下比一般模式高，狀態一切換就位移。 */
            .s-gauge.zansatsu .s-gauge-bar {
                box-shadow: inset 0 0 0 2px var(--sparkle);
            }

            .s-gauge.zansatsu .s-gauge-final {
                color: var(--text);
            }
        }

        /* 一般分頁沿用主分頁的底線導覽，數值欄位以等寬數字對齊。 */
        #tabpanel.has-general>#tab-general.ledger{display:grid;flex:1;grid-template-rows:27px minmax(0,1fr);gap:6px}
        .ledger-nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-bottom:1px solid var(--line)}
